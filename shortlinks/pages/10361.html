<meta name="description" content="В федеральный суд Сан-Франциско на этой неделе подали коллективный иск против OpenAI от имени двух несовершеннолетних — 12 и 16 лет. Истцы утверждают, что компания побуждала детей делиться чувствительной информацией без действительного согласия родителей, а затем использовала эти данные, включая личные секреты и сведения о здоровье, чтобы обучать модели и получать прибыль. Иск также требует, чтобы OpenAI выплачивала компенсацию несовершеннолетним, чьи данные собрала. Один из примеров в иске — 12-летняя жительница Гавайев, которая, по утверждению истцов, рассказывала ChatGPT о проблемах с питанием и отправляла фотографии, прося оценить её внешность.">
