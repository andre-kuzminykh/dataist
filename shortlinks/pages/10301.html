<meta name="description" content="Microsoft планирует с 2027 года разворачивать собственные чипы Azure Maia в масштабах нескольких гигаватт. Они станут основной системой инференса для продуктов компании, пишет руководитель Скотт Гатри. Maia 200 уже обслуживают Microsoft Copilot в США, Европе и Австралии; до конца года к ним подключат GitHub Copilot и Foundry. Гендиректор Microsoft Сатья Наделла назвал проект крупнейшей ставкой компании на собственные чипы. Maia работают с моделями OpenAI, MAI и моделями с открытым исходным кодом. По данным Microsoft, в Teams они обрабатывают до 1,7 раза больше токенов на ватт, чем ведущие графические процессоры.">
