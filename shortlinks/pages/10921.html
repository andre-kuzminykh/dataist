<meta name="description" content="Офисные специалисты уходят из привычных профессий, опасаясь, что ИИ изменит их работу или лишит её смысла. Данные пока не показывают массовых увольнений из-за этой технологии: в США с ней связывают около 1 млн созданных рабочих мест и 200 тыс. сокращений. Но 71% американцев считают, что в ближайшие 20 лет ИИ приведёт к уменьшению числа рабочих мест. Работники уже принимают решения, исходя из этого страха: меняют сферу, ищут дополнительный заработок или выбирают занятия, которые считают более устойчивыми и соответствующими своим ценностям.">
