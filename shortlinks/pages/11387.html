<meta name="description" content="OpenAI подала в суд на Apple, обвинив компанию в краже коммерческих тайн и недобросовестной конкуренции. Иск поступил в пятницу в суд Калифорнии, сообщает Financial Times. По утверждению OpenAI, Apple угрожает поставщикам, работающим с обеими компаниями, и использует своё влияние на рынке, чтобы ограничивать конкуренцию. OpenAI также заявила, что Apple поощряет сотрудников хранить рабочие данные на личных устройствах, а затем использует эту практику против тех, кто хочет уволиться.">
