<meta name="description" content="Партнёр G2 Venture Partners Брук Портер считает, что будущие дата-центры для ИИ стоит строить с опорой на солнечную энергию и системы длительного хранения. Мировые мощности по производству природного газа увеличиваются примерно на 60–70 ГВт в год, тогда как солнечная энергетика уже прибавляет более 1 ТВт. По оценке G2VP, инвестиции в дата-центры до конца десятилетия превысят 4 трлн долларов. Солнечные станции и накопители могут помочь строить крупные объекты независимо от электросети и быстрее подключать новые мощности.">
