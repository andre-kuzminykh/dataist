<meta name="description" content="Anthropic закрыла первичное публичное размещение акций и параллельную частную сделку. Компания продала 1,103 млрд акций класса A по $83 за штуку, а акционеры — ещё 23,6 млн; с учётом полностью использованной опции банков на покупку дополнительных 147 млн акций общий объём размещения составил 1,127 млрд. Anthropic получила около $91,6 млрд из $93,5 млрд валовой выручки от IPO. Ещё 313,3 млн акций класса N на $26 млрд приобрели семь компаний, включая Google, Microsoft и NVIDIA. Совокупная валовая выручка IPO и частной сделки достигла примерно $119,5 млрд.">
