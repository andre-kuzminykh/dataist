<meta name="description" content="В Окленде, штат Калифорния, 94,1% членов профсоюза городских работников 22 октября проголосовали за забастовку: их беспокоит, что ИИ усилит слежку и станет причиной несправедливой оценки труда. До стачки, назначенной на 5 ноября, дело пока не дошло: город и профсоюз согласовали предварительный договор на три года. Он обязывает переобучать или переводить на другие должности сотрудников, чью работу вытеснит ИИ, вместо того чтобы увольнять их. Профсоюзы по всей стране добиваются похожих гарантий на фоне распространения автоматизации: по опросу Ernst and Young, проведённому с июля по август 2026 года, почти 70% органов власти штатов и местных администраций уже внедрили или внедряют генеративный ИИ.">
