<meta name="description" content="Claude от Anthropic меньше чем за 30 минут выяснил, откуда взялись начальные значения для некоторых криптографических кривых, стандартизированных NIST в 2000 году. Их предоставило АНБ без объяснений, что вызывало подозрения о возможных скрытых уязвимостях. Модель связала значения с генератором случайных чисел lrand48 и временными метками Unix за период с мая 1997-го по апрель 1998-го. По оценке Anthropic, разгадка снижает вероятность намеренно заложенных уязвимостей. Компания передаст премию в $36 864 группе Internet Security Research Group.">
