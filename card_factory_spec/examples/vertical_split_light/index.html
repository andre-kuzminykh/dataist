<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЭТАЛОН · Формат 3 — вертикаль «контент + субтитры» (белый) 1080×1920</title>
<style>
/* ============================================================================
   ЭТАЛОН ФОРМАТА 3 («Рилс с субтитрами»): вертикаль 1080×1920, БЕЛЫЙ фон.
   Сверху — инфографика (белая), снизу — блок субтитров (караоке-подсветка слов),
   между ними — фиолетово-оранжевая палочка-разделитель. Бренд «Академия Датаиста».
   Staged-появление элементов по очереди + непрерывная «жизнь» = бесшовный цикл.
   ============================================================================ */
@font-face{font-family:'JetBrains Mono';font-weight:400;src:url('../../assets/fonts/JetBrainsMono-400.ttf') format('truetype')}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url('../../assets/fonts/JetBrainsMono-500.ttf') format('truetype')}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url('../../assets/fonts/JetBrainsMono-700.ttf') format('truetype')}
@font-face{font-family:'JetBrains Mono';font-weight:800;src:url('../../assets/fonts/JetBrainsMono-800.ttf') format('truetype')}

:root{--flame:#F97316;--plum:#8854F3;--ink:#0A0A0A;--scale:1;
  --mono:'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#dfe0e4;color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased;overflow-x:hidden}

#deck{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
.card{position:absolute;width:1080px;height:1920px;overflow:hidden;background:#FAFAFA;border-radius:10px;
  transform:scale(var(--scale));opacity:0;visibility:hidden;transition:opacity .4s;display:flex;flex-direction:column}
.card.active{opacity:1;visibility:visible}
body.export #deck{position:static;display:block;height:auto;padding:24px 0}
body.export .card{position:relative;opacity:1;visibility:visible;transform:none;margin:0 auto 30px;box-shadow:0 18px 60px rgba(0,0,0,.25)}
.grain{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.4;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:200px 200px}
.ico{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- бренд + счётчик ---------- */
.top-bar{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:56px 72px 0}
.brand{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:800;letter-spacing:.02em;text-transform:lowercase}
.brand .mk{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--plum),var(--flame))}
.brand .mk svg{width:26px;height:26px}
.brand .grad{background:linear-gradient(120deg,var(--plum),var(--flame) 60%,var(--plum));background-size:220% 220%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:gshift 5s ease-in-out infinite}
.count{font-size:22px;font-weight:700;letter-spacing:.18em;color:rgba(10,10,10,.34)}

/* ---------- ВЕРХ: инфографика ---------- */
.top{position:relative;z-index:4;flex:1 1 auto;padding:40px 90px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center}
.kicker{font-size:24px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--plum)}
.title{font-size:66px;font-weight:800;letter-spacing:-.02em;margin:0;white-space:nowrap}
.subtitle{font-size:32px;font-weight:500;color:rgba(10,10,10,.55);margin:0}

.pcard{width:640px;border:2.4px solid;border-radius:26px;background:#fff;padding:30px 30px 34px;box-shadow:0 12px 30px rgba(20,20,40,.08)}
.pcard.prompt{border-color:var(--plum)}
.pcard.answer{border-color:var(--flame)}
.ph{display:flex;align-items:center;gap:16px;font-size:34px;font-weight:800;letter-spacing:.06em;margin-bottom:24px}
.pcard.prompt .ph{color:var(--plum)}.pcard.answer .ph{color:var(--flame)}
.ph svg{width:40px;height:40px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.prow{border:1.8px solid;border-radius:15px;padding:18px 20px;font-size:27px;font-weight:700;text-align:left}
.arows{display:flex;flex-direction:column;gap:16px}
.aline{height:20px;border-radius:10px;background:rgba(10,10,10,.1)}
.downarr{color:var(--flame)}
.downarr svg{width:52px;height:52px;transform:rotate(90deg);animation:bob 1.8s ease-in-out infinite}
.chip{display:inline-flex;align-items:center;gap:12px;border:2px solid rgba(10,10,10,.14);background:rgba(10,10,10,.04);
  border-radius:999px;padding:16px 30px;font-size:28px;font-weight:700}
.chip svg{width:26px;height:26px;color:var(--flame)}

/* ---------- ПАЛОЧКА-РАЗДЕЛИТЕЛЬ ---------- */
.divider{position:relative;z-index:5;height:10px;flex:0 0 auto;
  background:linear-gradient(90deg,var(--plum),var(--flame));
  box-shadow:0 0 26px 2px rgba(249,115,22,.35)}
.divider::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
  transform:translateX(-40%);animation:sweep 3.2s ease-in-out infinite}

/* ---------- НИЗ: субтитры (караоке-подсветка) ---------- */
.subs{position:relative;z-index:4;flex:0 0 560px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;padding:0 84px;text-align:center;background:#F1F1F3}
.sublabel{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(10,10,10,.4)}
.sublabel .eq{display:flex;gap:5px;align-items:flex-end;height:26px}
.sublabel .eq i{width:5px;background:var(--flame);border-radius:3px;animation:eq 1s ease-in-out infinite}
.sublabel .eq i:nth-child(1){height:40%;animation-delay:0s}
.sublabel .eq i:nth-child(2){height:100%;animation-delay:.15s}
.sublabel .eq i:nth-child(3){height:60%;animation-delay:.3s}
.sublabel .eq i:nth-child(4){height:85%;animation-delay:.45s}
.capt{font-size:56px;font-weight:800;line-height:1.34;letter-spacing:-.01em;max-width:900px}
/* базовое (замороженное) состояние — читаемо (тёмным). Подсветка «бежит» по словам. */
.capt .w{display:inline-block;color:var(--ink);animation:wordpop 6s ease-in-out infinite both}

/* ====================== STAGED-ПОЯВЛЕНИЕ ====================== */
.st{animation-duration:6s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:ease}
@keyframes st1{0%,2%{opacity:0;transform:var(--hide,translateY(30px))}9%,90%{opacity:1;transform:none}97%,100%{opacity:0;transform:var(--hide,translateY(30px))}}
@keyframes st2{0%,7%{opacity:0;transform:var(--hide,translateY(30px))}14%,90%{opacity:1;transform:none}97%,100%{opacity:0;transform:var(--hide,translateY(30px))}}
@keyframes st3{0%,12%{opacity:0;transform:var(--hide,translateY(30px))}19%,90%{opacity:1;transform:none}97%,100%{opacity:0;transform:var(--hide,translateY(30px))}}
@keyframes st4{0%,17%{opacity:0;transform:var(--hide,translateY(30px))}24%,90%{opacity:1;transform:none}97%,100%{opacity:0;transform:var(--hide,translateY(30px))}}
@keyframes st5{0%,22%{opacity:0;transform:var(--hide,translateY(30px))}29%,90%{opacity:1;transform:none}97%,100%{opacity:0;transform:var(--hide,translateY(30px))}}
@keyframes st6{0%,27%{opacity:0;transform:var(--hide,translateY(30px))}34%,90%{opacity:1;transform:none}97%,100%{opacity:0;transform:var(--hide,translateY(30px))}}
@keyframes st7{0%,32%{opacity:0;transform:var(--hide,translateY(30px))}39%,90%{opacity:1;transform:none}97%,100%{opacity:0;transform:var(--hide,translateY(30px))}}
@keyframes st8{0%,37%{opacity:0;transform:var(--hide,translateY(30px))}44%,90%{opacity:1;transform:none}97%,100%{opacity:0;transform:var(--hide,translateY(30px))}}
.st1{animation-name:st1}.st2{animation-name:st2}.st3{animation-name:st3}.st4{animation-name:st4}
.st5{animation-name:st5}.st6{animation-name:st6}.st7{animation-name:st7}.st8{animation-name:st8}

/* «жизнь» */
@keyframes gshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes bob{0%,100%{transform:rotate(90deg) translateX(0)}50%{transform:rotate(90deg) translateX(9px)}}
@keyframes sweep{0%{transform:translateX(-60%)}55%,100%{transform:translateX(160%)}}
@keyframes eq{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
/* караоке: по словам бежит фиолетовая подсветка; смещение задаётся animation-delay
   на каждом слове (см. inline-стили). Слова в покое читаемы тёмным. */
@keyframes wordpop{
  0%,88%,100%{color:var(--ink);transform:translateY(0) scale(1)}
  6%{color:var(--plum);transform:translateY(-5px) scale(1.09)}
  14%{color:var(--ink);transform:translateY(0) scale(1)}
}

#nav{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;display:flex;gap:12px;
  background:rgba(20,20,26,.75);border-radius:999px;padding:10px 16px}
#nav button{background:rgba(255,255,255,.12);border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:17px;cursor:pointer}
body.export #nav{display:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-loop" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/></symbol>
<symbol id="i-chat-check" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/><path d="m8.5 9.6 2.2 2.2 4.4-4.4"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></symbol>
</defs></svg>

<div id="deck">
  <section class="card active" id="card-1">
    <div class="grain"></div>

    <div class="top-bar">
      <div class="brand"><span class="mk"><svg class="ico"><use href="#i-loop"/></svg></span>академия<span class="grad">&nbsp;датаиста</span></div>
      <div class="count">02 / 08</div>
    </div>

    <!-- ВЕРХ: инфографика (появляется по очереди) -->
    <div class="top">
      <div class="kicker st st1" style="--hide:translateY(-30px)">Уровень 1</div>
      <h2 class="title st st2" style="--hide:translateY(30px)">1. Prompt Engineering</h2>
      <p class="subtitle st st3">Учимся правильно просить модель</p>

      <div class="pcard prompt st st4" style="--hide:scale(.9) translateY(30px)">
        <div class="ph"><svg class="ico"><use href="#i-chat"/></svg>ПРОМТ</div>
        <div class="grid2">
          <div class="prow" style="border-color:var(--plum);color:var(--plum)">Роль</div>
          <div class="prow" style="border-color:var(--flame);color:var(--flame)">Формат</div>
          <div class="prow" style="border-color:var(--flame);color:var(--flame)">Ограничения</div>
          <div class="prow" style="border-color:var(--plum);color:var(--plum)">Примеры</div>
        </div>
      </div>

      <div class="downarr st st5" style="--hide:scale(.5)"><svg class="ico"><use href="#i-arrow"/></svg></div>

      <div class="pcard answer st st6" style="--hide:scale(.9) translateY(30px)">
        <div class="ph"><svg class="ico"><use href="#i-chat-check"/></svg>ОТВЕТ</div>
        <div class="arows">
          <div class="aline" style="width:92%"></div>
          <div class="aline" style="width:74%"></div>
          <div class="aline" style="width:60%"></div>
        </div>
      </div>

      <div class="chip st st7" style="--hide:scale(.7)">Один промт <svg class="ico"><use href="#i-arrow"/></svg> один ответ</div>
    </div>

    <!-- ПАЛОЧКА-РАЗДЕЛИТЕЛЬ фиолетово-оранжевая -->
    <div class="divider"></div>

    <!-- НИЗ: субтитры (караоке по словам) -->
    <div class="subs">
      <div class="sublabel st st7"><span class="eq"><i></i><i></i><i></i><i></i></span>Субтитры</div>
      <!-- animation-delay сдвинут в окно видимости блока (st8 виден с ~44%),
           чтобы караоке-подсветка попадала на экран, а не до появления субтитров -->
      <div class="capt st st8">
        <span class="w" style="animation-delay:2.4s">Хороший</span>
        <span class="w" style="animation-delay:2.8s">промт</span>
        <span class="w" style="animation-delay:3.2s">экономит</span>
        <span class="w" style="animation-delay:3.6s">часы</span>
        <span class="w" style="animation-delay:4s">вашей</span>
        <span class="w" style="animation-delay:4.4s">работы</span>
      </div>
    </div>
  </section>
</div>

<nav id="nav"><button id="prev">‹</button><button id="next">›</button></nav>
<script>
(function(){
  if(/[?&]export/.test(location.search)){document.body.classList.add('export');return;}
  function fit(){var s=Math.min((innerWidth-40)/1080,(innerHeight-100)/1920,1.1);
    document.documentElement.style.setProperty('--scale',s.toFixed(4));}
  addEventListener('resize',fit);fit();
})();
</script>
</body>
</html>
