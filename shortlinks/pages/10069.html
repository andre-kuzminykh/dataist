<meta name="description" content="В новой пьесе австралийского драматурга Тома Холлоуэя для Мельбурнской театральной компании действие переносится в 1966 год, к работе немецко-американского учёного Джозефа Вайценбаума над одной из первых программ, связанных с рождением искусственного интеллекта. Постановка напоминает о тревогах вокруг машин, которые будто бы понимают людей, но сюрреалистические приёмы отдаляют зрителя от героев. При этом актёрская игра и стремительный темп поддерживают спектакль, а его центральная мысль ясна: опасность не в том, что машины научатся думать как люди, а в том, что люди поверят, будто это уже происходит.">
