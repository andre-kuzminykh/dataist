<meta name="description" content="Claude почти самостоятельно разработал белки, нацеленные на нейротоксины скорпионов, от которых ежегодно погибают более 3250 человек. Модель создала 318 484 варианта белков-кандидатов против пяти токсинов четырёх видов скорпионов. После первого промта Claude работал самостоятельно 24 часа, затем исследователи направляли его дополнительными инструкциями. В лаборатории проверили 211 вариантов: 17 соответствовали критериям связывания с токсинами. Два лучших прочно связывались с токсином мексиканского скорпиона, но их способность действовать как противоядие ещё не проверяли.">
