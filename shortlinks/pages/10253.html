<meta name="description" content="ИИ-агенты не всегда понимают, насколько близки к результату и что делать дальше: могут тратить вычислительные ресурсы на неудачный подход, упускать перспективные решения или останавливаться раньше времени. Исследователи Meta Superintelligence Labs предложили фреймворк «метарассуждения агента»: отдельный процесс, который оценивает ход работы, ищет альтернативы и направляет ресурсы на следующие шаги. На бенчмарке ProgramBench связка с GPT-5.5 достигла 71,5% прохождения скрытых тестов против 58,0% у Codex. Подход помогает улучшать работу агентов, не меняя и не дообучая базовые модели.">
