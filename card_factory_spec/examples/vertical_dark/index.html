<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЭТАЛОН · Формат 2 — вертикальные тёмные вставки для рилсов 1080×1920</title>
<style>
/* ============================================================================
   ЭТАЛОН ФОРМАТА 2 («Рилсы»): вертикаль 1080×1920 (9:16), ВСЕ карточки тёмные.
   1 бит диктовки = 1 карточка, контент очень короткий (цифра / 2–4 слова /
   микро-схема). Staged-появление по очереди + непрерывная «жизнь» = залипание.
   ============================================================================ */
@font-face{font-family:'JetBrains Mono';font-weight:400;src:url('../../assets/fonts/JetBrainsMono-400.ttf') format('truetype')}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url('../../assets/fonts/JetBrainsMono-500.ttf') format('truetype')}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url('../../assets/fonts/JetBrainsMono-700.ttf') format('truetype')}
@font-face{font-family:'JetBrains Mono';font-weight:800;src:url('../../assets/fonts/JetBrainsMono-800.ttf') format('truetype')}

:root{--flame:#F97316;--plum:#8854F3;--scale:1;
  --mono:'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#111114;color:#F4F4F5;font-family:var(--mono);-webkit-font-smoothing:antialiased;overflow-x:hidden}

#deck{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
.card{position:absolute;width:1080px;height:1920px;overflow:hidden;background:#050505;border-radius:10px;
  transform:scale(var(--scale));opacity:0;visibility:hidden;transition:opacity .4s}
.card.active{opacity:1;visibility:visible}
body.export #deck{position:static;display:block;height:auto;padding:24px 0}
body.export .card{position:relative;opacity:1;visibility:visible;transform:none;margin:0 auto 30px}
.grain{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.06;mix-blend-mode:screen;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:200px 200px}
.logo{position:absolute;top:72px;left:76px;z-index:5;height:64px}
.logo img{height:64px;width:auto;display:block}
.idx{position:absolute;top:90px;right:80px;z-index:5;font-size:22px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.4)}
.ico{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.vb{position:absolute;left:90px;right:90px;top:220px;bottom:160px;z-index:4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;text-align:center}

/* ====================== STAGED-ПОЯВЛЕНИЕ (та же система) ====================== */
.st{animation-duration:5s;animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:ease}
@keyframes st1{0%,2%{opacity:0;transform:var(--hide,translateY(34px))}9%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:var(--hide,translateY(34px))}}
@keyframes st2{0%,8%{opacity:0;transform:var(--hide,translateY(34px))}15%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:var(--hide,translateY(34px))}}
@keyframes st3{0%,14%{opacity:0;transform:var(--hide,translateY(34px))}21%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:var(--hide,translateY(34px))}}
@keyframes st4{0%,20%{opacity:0;transform:var(--hide,translateY(34px))}27%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:var(--hide,translateY(34px))}}
@keyframes st5{0%,26%{opacity:0;transform:var(--hide,translateY(34px))}33%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:var(--hide,translateY(34px))}}
@keyframes st6{0%,32%{opacity:0;transform:var(--hide,translateY(34px))}39%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:var(--hide,translateY(34px))}}
@keyframes st7{0%,38%{opacity:0;transform:var(--hide,translateY(34px))}45%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:var(--hide,translateY(34px))}}
@keyframes st8{0%,44%{opacity:0;transform:var(--hide,translateY(34px))}51%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:var(--hide,translateY(34px))}}
.st1{animation-name:st1}.st2{animation-name:st2}.st3{animation-name:st3}.st4{animation-name:st4}
.st5{animation-name:st5}.st6{animation-name:st6}.st7{animation-name:st7}.st8{animation-name:st8}

/* «жизнь» после появления */
@keyframes gshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes chipglow{0%,100%{filter:brightness(1)}18%{filter:brightness(1.45)}}
@keyframes frameglow{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,0)}50%{box-shadow:0 0 70px 6px rgba(249,115,22,.3)}}
.grad{background:linear-gradient(120deg,var(--plum),var(--flame) 50%,var(--plum));background-size:220% 220%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:gshift 5s ease-in-out infinite}

/* ---------- карточка 1: хук-фраза ---------- */
.kick{font-size:28px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.hook{margin:0;font-size:96px;font-weight:800;line-height:1.12;letter-spacing:-.03em}
.hook span{display:block}
.more{font-size:32px;font-weight:600;color:rgba(255,255,255,.8)}
.more .arr{display:inline-block;color:var(--flame);animation:nudge 1.4s ease-in-out infinite}

/* ---------- карточка 2: гигантская цифра ---------- */
.tile{width:150px;height:150px;border-radius:38px;display:grid;place-items:center;
  background:rgba(249,115,22,.13);border:1.6px solid rgba(249,115,22,.4);color:var(--flame)}
.tile svg{width:76px;height:76px;animation:breathe 4s ease-in-out infinite}
.giant{font-size:340px;font-weight:800;line-height:.95;letter-spacing:-.04em}
.lab{font-size:52px;font-weight:700;line-height:1.3}
.chips{display:flex;gap:22px}
.chip{border:2px solid;border-radius:18px;padding:16px 30px;font-size:38px;font-weight:700;animation:chipglow 4s ease-in-out infinite}
.chip.f{border-color:var(--flame);color:var(--flame)}
.chip.p{border-color:var(--plum);color:var(--plum);animation-delay:.5s}

/* ---------- карточка 3: мини-конвейер + вывод ---------- */
.steps{display:flex;flex-direction:column;align-items:center;gap:20px}
.step{width:560px;border:2px solid;border-radius:20px;padding:26px 20px;font-size:42px;font-weight:700;background:rgba(255,255,255,.045)}
.step.f{border-color:var(--flame);color:var(--flame)}
.step.p{border-color:var(--plum);color:var(--plum)}
.sarr{color:var(--flame);animation:pulse 2.4s ease-in-out infinite}
.sarr svg{width:40px;height:40px;transform:rotate(90deg)}
.frame{border:2.4px solid rgba(249,115,22,.55);background:rgba(249,115,22,.07);border-radius:32px;
  padding:56px 60px;display:flex;flex-direction:column;align-items:center;gap:32px;max-width:860px}
.frame .fin{animation:frameglow 4s ease-in-out infinite;position:absolute;inset:0;border-radius:32px;pointer-events:none}
.frame{position:relative}
.frame .bulb{width:100px;height:100px;border-radius:26px;display:grid;place-items:center;background:rgba(249,115,22,.15);color:var(--flame)}
.frame .bulb svg{width:54px;height:54px;animation:blink 2.2s ease-in-out infinite}
.frame p{margin:0;font-size:46px;font-weight:700;line-height:1.4}
.frame .em{color:var(--flame)}

#nav{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;display:flex;gap:12px;
  background:rgba(20,20,26,.75);border-radius:999px;padding:10px 16px}
#nav button{background:rgba(255,255,255,.12);border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:17px;cursor:pointer}
body.export #nav{display:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
<symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M8.5 14.5C7 13.5 6 11.9 6 10a6 6 0 0 1 12 0c0 1.9-1 3.5-2.5 4.5-.6.4-1 .9-1 1.6v.4H9.5v-.4c0-.7-.4-1.2-1-1.6z"/></symbol>
</defs></svg>

<div id="deck">

  <!-- БИТ 1 — хук: строки фразы появляются одна за другой, ключевое слово градиентом -->
  <section class="card active" id="card-1">
    <div class="grain"></div>
    <div class="logo"><img src="../../assets/ait-logo.png" alt="AIT"></div>
    <div class="idx">01 / 03</div>
    <div class="vb">
      <div class="kick st st1" style="--hide:translateY(-34px)">Хук из диктовки</div>
      <h1 class="hook">
        <span class="st st2">Первая строка</span>
        <span class="st st3" style="--hide:translateX(-70px)">вторая строка</span>
        <span class="st st4 grad" style="--hide:scale(1.3)">ключевое слово</span>
      </h1>
      <div class="more st st5">смотри до конца <span class="arr">→</span></div>
    </div>
  </section>

  <!-- БИТ 2 — цифра: тайл → гигантское число «приземляется» → подпись → чипы -->
  <section class="card" id="card-2">
    <div class="grain"></div>
    <div class="logo"><img src="../../assets/ait-logo.png" alt="AIT"></div>
    <div class="idx">02 / 03</div>
    <div class="vb">
      <span class="tile st st1" style="--hide:scale(.6)"><svg class="ico"><use href="#i-bolt"/></svg></span>
      <div class="giant grad st st2" style="--hide:scale(1.35)">×10</div>
      <div class="lab st st3">подпись к цифре из диктовки</div>
      <div class="chips">
        <span class="chip f st st4" style="--hide:scale(.6)">факт</span>
        <span class="chip p st st5" style="--hide:scale(.6)">факт</span>
      </div>
    </div>
  </section>

  <!-- БИТ 3 — мини-конвейер и вывод в оранжевой рамке -->
  <section class="card" id="card-3">
    <div class="grain"></div>
    <div class="logo"><img src="../../assets/ait-logo.png" alt="AIT"></div>
    <div class="idx">03 / 03</div>
    <div class="vb" style="gap:44px">
      <div class="steps">
        <div class="step f st st1" style="--hide:translateX(-70px)">шаг один</div>
        <span class="sarr st st2" style="--hide:scale(.6)"><svg class="ico"><use href="#i-chevron"/></svg></span>
        <div class="step p st st3" style="--hide:translateX(70px)">шаг два</div>
        <span class="sarr st st4" style="--hide:scale(.6)"><svg class="ico"><use href="#i-chevron"/></svg></span>
        <div class="step f st st5" style="--hide:translateX(-70px)">шаг три</div>
      </div>
      <div class="frame st st6" style="--hide:translateY(50px) scale(.9)">
        <span class="fin"></span>
        <span class="bulb"><svg class="ico"><use href="#i-bulb"/></svg></span>
        <p>Вывод бита: гладко — не значит хорошо, <span class="em">мелочи решают всё</span></p>
      </div>
    </div>
  </section>

</div>

<nav id="nav"><button id="prev">‹</button><button id="next">›</button></nav>
<script>
(function(){
  var cards=[].slice.call(document.querySelectorAll('.card')),i=0;
  if(/[?&]export/.test(location.search)){document.body.classList.add('export');return;}
  function fit(){var s=Math.min((innerWidth-40)/1080,(innerHeight-120)/1920,1.2);
    document.documentElement.style.setProperty('--scale',s.toFixed(4));}
  function show(n){i=(n+cards.length)%cards.length;
    cards.forEach(function(c,k){c.classList.toggle('active',k===i);});}
  document.getElementById('next').onclick=function(){show(i+1)};
  document.getElementById('prev').onclick=function(){show(i-1)};
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight')show(i+1);else if(e.key==='ArrowLeft')show(i-1);});
  addEventListener('resize',fit);fit();show(0);
})();
</script>
</body>
</html>
