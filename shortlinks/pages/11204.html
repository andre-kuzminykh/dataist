<meta name="description" content="Около 400 крупнейших дата-центров США за год потребили примерно 82 ТВт·ч электричества, причём 54% энергии поступило из ископаемого топлива. По оценке исследователей Гарвардского университета, связанные с этим выбросы CO₂ достигли 25,7 млн метрических тонн — столько же или больше, чем выбрасывает за год Дания. Международное энергетическое агентство (МЭА) ожидает, что к 2035 году мировые выбросы дата-центров вырастут примерно до 350 млн тонн в год. На COP31 представили добровольное климатическое соглашение для отрасли, но оно не имеет обязательной силы.">
