<meta name="description" content="Спрос на электричество для центров обработки данных может резко увеличить выбросы от газовых электростанций в США. По анализу Environment America Research and Policy Center, в ближайшие четыре года мощность газовых генераторов вырастет на 44% — почти на 20 гигаватт к 2030 году. Одновременно запланированная мощность ветропарков с декабря 2025 года сократилась на 34%. Анализ не учитывает газовые установки, которые строят непосредственно для центров обработки данных, в том числе турбины для центра Илона Маска мощностью 1,2 гигаватта в Мемфисе.">
