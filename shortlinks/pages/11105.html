<meta name="description" content="Анализ Резервного банка Австралии показывает, что влияние ИИ пока почти не отразилось на занятости в стране, но молодым работникам в наиболее подверженных автоматизации сферах приходится труднее. После запуска ChatGPT в конце 2022 года число вакансий сократилось во всех группах, сильнее всего — в профессиях с высокой подверженностью ИИ. Среди работников 15–24 лет и недавних выпускников вузов в этих сферах ниже занятость и выше безработица, чем среди более опытных коллег. При этом исследование не доказывает, что причиной стал именно ИИ: оно оценивает теоретическую подверженность технологиям, а не их фактическое использование компаниями.">
