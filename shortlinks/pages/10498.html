<meta name="description" content="Eka Robotics привлекла $150 млн в раунде серии A, который оценил компанию в $1,45 млрд после инвестиций. Стартап, основанный профессором MIT Пулкитом Агравалом и бывшим исследователем Google DeepMind Туомасом Хаарнойей, разрабатывает систему для ловкой работы роботов с предметами: гибкий захват с датчиками силы и новую модель глубокого обучения. По данным Eka, робот способен за час взять около 1 500 предметов весом до 1 кг — примерно в 2,5 раза больше человека, — и справляется более чем в 95% случаев. Инвесторы и исследователи отмечают, что робот подстраивается к новым предметам без переобучения.">
