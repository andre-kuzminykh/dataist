<meta name="description" content="Распродажу акций, связанных с ИИ, уже трудно объяснить проблемами одной CoreWeave. В пятницу Micron подешевела на 5,6%, AMD — на 6%, Intel — на 5,8%, Broadcom — на 3,6%. За неделю Dell потеряла около 23%, а CrowdStrike, Palo Alto Networks и Snowflake — примерно 17–18%. Nasdaq завершил неделю снижением на 4,5%, а Philadelphia Semiconductor Index показал самую длинную серию падений с 2008 года. Автор Forbes Джим Осман пишет, что вместе с более рискованными компаниями распродают и акции прибыльных участников цепочки ИИ. Теперь инвесторов интересует не только спрос на ИИ, но и то, сколько капитала потребуется для его развития, кто за него заплатит и что останется акционерам.">
