<meta name="description" content="Google Research проверила, могут ли геопространственные представления модели Population Dynamics Foundation Model (PDFM) помочь в задачах общественного здоровья. В пяти исследованиях с участием партнёров модель показала пользу для прогнозирования вспышек холеры и денге, оценки смертности от сердечно-сосудистых заболеваний, анализа вакцинации у границы США и Канады и выявления риска послеродовой депрессии. PDFM объединяет данные о поисковых запросах, мобильности людей, городской среде и погоде в ежемесячно обновляемые эмбеддинги мест. Их можно добавлять в уже существующие модели без дополнительного обучения под конкретную задачу.">
