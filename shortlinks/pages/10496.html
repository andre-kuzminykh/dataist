<meta name="description" content="Otter.ai привлекла $320 млн от Customer Value Fund (CVF) — фонда роста General Catalyst, который финансирует стартапы без размывания долей и получает доход от результатов маркетинговых расходов. Сервис планирует направить деньги на развитие корпоративного бизнеса, выход на международные рынки, стратегию продаж и маркетинга и обновление продукта. Компания заявляет, что её инструментом уже воспользовались 40 млн человек против 25 млн годом ранее. При этом Otter.ai не раскрыла данные о ежемесячной аудитории и оттоке клиентов.">
