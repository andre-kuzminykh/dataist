<meta name="description" content="Британская компания Co-op, предоставляющая юридические услуги, по данным The Guardian, применяет модели ИИ для постоянной записи и оценки разговоров сотрудников с клиентами. Система на базе модели OpenAI проверяет более 50 аспектов каждого звонка и выставляет оценку «сдано» или «не сдано». Сотрудников, которые долго общаются с клиентами, ИИ может отслеживать по несколько часов в день. Этот случай показывает, как ИИ усиливает контроль на рабочем месте: в США программы с ИИ-аналитикой для оценки продуктивности уже используют, по оценкам, 61% работодателей.">
