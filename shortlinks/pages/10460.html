<meta name="description" content="Исследователи Tech Transparency Project создали учётные записи Apple и Google для пользователей 13 лет и скачали 135 приложений, которые позволяют раздевать людей на изображениях или переносить их лица на обнажённые тела. По данным отчёта, многие приложения были ошибочно помечены как подходящие для подростков и оставались доступны даже при включённом родительском контроле. После обращения исследователей Apple ужесточила правила для разработчиков, а обе компании удалили часть приложений. Отчёт появился на фоне случаев, когда школьники в США используют такие приложения для создания интимных изображений одноклассниц без их согласия.">
