<meta name="description" content="Акции Nvidia за два дня потеряли около 9,5%: во вторник они упали на 5,47% после снижения на 4% в понедельник. Компания почти не сообщала новостей, но её совет директоров нанял юридическую фирму Wachtell, Lipton, Rosen &amp; Katz для внутреннего расследования после того, как CEO Дженсен Хуанг признал внебрачную связь с Элис Хуанг, которую американские разведывательные ведомства считают шпионкой Китая. Специалисты по корпоративному управлению говорят, что у такой ситуации нет очевидных прецедентов: расследованию предстоит выяснить, что знал Хуанг, получала ли Элис Хуанг от него сведения и были ли нарушены закон или внутренние правила Nvidia.">
