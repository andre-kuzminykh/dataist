<meta name="description" content="Anthropic сохраняет обещание не показывать рекламу в Claude, данное в рекламе компании во время Супербоула, и не упомянула такой способ заработка в документах к недавнему IPO. Тем временем OpenAI сообщила, что с момента запуска рекламы в ChatGPT в феврале её разместили более 100 000 рекламодателей. Google расширила показ объявлений в поисковом чат-боте ИИ Mode ещё на 10 стран за пределами США. Рекламодатели пока недовольны результатами, но рассчитывают, что формат улучшится. Для небольших чат-ботов реклама может стать способом покрывать высокие расходы на генерацию ответов: в отличие от крупнейших лабораторий и технологических гигантов, они не располагают сопоставимым доступом к инвестициям и выручке.">
