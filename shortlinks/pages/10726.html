<meta name="description" content="Mistral опубликовала открытые веса модели Large 4 с триллионом параметров. Компании смогут самостоятельно запускать и настраивать модель по индивидуальной лицензии. В независимой оценке Artificial Analysis от 29 октября Large 4 набрала 26 баллов в Intelligence Index v5 — на один больше предварительной версии и на один выше Muse Spark Open. Это лучший результат среди моделей с открытыми весами, разработанных за пределами Китая. Стоимость задания в тесте снизилась с $5,54 до $2,06, а в рейтинге агентов для программирования модель заняла второе место среди открытых. Впрочем, мировых лидеров она не обошла.">
