<meta name="description" content="Партнёр Andreessen Horowitz Оливия Мур выпустила обзор 100 ведущих потребительских приложений с ИИ. ChatGPT остаётся крупнейшим игроком, но Suno и ElevenLabs тоже удерживают позиции, а в шести категориях — среди них знакомства, путешествия и здоровье — в списке пока нет ни одного приложения. Мур считает, что потребительский ИИ может приносить больше денег, если компании найдут источники дохода помимо подписок и оплаты API. По её мнению, большинство нынешних приложений для потребителей на деле рассчитаны на продвинутых пользователей и бизнес, а настоящий потребительский ИИ ещё предстоит увидеть.">
