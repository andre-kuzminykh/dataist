<meta name="description" content="Глава Hugging Face Клеман Деланг заявил на WIRED World Fair в Майами, что вероятность гибели человечества из-за ИИ он оценивает как «близкую к нулю». По его мнению, главные риски создают несколько компаний, которые разрабатывают передовые модели в закрытом режиме, а снижать их помогут открытые модели и широкое участие разработчиков. Деланг также призвал закрепить юридическую ответственность за действия ИИ-агентов и сообщил, что у Hugging Face уже более 20 млн разработчиков ИИ, а компания продала 50 000 роботов Microducks.">
