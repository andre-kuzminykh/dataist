<meta name="description" content="OpenAI во вторник объявила о покупке четырёхлетнего стартапа Orchestra Bio, который разрабатывает программное обеспечение с ИИ для биотехнологических компаний. Условия сделки не раскрыты. По данным источников, к 2025 году Orchestra Bio привлекла около 20 миллионов долларов от Andreessen Horowitz, Atria и 8VC. Стартап создал ИИ-агентов для повседневных задач в разработке лекарств — от учёта финансов до решения проблем с расписанием клинических испытаний. Команда и технологии Orchestra Bio присоединятся к работе над Rosalind, моделью OpenAI для исследований в области наук о жизни, и инструментом Rosalind Workbench для планирования экспериментов и анализа результатов.">
