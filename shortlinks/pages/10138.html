<meta name="description" content="Персонаж Tung Tung Tung Sahur, созданный с помощью генератора изображений OpenAI, оказался в центре международного судебного спора об авторских правах на ИИ-контент. Американская игровая компания Do Big Studios утверждает, что персонаж не может быть защищён авторским правом, поскольку его создали с помощью ИИ и человеческого участия было недостаточно. Французское агентство Mementum, представляющее автора персонажа, добивается права использовать его в игре на Roblox и ссылается также на товарный знак. Спор затрагивает вопрос о том, кому принадлежит мем, который стал популярным благодаря множеству пользователей.">
