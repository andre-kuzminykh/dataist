<meta name="description" content="Канадское издательство Les Éditions du Boréal прекратило сотрудничество с писателем Тельсоном Орельеном после дополнительной проверки его романа C’était ça ou mourir («Это или смерть»). В документах с рабочими версиями книги нашли следы меток ИИ в метаданных. Издательство подтвердило использование ИИ в процессе работы над романом, но заявило, что не знает, насколько широко автор к нему обращался. Орельен отрицает, что машина написала хоть одно предложение. В прошлом месяце его исключили из списка французской премии «Гонкур» после того, как детектор Pangram оценил вероятность наличия в книге сгенерированного компьютером текста в 100%.">
