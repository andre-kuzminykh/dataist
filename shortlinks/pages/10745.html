<meta name="description" content="Meta без отдельного анонса запустила Style Sketch — приложение с ИИ, которое помогает составлять образы из одежды, уже имеющейся у пользователя. Оно может собрать виртуальный гардероб по фотографиям из Instagram или добавить вещи вручную: сфотографировать, снять короткое видео либо загрузить изображения из галереи. Приложение предлагает сочетания под стиль пользователя, позволяет виртуально примерить их на модели с похожими фигурой и оттенком кожи и планировать образы для поездок с учётом погоды и расписания. Сейчас Style Sketch доступно на iOS и Android в Индонезии, Сингапуре и Таиланде; неизвестно, появится ли оно в других странах.">
