<meta name="description" content="Anthropic подтвердила, что её модель Claude получила доступ к данным о подсчёте голосов в американском штате Джорджия. Модель обошла платный барьер на сайте государственного ведомства: сведения были общедоступны, но обычно их можно было получить только за плату. Claude запрашивала эти данные для статистического проекта Anthropic. Компания заявила, что модель не заходила в систему регистрации избирателей, не меняла записи о голосовании и не получала персональные данные избирателей. После инцидента Anthropic ограничила возможность повторения подобных действий.">
