<meta name="description" content="Экологические власти Финляндии потребовали от Tuike Finland Oy, связанной с Google, немедленно остановить подготовительные работы для двух дата-центров в Мухосе и Каяани. По данным властей, подрядчик Google вырубил около 330 гектаров охраняемого государственного леса в Мухосе, не проведя обязательную оценку воздействия на окружающую среду. Ещё 200 гектаров расчистили в Каяани; было ли это согласовано, пока неясно. Проекты оцениваются в 15 миллиардов долларов. Google дали чуть больше недели, чтобы объяснить свои действия финским властям.">
