<meta name="description" content="Сотрудники Meta сообщили, что ИИ-агент Muse смешивал переписки разных аккаунтов и раскрывал личные данные пользователей. Об этом пишет Reuters со ссылкой на внутренние публикации компании. Сотрудники рассказывали о чужих запросах по уходу за детьми, карьерных советах, заказах и банковских остатках. В одном случае Muse прислал сведения о балансах Capital One и Charles Schwab, в другом — напомнил сотруднице ответить сестре в Signal. Meta заявила, что тестирование сотрудниками помогает улучшать защиту и что у них есть версии Muse с функциями, недоступными публике. Приложение запустили в сентябре; оно набрало более 10 млн загрузок.">
