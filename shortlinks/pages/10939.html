<meta name="description" content="Власти стран Юго-Восточной Азии пересматривают планы строительства дата-центров: быстро растущая отрасль упирается в нехватку электричества и воды, а также в экологические и регуляторные ограничения. В сентябре 2026 года Таиланд приостановил строительство 49 объектов и рассмотрение ещё 117 проектов. Между тем, по данным Cushman and Wakefield, на регион приходится около 50% строящихся мощностей дата-центров в Азиатско-Тихоокеанском регионе. Особенно быстро отрасль росла в малайзийском штате Джохор, где действующие мощности увеличились с 94 МВт в 2023 году до 1110 МВт в 2026-м.">
