<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Датаист</title>
<meta name="description" content="ИИ простым языком: исследования, курсы, кейсы и новости. Все каналы Датаиста в одном месте.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://dataist.ai/links/">
<meta property="og:site_name" content="Датаист">
<meta property="og:type" content="website">
<meta property="og:url" content="https://dataist.ai/links/">
<meta property="og:title" content="Датаист">
<meta property="og:description" content="ИИ простым языком: исследования, курсы, кейсы и новости.">
<meta property="og:image" content="https://dataist.ai/pics/dataist-ai-preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="https://dataist.ai/favicon.png">
<link rel="apple-touch-icon" href="https://dataist.ai/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --glass:rgba(255,255,255,.045);
  --glass-2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.09);
  --line-2:rgba(255,255,255,.16);
  --text:#f5f5f7;
  --muted:#8e8e93;
  --dim:#5c5c61;
  --ok:#30d158;
  --live:#ff453a;
  --err:#ff6961;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* размеры подстраиваются под высоту экрана, чтобы всё влезало без прокрутки */
  --gap:clamp(10px,2.1svh,20px);
  --av:clamp(64px,11svh,100px);
  --row:clamp(52px,7.4svh,62px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font-family:var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent}
::selection{background:#fff;color:#000}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* ── фон ── */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aura{position:absolute;left:50%;top:-30vh;width:min(900px,180vw);aspect-ratio:1;translate:-50% 0;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.17),rgba(255,255,255,.05) 35%,transparent 62%);
  animation:aura 10s ease-in-out infinite}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.9}
.b1{width:60vmax;height:60vmax;left:-30vmax;bottom:-25vmax;background:radial-gradient(circle,rgba(94,92,230,.26),transparent 62%);animation:drift1 20s ease-in-out infinite}
.b2{width:55vmax;height:55vmax;right:-28vmax;bottom:-10vmax;background:radial-gradient(circle,rgba(10,132,255,.18),transparent 62%);animation:drift2 24s ease-in-out infinite}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:44px 44px;background-position:center -1px;
  -webkit-mask-image:radial-gradient(ellipse 70% 38% at 50% 14%,#000,transparent 75%);mask-image:radial-gradient(ellipse 70% 38% at 50% 14%,#000,transparent 75%)}
.grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes aura{0%,100%{opacity:.85;scale:1}50%{opacity:1;scale:1.06}}
@keyframes drift1{50%{translate:8vmax -6vmax}}
@keyframes drift2{50%{translate:-8vmax -8vmax}}

/* ── верх ── */
.top{position:relative;z-index:2;flex-shrink:0;height:56px;display:flex;align-items:center;justify-content:space-between;
  padding:env(safe-area-inset-top) 18px 0}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;
  font:700 12px/1 var(--mono);transition:transform .4s var(--ease)}
.brand:hover .mark{transform:rotate(-12deg) scale(1.08)}
.brand-name{font-weight:600;font-size:17px;letter-spacing:-.02em;line-height:1;margin-top:2px}
.lang{display:flex;align-items:center;gap:7px;font:700 11px/1 var(--mono);letter-spacing:.2em;user-select:none}
.lang button{padding:10px 1px;color:var(--muted);transition:color .2s}
.lang button[aria-pressed="true"]{color:#fff;cursor:default}
.lang .sep{color:var(--muted);opacity:.4}

/* ── колонка ── */
main{position:relative;z-index:1;flex:1;width:100%;max-width:440px;margin:0 auto;
  display:flex;flex-direction:column;justify-content:center;gap:var(--gap);
  padding:4px 16px calc(20px + env(safe-area-inset-bottom));transition:opacity .2s ease}
main.swap{opacity:0}

.hero{display:flex;flex-direction:column;align-items:center;text-align:center}
.avatar{position:relative;width:var(--av);height:var(--av);margin-bottom:calc(var(--gap) * .8)}
.ring{position:absolute;inset:-3px;border-radius:50%;
  background:conic-gradient(from 0deg,#fff,rgba(255,255,255,.05) 30%,transparent 50%,rgba(255,255,255,.05) 70%,#fff);
  animation:spin 6s linear infinite}
.avatar img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #000;background:#111}
.avatar.noimg img{visibility:hidden}
@keyframes spin{to{rotate:360deg}}
.name{font-size:clamp(19px,2.8svh,23px);font-weight:700;letter-spacing:-.03em;line-height:1.15}
.bio{text-wrap:balance;margin-top:5px;font-size:clamp(13px,1.8svh,14.5px);line-height:1.4;color:var(--muted);max-width:320px}

/* ── соцсети ── */
.socials{display:flex;justify-content:center;gap:12px}
.soc{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:var(--glass);border:1px solid var(--line-2);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:transform .35s var(--ease),background .25s,color .25s,border-color .25s,box-shadow .35s}
.soc svg{width:19px;height:19px}
.soc:active{transform:scale(.92)}
@media (hover:hover){.soc:hover{transform:translateY(-3px);background:#fff;color:#000;border-color:#fff;box-shadow:0 12px 30px -10px rgba(255,255,255,.5)}}

/* ── email ── */
.sub{position:relative;display:flex;align-items:center;gap:6px;height:54px;padding:5px 5px 5px 16px;border-radius:999px;
  background:rgba(10,10,12,.7);border:1px solid var(--line-2);overflow:hidden;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  transition:border-color .25s,box-shadow .25s}
.sub::before{content:"";position:absolute;top:0;left:-45%;width:45%;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:beam 5s var(--ease) infinite}
@keyframes beam{0%{left:-45%}55%,100%{left:105%}}
.sub:focus-within{border-color:rgba(255,255,255,.45);box-shadow:0 0 0 4px rgba(255,255,255,.07)}
.sub.err{border-color:var(--err)}
.sub>svg{width:17px;height:17px;flex-shrink:0;color:var(--dim)}
.sub input{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:0;color:#fff;font:500 16px var(--sans);padding-left:4px}
.sub input::placeholder{color:var(--dim)}
.btn{flex-shrink:0;height:100%;display:inline-flex;align-items:center;gap:7px;padding:0 18px;border-radius:999px;background:#fff;color:#000;
  font-weight:600;font-size:14.5px;white-space:nowrap;transition:transform .25s var(--ease)}
.btn svg{width:15px;height:15px;transition:transform .3s var(--ease)}
.btn:active{transform:scale(.95)}
@media (hover:hover){.btn:hover{transform:scale(1.03)}.btn:hover svg{transform:translate(2px,-2px)}}
.btn .spin{display:none;width:17px;height:17px;border-radius:50%;border:2px solid rgba(0,0,0,.2);border-top-color:#000;animation:spin .8s linear infinite}
.sub.busy .btn .spin{display:block}.sub.busy .btn span,.sub.busy .btn svg{display:none}
.sub .done{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:15px;background:#0b130d}
.sub .done svg{width:22px;height:22px;color:var(--ok)}
.sub .done circle,.sub .done path{stroke-dasharray:80;stroke-dashoffset:80}
.sub.ok{border-color:rgba(48,209,88,.45)}
.sub.ok .done{display:flex}
.sub.ok .done circle{animation:draw .6s var(--ease) forwards}
.sub.ok .done path{animation:draw .4s .3s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.shake{animation:shake .45s var(--ease)}
@keyframes shake{20%{translate:-7px 0}40%{translate:6px 0}60%{translate:-4px 0}80%{translate:2px 0}}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

/* ── каналы ── */
.links{display:flex;flex-direction:column;gap:8px}
.label{display:flex;align-items:center;gap:12px;margin-bottom:2px;font:700 9.5px/1 var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}
.label::before,.label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line-2))}
.label::after{background:linear-gradient(90deg,var(--line-2),transparent)}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:var(--row);padding:8px 10px 8px 8px;border-radius:18px;
  background:var(--glass);border:1px solid var(--line);overflow:hidden;isolation:isolate;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  transition:background .3s,border-color .3s,transform .4s var(--ease),color .3s}
.row::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .3s;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.12),transparent 50%)}
.ic{width:calc(var(--row) - 16px);height:calc(var(--row) - 16px);max-width:46px;max-height:46px;flex-shrink:0;border-radius:13px;
  display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--line);transition:background .3s,color .3s,border-color .3s}
.ic svg{width:19px;height:19px}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.t{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.d{font-size:12.5px;line-height:1.25;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.live{width:7px;height:7px;border-radius:50%;background:var(--live);animation:live 1.8s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(255,69,58,.6)}70%{box-shadow:0 0 0 7px rgba(255,69,58,0)}100%{box-shadow:0 0 0 0 rgba(255,69,58,0)}}
.go{width:28px;height:28px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;color:var(--dim);transition:transform .4s var(--ease),color .3s,background .3s}
.go svg{width:15px;height:15px}
.row:active{transform:scale(.98);background:#fff;color:#000;border-color:#fff}
.row:active .d{color:#48484a}.row:active .ic{background:#000;color:#fff;border-color:#000}.row:active .go{color:#000}
@media (hover:hover){
  .row:hover{transform:translateY(-2px);border-color:var(--line-2);background:var(--glass-2)}
  .row:hover::before{opacity:1}
  .row:hover .ic{background:#fff;color:#000;border-color:#fff}
  .row:hover .d{color:#c7c7cc}
  .row:hover .go{color:#000;background:#fff;transform:rotate(45deg)}
}

/* ── всплывашка ── */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:10;width:max-content;max-width:calc(100% - 32px);
  translate:-50% 140%;opacity:0;padding:12px 16px;border-radius:16px;background:rgba(28,28,30,.92);border:1px solid var(--line-2);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 20px 50px -15px rgba(0,0,0,.9);
  font-size:13.5px;line-height:1.4;text-align:center;transition:translate .5s var(--ease),opacity .3s}
.toast.show{translate:-50% 0;opacity:1}
.toast.err{border-color:rgba(255,105,97,.5)}

/* ── появление ── */
.rv{opacity:0;translate:0 14px;animation:rv .8s var(--ease) forwards;animation-delay:calc(var(--i,0) * 60ms + 40ms)}
@keyframes rv{to{opacity:1;translate:0 0}}

/* ── большие экраны ── */
@media (min-width:768px){
  .top{height:76px;padding:0 32px}
  .mark{width:32px;height:32px;font-size:14px}
  .brand-name{font-size:20px}
  .lang{font-size:13px}
}
/* ── низкие экраны (iPhone SE, встроенный браузер Instagram) ── */
@media (max-height:640px){
  :root{--gap:8px;--av:58px;--row:50px}
  .top{height:46px}
  .avatar{margin-bottom:8px}
  .name{font-size:18px}
  .bio{margin-top:3px;font-size:12.5px}
  .soc{width:40px;height:40px}.soc svg{width:17px;height:17px}
  .sub{height:48px}
  .links{gap:6px}
  main{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><div class="aura"></div><div class="blob b1"></div><div class="blob b2"></div><div class="grid"></div><div class="grain"></div></div>

<header class="top">
  <a href="https://dataist.ai/" class="brand"><span class="mark">i</span><span class="brand-name" data-t="brand">ДАТАИСТ</span></a>
  <nav class="lang" aria-label="Language">
    <button type="button" data-lang="ru" aria-pressed="true" lang="ru">RU</button>
    <span class="sep" aria-hidden="true">|</span>
    <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
  </nav>
</header>

<main id="main">
  <section class="hero">
    <div class="avatar rv" style="--i:0">
      <span class="ring"></span>
      <img src="https://dataist.ai/andre.jpeg" alt="@andre_dataist"
           onerror="if(!this.dataset.f){this.dataset.f=1;this.src='/andre.jpeg'}else{this.parentNode.classList.add('noimg')}">
    </div>
    <div class="name rv" style="--i:1">@andre_dataist</div>
    <p class="bio rv" style="--i:2" data-t="bio"></p>
  </section>

  <div class="socials rv" style="--i:3" id="socials"></div>

  <form class="sub rv" style="--i:4" id="sub" novalidate>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
    <input type="email" name="email" id="email" required autocomplete="email" inputmode="email" spellcheck="false" aria-label="Email">
    <input class="hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit" class="btn"><span data-t="button"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg><i class="spin" aria-hidden="true"></i></button>
    <div class="done" role="status"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="13" r="11.5"/><path d="m8 13.5 3.3 3.2L18 9.8"/></svg><span data-t="ok"></span></div>
  </form>

  <nav class="links" id="links" aria-label="Каналы"></nav>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

  var SOCIALS = [['youtube', 'YouTube'], ['instagram', 'Instagram'], ['tiktok', 'TikTok']];

  var T = {

      label: 'Telegram',
      links: [
        { net: 'telegram', title: 'Лаборатория', desc: 'Исследования: разборы статей об ИИ', url: 'https://t.me/+gjvJGFW0iXUwMjky' },
        { net: 'telegram', title: 'Академия',    desc: 'Курсы: ИИ-агенты и автоматизация',  url: 'https://t.me/dataist_academy' },
        { net: 'telegram', title: 'Основной',    desc: 'Технологии · кейсы · мысли',        url: 'https://t.me/+AXsoJ7OiMG4zMzFi' },
        { net: 'telegram', title: 'Live',        desc: 'Новости ИИ в реальном времени',     url: 'https://t.me/neuronium_ai', live: true }
      ]
    },
    en: {
      title: 'Dataist', brand: 'DATAIST',
      bio: 'AI in plain language — research, cases & news',
      placeholder: 'Your email', button: 'Subscribe', ok: 'Done, you’re subscribed',
      bad: 'Looks like a typo in your email', fail: 'Couldn’t send — please try again',
      notYet: 'Email is launching soon. Meanwhile — follow on X below ↓',
      label: 'X',
      links: [
        { net: 'x', title: 'Main', desc: '@andre_dataist · research, tech, cases', url: 'https://x.com/andre_dataist' },
        { net: 'x', title: 'Live', desc: '@neuronium_ai · AI news as it happens',  url: 'https://x.com/neuronium_ai', live: true }
      ]
    }
  };

  var $ = function (s) { return document.querySelector(s); };
  var main = $('#main'), form = $('#sub'), email = $('#email'), toast = $('#toast'), tt;
  var lang = detect();

  function detect() {
    try {
      var q = new URLSearchParams(location.search).get('lang');
      if (q === 'ru' || q === 'en') return q;
      var s = localStorage.getItem('dataist_lang');
      if (s === 'ru' || s === 'en') return s;
    } catch (e) {}
    var n = (navigator.languages && navigator.languages[0]) || navigator.language || 'ru';
    return /^(ru|uk|be|kk)/i.test(n) ? 'ru' : 'en';
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function render() {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    document.querySelectorAll('[data-t]').forEach(function (el) { var k = el.dataset.t; if (t[k] != null) el.textContent = t[k]; });
    email.placeholder = t.placeholder;
    document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.lang === lang); });

    $('#socials').innerHTML = SOCIALS.map(function (s) {
      var url = LINKS[lang][s[0]];
      return '<a class="soc" href="' + esc(url || '#') + '"' + (url ? ' target="_blank" rel="noopener"' : '') +
             ' aria-label="' + s[1] + '" title="' + s[1] + '">' + I[s[0]] + '</a>';
    }).join('');

    $('#links').innerHTML = '<div class="label rv" style="--i:5">' + esc(t.label) + '</div>' + t.links.map(function (l, i) {
      return '<a class="row rv" style="--i:' + (6 + i) + '" href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
        '<span class="ic">' + I[l.net] + '</span>' +
        '<span class="txt"><span class="t">' + esc(l.title) + (l.live ? '<i class="live" aria-hidden="true"></i>' : '') + '</span>' +
        '<span class="d">' + esc(l.desc) + '</span></span>' +
        '<span class="go">' + I.arrow + '</span></a>';
    }).join('');
  }

  function say(text, err) {
    clearTimeout(tt);
    toast.textContent = text;
    toast.className = 'toast show' + (err ? ' err' : '');
    tt = setTimeout(function () { toast.className = 'toast' + (err ? ' err' : ''); }, 3800);
  }
  function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

  document.querySelector('.lang').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lang]');
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem('dataist_lang', lang); } catch (e) {}
    try { var u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null, '', u); } catch (e) {}
    main.classList.add('swap');
    setTimeout(function () { render(); main.classList.remove('swap'); }, 180);
  });

  $('#links').addEventListener('pointermove', function (e) {
    var r = e.target.closest('.row'); if (!r) return;
    var b = r.getBoundingClientRect();
    r.style.setProperty('--mx', (e.clientX - b.left) + 'px');
    r.style.setProperty('--my', (e.clientY - b.top) + 'px');
  });

  email.addEventListener('input', function () { form.classList.remove('err'); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var t = T[lang], v = email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) { form.classList.add('err'); shake(form); say(t.bad, true); email.focus(); return; }
    if (form.company.value) return;
    if (!SUBSCRIBE_ENDPOINT) { email.blur(); say(t.notYet); return; }

    var fd = new FormData();
    fd.append('email', v); fd.append('lang', lang); fd.append('source', 'dataist.ai/links');
    form.classList.add('busy');
    fetch(SUBSCRIBE_ENDPOINT, { method: 'POST', body: fd, headers: { Accept: 'application/json' } })
      .then(function (r) { if (!r.ok) throw new Error(r.status); form.classList.add('ok'); email.blur(); })
      .catch(function () { shake(form); say(t.fail, true); })
      .then(function () { form.classList.remove('busy'); });
  });

  render();
})();
</script>
</body>
</html>
