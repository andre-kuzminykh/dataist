<meta name="description" content="За последний год в Anthropic изменились состав сотрудников и организация работы, говорится в опубликованном в пятницу отчёте компании. Доля младших специалистов в технических подразделениях сократилась с 21% до 14%, а среди новых технических сотрудников — с 27% до 9%. Одновременно технические команды стали занимать меньшую долю штата, а сотрудники стали больше времени проводить на встречах: на 20% больше, чем год назад. Anthropic связывает изменения с ростом бизнеса и использованием Claude: ИИ помогает писать больше кода, но требует от людей внимания, координации и контроля.">
