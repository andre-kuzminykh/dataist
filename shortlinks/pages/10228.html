<meta name="description" content="Anthropic запускает долгосрочную «Кибермиссию» — инициативу по защите программ и систем, от которых зависят люди. Первые направления — критическая инфраструктура и открытое программное обеспечение. Для защиты электросетей, водоснабжения, транспорта и государственных систем компания создаёт Critical Infrastructure Defense Program (CIDP): поставщикам, которым доверяют операторы, предоставят передовые модели Claude, инженеров на местах и исследования угроз. Для проектов с открытым кодом запускают бесплатный сервис OSS Scanner: он будет регулярно искать уязвимости с помощью самых способных моделей Anthropic. Компания также расширяет Cyber Verification Program и намерена направлять инженерные ресурсы и финансирование тем, кто защищает критические системы и открытый код.">
