<meta name="description" content="Новый бенчмарк TasteVal проверяет, как системы ИИ планируют эксперименты и трактуют их результаты. По данным P-Zero Research, способность, которую лаборатория называет «исследовательским чутьём», с декабря 2025 года примерно удваивается каждые три месяца. Лучшая из проверенных моделей превзошла группу из 24 экспертов-людей, потратив меньше вычислительных ресурсов. Сооснователь Anthropic Джек Кларк считает, что самоулучшение ИИ — создание системами собственных более совершенных преемников — может стать возможным уже в 2027 году. Раньше он ожидал этого в 2028-м.">
