<meta name="description" content="Лауреат Филдсовской премии Шин-Тунг Яу и ведущие китайские математики в воскресенье объявили в Пекине о создании альянса для внедрения ИИ в математические исследования. Объединение восьми учреждений планирует собрать сеть более чем из 1 000 исследователей. На Западе тем временем 25 лауреатов Филдсовской премии, среди них Теренс Тао и Петер Шольце, опасаются, что доказательства, созданные ИИ, ослабляют математическое понимание и делают учёных зависимыми от непонятных им инструментов. Сам Яу предупредил, что Китай отстаёт от США.">
