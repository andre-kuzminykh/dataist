<meta name="description" content="Прототип орбитального дата-центра Google вышел на связь с Землёй после запуска в начале месяца на ракете SpaceX Falcon 9 вместе с более чем 100 космическими аппаратами. Спутник проекта Suncatcher несёт четыре тензорных процессора Google (TPU) и вырабатывает до 1 кВт энергии. На Земле инженеры уже попросили предустановленную модель Gemma 4 от Google DeepMind написать хокку о космосе. Испытания должны показать, как процессоры справляются с радиацией и нагревом; если всё пройдёт успешно, в 2027 году Google запустит ещё два спутника с улучшенными чипами.">
