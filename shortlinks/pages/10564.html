<meta name="description" content="Dharma-ИИ разработала метод VocabX, который перестраивает словарь языковой модели под конкретную задачу. В производственной системе для оценки португальских эссе на базе Qwen3-4B новый словарь сократил средний ответ с 350 до 101 токена, а измеренную стоимость инференса — на 77%. Оценка качества при этом выросла с 0,703 до 0,810. Базовую модель, данные и рецепт обучения не меняли: отличался только токенизатор. Метод также показал лучшие результаты, чем три других подхода, в тестах на пяти предметных областях и трёх семействах моделей.">
