<!doctype html>
<html><head><meta charset="utf-8">
<!-- Квадратная сцена 720×720 для узкой колонки газеты: сверху — анимация сайта крупным планом, снизу — крупный текст.
     Управляется из render.js: setup(cfg), render(t). Кадры фона — те же, что у широкого ролика (1120×630). -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  html,body{margin:0;background:#060606}
  #stage{position:relative;width:720px;height:720px;overflow:hidden;background:#060606}
  #vis{position:absolute;left:0;top:62px;width:720px;height:370px;overflow:hidden}
  #vis img{position:absolute;left:0;top:0;width:1120px;height:630px;transform-origin:0 0;display:block}
  #vis:after{content:"";position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(rgba(6,6,6,0),rgba(6,6,6,.88) 62%,#060606)}
  #logo{position:absolute;left:40px;top:26px}
  #tag{position:absolute;right:40px;top:33px;font:600 18px/1 'JetBrains Mono',monospace;letter-spacing:.1em;color:#a8a8b3}
  #cap{position:absolute;left:40px;right:40px;top:388px}
  .w{display:inline-block;white-space:pre}
  .kicker{font:700 21px/1.3 'JetBrains Mono',monospace;letter-spacing:.12em;color:#a8a8b3;text-transform:uppercase;margin-bottom:14px}
  .kicker:before{content:"";display:inline-block;width:10px;height:10px;margin-right:12px;vertical-align:2px;border-radius:2px;
    background:linear-gradient(135deg,#a071ff,#ff8a33);box-shadow:0 0 12px rgba(160,113,255,.7)}
  .title{font:800 50px/1.1 'JetBrains Mono',monospace;letter-spacing:-.015em;text-transform:uppercase;color:#fff;
    text-shadow:0 0 14px rgba(255,255,255,.28),0 0 30px rgba(160,113,255,.3)}
  .pv{color:#b48cff;text-shadow:0 0 16px rgba(160,113,255,.85),0 0 34px rgba(160,113,255,.45)}
  .go{color:#ff8a33;text-shadow:0 0 16px rgba(255,138,51,.8),0 0 34px rgba(255,138,51,.4)}
  .sub{margin-top:16px;font:600 25px/1.35 'JetBrains Mono',monospace;color:#d8d8e0}
  .sub:before{content:"→ ";color:#b48cff}
  #act{position:absolute;left:40px;bottom:46px;display:inline-block;white-space:nowrap;background:#fff;color:#000;
    font:800 22px/1 'JetBrains Mono',monospace;letter-spacing:.04em;text-transform:uppercase;padding:17px 26px;border-radius:999px;
    box-shadow:0 0 30px rgba(160,113,255,.5);will-change:opacity,transform}
  .kicker,.sub{will-change:opacity,transform}
  #prog{position:absolute;left:40px;right:40px;bottom:22px;display:flex;gap:8px}
  #prog i{flex:1;height:4px;border-radius:2px;overflow:hidden;position:relative;background:rgba(255,255,255,.12)}
  #prog i b{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#a071ff,#ff8a33)}
</style></head>
<body><div id="stage">
  <div id="vis"><img id="bgCur"><img id="bgPrev"></div>
  <div id="logo"></div><div id="tag"></div>
  <div id="cap"></div>
  <div id="act"></div>
  <div id="prog"></div>
</div>
<script>
let CFG = null, built = -1, starts = [], total = 0;
const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);

function splitWords(html) {
  const tpl = document.createElement('template'); tpl.innerHTML = html;
  const out = [];
  tpl.content.childNodes.forEach(n => {
    if (n.nodeName === 'BR') { out.push({ br: true }); return; }
    const cls = n.nodeType === 1 ? n.className : '';
    n.textContent.split(/([ \t\n]+)/).forEach(part => { if (part) out.push({ t: part, cls, space: /^[ \t\n]+$/.test(part) }); });
  });
  return out.map(p => p.br ? '<br>' : p.space ? p.t : `<span class="w ${p.cls}">${p.t.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</span>`).join('');
}

window.setup = cfg => {
  CFG = cfg; starts = []; total = 0;
  cfg.scenes.forEach(s => { starts.push(total); total += s.dur; });
  document.getElementById('logo').innerHTML = `<img src="${cfg.logo}" style="height:30px;display:block">`;
  document.getElementById('tag').textContent = cfg.tag || '';
  document.getElementById('prog').innerHTML = cfg.scenes.map(() => '<i><b></b></i>').join('');
  document.getElementById('act').textContent = cfg.cta || '';
  return total;
};

function build(i) {
  const s = CFG.scenes[i], cap = document.getElementById('cap');
  cap.innerHTML = (s.kicker ? `<div class="kicker">${s.kicker}</div>` : '') +
    `<div class="title">${splitWords(s.title)}</div>` +
    (s.sub ? `<div class="sub">${s.sub}</div>` : '');
  built = i;
}

// крупный план: окно кадра сайта (x, y, ширина) растягивается на всю ширину верхней части
function frame(img, s) {
  const [x, y, w] = s.crop, k = 720 / w;
  img.style.transform = `translate(${-x * k}px,${-y * k}px) scale(${k})`;
}
async function setImg(el, src) {
  if (el.getAttribute('src') !== src) { el.setAttribute('src', src); await el.decode().catch(() => {}); }
}

window.render = async t => {
  let i = 0; while (i < CFG.scenes.length - 1 && t >= starts[i + 1]) i++;
  const s = CFG.scenes[i], lt = t - starts[i];
  if (built !== i) build(i);
  const cur = document.getElementById('bgCur'), prev = document.getElementById('bgPrev');
  const k = Math.min(Math.floor(lt * CFG.fps), s.frames - 1);
  await setImg(cur, `${s.dir}/f${String(k + 1).padStart(4, '0')}.jpg`); frame(cur, s);
  if (i > 0 && lt < 0.35) {
    const p = CFG.scenes[i - 1];
    await setImg(prev, `${p.dir}/f${String(p.frames).padStart(4, '0')}.jpg`); frame(prev, p);
    prev.style.opacity = 1 - ease(lt / 0.35);
  } else prev.style.opacity = 0;
  const out = Math.min(1, Math.max(0, (s.dur - lt) / 0.28));
  const fade = (el, a, d, dy) => { if (!el) return; const p = ease((lt - a) / d); el.style.opacity = p * out; el.style.transform = `translateY(${(1 - p) * dy}px)`; };
  const cap = document.getElementById('cap');
  fade(cap.querySelector('.kicker'), 0.05, 0.4, 10);
  const words = [...cap.querySelectorAll('.w')];
  words.forEach((w, n) => { const a = 0.14 + n * 0.07; const p = ease((lt - a) / 0.42); w.style.opacity = p * out;
    w.style.transform = `translateY(${(1 - p) * 18}px)`; w.style.filter = `blur(${(1 - p) * 5}px)`; });
  const after = 0.14 + words.length * 0.07 + 0.12;
  fade(cap.querySelector('.sub'), after, 0.42, 10);
  // кнопка на видео — всё время, с первого кадра; в каждой сцене, когда текст дочитан, — лёгкий «пульс»
  const act = document.getElementById('act'), pulse = Math.max(0, Math.sin(Math.min(1, Math.max(0, (lt - after - 0.5) / 0.7)) * Math.PI));
  act.style.transform = `scale(${1 + 0.045 * pulse})`;
  act.style.boxShadow = `0 0 ${30 + 26 * pulse}px rgba(160,113,255,${0.5 + 0.35 * pulse})`;
  document.querySelectorAll('#prog b').forEach((b, n) => { b.style.width = n < i ? '100%' : n > i ? '0%' : `${Math.min(100, lt / s.dur * 100)}%`; });
};
</script>
</body></html>
