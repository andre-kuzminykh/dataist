<meta name="description" content="Главный специалист OpenAI по глобальным связям Крис Лехейн предлагает политикам заранее готовить меры по ИИ к президентским выборам 2028 года. В новом эссе он сравнивает возможное влияние ИИ на экономику с «Новым курсом» Франклина Рузвельта и описывает пять приоритетов — от защиты работников и образования до безопасности ИИ и строительства дата-центров. Лехейн признаёт тревоги американцев, но делает ставку на расширение применения ИИ; критики считают, что в его предложениях мало обязательств, которые помогли бы распределить выгоды от технологии и ограничить власть компаний.">
