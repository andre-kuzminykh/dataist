<meta name="description" content="Dreamteam, основанный бывшими руководителями Freshworks, привлёк $53 млн, чтобы конкурировать с Salesforce и HubSpot на рынке CRM. Стартап делает ставку на автоматический сбор данных о клиентах из писем и разговоров, а также на ИИ-агентов для подготовки встреч, последующих контактов и контроля сделок. Финансирование включает посевной раунд и раунд серии A; их возглавили Together Fund и Accel соответственно, к ним присоединилась Premji Invest. Dreamteam не раскрыла размер каждого раунда и оценку компании.">
