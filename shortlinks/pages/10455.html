<meta name="description" content="Команда Anthropic проверила, как вредоносная программа с ИИ может распространяться через подключённые к интернету устройства. В эксперименте она разделила свои части между 15 умными телевизорами и использовала вычислительную мощность каждого из них. Исследователи считают, что для успешной атаки ИИ-червю нужны более мощные возможности на менее производительных устройствах, чем доступны сейчас, но нынешние темпы развития могут сделать это возможным к концу года. Эксперты спорят о масштабе угрозы: одни опасаются, что слабую защиту бытовых устройств трудно исправить, другие указывают, что такие атаки пока медленны и их можно блокировать.">
