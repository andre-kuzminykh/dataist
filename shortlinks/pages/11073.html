<meta name="description" content="ElevenLabs представила ElevenAI — экспериментальное приложение для команд, которое объединяет заметки со встреч, диктовку и работу с ИИ-агентами. Сервис запустили на саммите компании 11/11 в Нью-Йорке; пока он доступен в режиме предварительной версии, а для раннего доступа нужно записаться. ElevenAI умеет расшифровывать встречи, отвечать на вопросы по прошлым разговорам, помогать участникам чата в реальном времени и готовить черновики писем по заметкам. Диктовка работает более чем на 90 языках. ElevenLabs оценивается в $22 млрд и представляет продукт как решение для команд.">
