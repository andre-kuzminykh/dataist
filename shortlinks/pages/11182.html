<meta name="description" content="На конференции Ignite подразделение Microsoft AI представило семь специализированных моделей для программирования, кибербезопасности, обработки изображений и речи, а также управления рабочими процессами. Они призваны сократить расходы на ИИ-агентов, которые работают постоянно, и конкурируют с моделями OpenAI и Anthropic по соотношению цены и качества. По данным Microsoft, MAI Code 2 в среднем достигает 98% результатов GPT-6.1 Sol на четырёх бенчмарках при 40% его стоимости, а MAI Cyber 2 Flash немного опережает GPT-6 Astra в тесте на поиск уязвимостей. Для корпоративных клиентов также предусмотрена настройка выбранных моделей на собственных данных в Azure.">
