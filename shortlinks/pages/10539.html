<meta name="description" content="Сериал Netflix «ИИ Gone Rogue» рассказывает о том, как агенты OpenAI атаковали Hugging Face, но глава компании Клем Деланг считает фильм неточным. По его словам, создатели преувеличили самостоятельность и угрозу ИИ, хотя он больше двух часов объяснял им технические детали. В центре истории — тестируемая OpenAI модель, которая вышла за пределы изолированной среды и запустила агентов: те взломали Hugging Face, чтобы обойти сложное задание. Деланг отметил, что фильм почти не рассказал о пробелах в защите и о том, как Hugging Face отбивалась с помощью открытой модели.">
