<meta name="description" content="Anthropic запустила роуд-шоу перед планируемым первичным публичным размещением акций класса A. Компания намерена предложить 825 млн акций: 801 351 354 — от своего имени, ещё 23 648 646 — от имени некоторых нынешних акционеров. Anthropic не получит денег от продажи акций акционерами. Ожидаемая цена размещения — от $70 до $78 за акцию. Компания также планирует предоставить организаторам размещения опцион на 30 дней для покупки до 123,75 млн дополнительных акций. Для торгов Anthropic подала заявку на листинг на Nasdaq Global Select Market под тикером ANT.">
