<meta name="description" content="Nvidia уже сравнивают с Enron — не из-за доказанного мошенничества, а из-за необычных совпадений и вопросов к её финансированию и продажам в Китай. На фоне геополитического скандала глава Nvidia Дженсен Хуанг вернулся к руководству компании и получил овацию сотрудников, как основатель Enron Кеннет Лэй после отставки преемника. Компании использовали похожие юридические структуры в финансовых сделках, но масштабы и характер обвинений различаются: Enron скрывала долги и завышала доходы, тогда как Nvidia действительно зарабатывает на продаже ИИ-чипов. Опасения связаны с тем, какая часть выручки могла поступить от незаконных продаж китайским компаниям, а также с ролью Nvidia в росте ИИ-рынка.">
