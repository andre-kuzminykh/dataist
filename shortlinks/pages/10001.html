<meta name="description" content="Carnegie Mellon University получит от Кена Гриффина $3 млрд — крупнейшее разовое пожертвование в истории американского образования. Основатель и гендиректор хедж-фонда Citadel направит деньги на новый кампус университета в Майами и развитие его подразделений в Питтсбурге. Строительство кампуса, рассчитанного более чем на 3 500 студентов, почти 300 преподавателей и свыше 600 сотрудников, планируют начать в 2027 году. Часть средств пойдёт на финансовую помощь студентам и набор учёных. Школу компьютерных наук переименуют в Kenneth C Griffin School of Computer Science.">
