<meta name="description" content="Команда PhAI Labs и исследователи из Стэнфорда, Оксфорда и Принстона расширили архитектуру JEPA, предложенную Яном Лекуном, и проверили модель JEPA-Anything в семи областях — от физики до медицины. Вместо одной общей догадки о будущем система строит несколько отдельных прогнозов и затем собирает их в целую картину. В испытаниях она улучшила результаты стандартной JEPA, а при анализе данных о биологии указала на сочетание IL-18 и блокировки CD73 как возможный способ борьбы с раком печени. Команда проверила его на клетках, органоидах, образцах опухолей и мышах.">
