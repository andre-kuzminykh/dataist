<meta name="description" content="Индустрии ИИ потребуется выйти на $6 трлн годовой выручки к 2031 году, чтобы оправдать вложения в дата-центры, говорится в анализе Bain &amp; Company. Коммерческие ИИ-инструменты, по оценке авторов, принесут к тому времени $1,8 трлн — значит, ещё $4,2 трлн отрасли нужно будет получить из других источников. Основной автор отчёта Дэвид Кроуфорд считает, что для этого понадобится технологический прорыв, превосходящий эффект от появления мобильных технологий и облачных сервисов. При этом Microsoft, Amazon, Meta и Oracle могут потратить на дата-центры до $780 млрд только в 2026 году.">
