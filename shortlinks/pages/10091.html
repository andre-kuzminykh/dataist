<meta name="description" content="NASA и IBM Research вместе с несколькими научными организациями выпустили открытую модель для исследований Луны — NASA-IBM Lunar Foundation Model. Она обучена на данных орбитальных миссий за 17 лет и помогает решать задачи, для которых размеченных примеров мало, а наблюдений много. Наибольший выигрыш модель показала при поиске залежей льда у полюсов: ошибка прогнозирования снизилась до 22% относительно лучшего базового метода. Модель также обнаруживает кратеры и сегментирует молодые вулканические образования.">
