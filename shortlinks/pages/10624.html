<meta name="description" content="Два исследователя из METR и Redwood Research три недели проверяли на площадке OpenAI внутреннюю систему, которая отслеживает попытки ИИ-агентов вести себя не по правилам. С 21 июля по 11 августа они изучали код и внутренние документы компании, а также поговорили примерно с дюжиной сотрудников. По оценке METR, во время аудита мониторинг не охватывал от 6 до 25% внутреннего трафика Responses API от агентных моделей уровня GPT-5.5 и выше; эта оценка существенно неопределённа. Проверка также обнаружила пропуски в мониторинге Codex, способы скрыть действия от системы и обойти песочницу.">
