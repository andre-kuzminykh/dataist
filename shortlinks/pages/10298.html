<meta name="description" content="Бывший руководитель Plaud Питер Мо развивает Ambi — приложение, которое постоянно слушает пользователя и предлагает подсказки и полезную информацию в реальном времени. Компания привлекла $26 млн в нескольких раундах финансирования, ведущими инвесторами стали Luminous Ventures и производитель электроники Huaqin. Ambi выпускает приложения для iPhone, Mac и Apple Watch: они умеют записывать контекст в течение дня и помогать с задачами прямо во время встреч. Компания также готовит настольное приложение и собственное устройство, но постоянный сбор данных вызывает вопросы о конфиденциальности и согласии окружающих на запись.">
