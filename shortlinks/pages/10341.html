<meta name="description" content="American Express представила фреймворк, который должен проверять намерения клиента до того, как ИИ-агент оплатит покупку. Система фиксирует, что именно поручили купить, и передаёт эти ограничения по всем этапам сделки. Если агент, например, вместо белых кроссовок Nike девятого размера попытается заказать обувь Adidas, Amex сможет остановить оплату. Компания пока не отмечает роста споров из-за покупок через агентов, но готовит защиту заранее: в опросе Amex 66% потребителей в США заявили, что готовы поручить агенту искать лучшие цены, а 61% — подбирать товары или услуги в ближайшие 12 месяцев.">
