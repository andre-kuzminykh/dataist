<meta name="description" content="The Document Foundation, разработчик LibreOffice, заявила, что в обозримом будущем не будет добавлять ИИ в редактор документов. В последней версии, выпущенной в конце августа, организация отдельно подчеркнула, что в программе нет функций генеративного ИИ. По её словам, это решение помогает не отправлять документы на серверы для обработки и оставляет пользователям контроль над данными. Подключить инструменты ИИ всё же можно самостоятельно — через расширения, связывающие редактор с локальными моделями.">
