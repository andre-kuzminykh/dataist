<meta name="description" content="OpenAI добавит к текстам ChatGPT невидимый водяной знак, чтобы выполнить требования ЕС к маркировке материалов, созданных ИИ. Технология textGrain встраивает статистический сигнал в выбор слов. В ближайшие недели маркировку включат для пользователей ChatGPT и Codex в Евросоюзе, а клиенты API по всему миру смогут подключать её по желанию. Водяные знаки также появятся в облачных сервисах партнёров, включая Microsoft Azure. OpenAI утверждает, что textGrain не ухудшает качество ответов, но признаёт: короткие и отредактированные тексты распознавать сложнее.">
