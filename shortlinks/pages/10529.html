<meta name="description" content="OpenAI повысила результаты своих новых моделей на задачах с языками программирования, для которых мало обучающего кода, включая COBOL, Fortran и Visual Basic. По данным компании, эти языки поддерживают критически важную инфраструктуру: IBM оценивает, что COBOL используется более чем в 40% систем онлайн-банкинга и в 95% операций с банкоматами. В тесте MultiLangBench GPT-6 Astra набрала в среднем 87,4% на 20 языках — против примерно 38% у GPT-5.6 Terra. В бенчмарке миграции кода GPT-6.1 Sol достигла точности 97,9% при высоком уровне рассуждений.">
