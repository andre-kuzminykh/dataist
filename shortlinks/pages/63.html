<meta name="description" content="ИИ может не просто выполнять задачи вместо человека, а помогать ему лучше помнить, думать и принимать решения. Авторы предлагают создать личного ИИ-помощника, который годами учитывает привычки, знания и текущую ситуацию человека. Он сможет вовремя напомнить нужное, подсказать слово или помочь с выбором — не вместо человека, а вместе с ним. Но такой помощник затронет и личную жизнь, и правила общества: например, возникнет вопрос, допустима ли его помощь на экзаменах и смогут ли люди отказаться от него. В этом обзоре разбираем, как ИИ может усиливать способности конкретного человека, каким должен быть такой помощник и какие риски придётся учитывать.">
