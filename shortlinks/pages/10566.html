<meta name="description" content="Walmart представила Agent Gateway — шлюз, через который одобренные ИИ-агенты смогут искать товары в онлайн-каталоге компании и покупать их для клиентов. Система будет работать по протоколу MCP и появится также для Sam’s Club. В следующем месяце Walmart запустит профили агентов: покупатели смогут отдельно отслеживать их заказы, устанавливать лимиты расходов и подтверждать каждую покупку. Компания разрешит агентам работать с сайтом только в заданных пределах, не открывая им доступ к платёжным данным. Amazon, крупнейший конкурент Walmart, недавно начал блокировать ИИ-агентов, пытающихся совершать покупки за пользователей.">
