<meta name="description" content="Runway выпустила Praxis-1 — модель управления роботами с открытыми весами и исходным кодом по лицензии Apache 2.0, допускающей коммерческое использование. Она обрабатывает изображения с камеры, текстовые инструкции и данные о положении робота, а затем рассчитывает движения и корректирует их по мере поступления новых кадров. Runway обучала модель на видео и данных роботов; компания сообщает, что Praxis-1 показала лучшие результаты среди моделей класса World Action Model в тесте RoboLab-120. При этом модель пока может путать похожие объекты и не умеет надёжно планировать сложные последовательности действий.">
