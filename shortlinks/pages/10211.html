<meta name="description" content="Исследователи Zenity Labs обнаружили, что одной фразы в чате с публичным агентом Amazon Bedrock AgentCore хватало, чтобы получить контроль над всеми агентами в том же аккаунте AWS и регионе. Из-за уязвимостей AgentCore выдавал внутренние учётные данные AWS, а агенты по умолчанию имели широкие права: исследователи могли читать переписки, скачивать исходный код и похищать сохранённые секреты. AWS частично устранила проблему: затруднила доступ новых агентов к внутренним метаданным и сузила права роли, назначаемой по умолчанию. Zenity всё ещё советует компаниям вручную настраивать для агентов роли с минимально необходимыми разрешениями.">
