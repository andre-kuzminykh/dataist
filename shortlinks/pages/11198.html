<meta name="description" content="Администрация Дональда Трампа ужесточила правила доступа китайских компаний к передовым ИИ-чипам Nvidia. Теперь зарубежным дата-центрам, которые предоставляют Китаю большие объёмы вычислительных мощностей, понадобятся специальные лицензии; ограничения также затронули поставки чипов в пять стран, включая Сингапур и Малайзию. Новые меры охватывают и удалённую аренду вычислительных мощностей — способ использовать чипы за пределами Китая, не ввозив их в страну. Объявление прозвучало на фоне скандала вокруг сооснователя Nvidia Дженсена Хуанга и его отношений с Элис Хуанг, которую подозревают в связях с китайскими спецслужбами.">
