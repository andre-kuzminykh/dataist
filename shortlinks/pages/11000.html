<meta name="description" content="10 ноября Google открыла Gemini 4 Carbon для широкой аудитории — почти через две недели после анонса. Модель доступна платным пользователям Gemini API в поддерживаемых странах, а также подписчикам Google AI Ultra в приложении Gemini, режиме ИИ в поиске и Antigravity. Стартовая цена API — $2 за миллион входных токенов без кеша и $10 за миллион выходных; до 30 ноября это вчетверо дешевле стандартных тарифов Claude Fable 5.2. При этом стоимость выполнения задачи зависит не только от цены токенов, но и от числа попыток и исправлений.">
