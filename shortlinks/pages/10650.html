<meta name="description" content="Новая книга журналиста и ведущего подкаста Tech Won’t Save Us Париса Маркса о дата-центрах выходит на фоне растущего сопротивления их строительству. В Hyperscale: The Ambition and Excess of Big Tech&#x27;s Data Empires он рассказывает об истории борьбы с технологической экспансией — от протестов против компьютеров американских военных во время войны во Вьетнаме до недавних выступлений в Ирландии и Чили. Книга также описывает другой подход: в Новой Зеландии местное сообщество создало модель распознавания речи на языке маори и использовало для хранения данных местных облачных провайдеров. Опыт других стран показывает, с какими проблемами могут столкнуться американские общины, где дата-центры стали темой предстоящих выборов в Конгресс.">
