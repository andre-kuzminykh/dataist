<meta name="description" content="ElevenLabs представила Scribe v3 и Scribe v3 Live — модели распознавания речи для записанных файлов и работы в реальном времени. Они рассчитаны на сложную звуковую среду: например, разговоры с перекрывающимися репликами и фоновым шумом. По данным Artificial Analysis, Scribe v3 входит в число самых точных моделей транскрибации, но уступает конкурентам по скорости и цене. Scribe v3 Live анализирует ход разговора, чтобы голосовые агенты не перебивали собеседника во время короткой паузы. Обе модели доступны через ElevenAPI и ElevenAgents.">
