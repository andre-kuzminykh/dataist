<meta name="description" content="Компания Laplace Intelligence из Энн-Арбора разрабатывает автоматизированную проверку роботов и других систем физического ИИ: ИИ-агенты ищут слабые места в симуляции, прежде чем технику выпустят в реальный мир. Стартап основали Хауи Сан и Генри Лю, опираясь на исследования Мичиганского университета. Среди клиентов Laplace — компания Bot Auto из Техаса и крупный японский автопроизводитель; вместе с Nvidia и T-Mobile стартап также участвует в бесплатном пилотном проекте «умного города» в Сан-Хосе. Сейчас Laplace соревнуется с 19 другими стартапами в Startup Battlefield 200 на конференции TechCrunch Disrupt в Сан-Франциско, которая проходит 13–15 октября.">
