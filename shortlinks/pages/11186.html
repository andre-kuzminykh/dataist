<meta name="description" content="Google DeepMind выпускает Genie 4 — свою самую продвинутую модель мира для создания интерактивных 3D-пространств. Обновление Project Genie открывает модель подписчикам Google AI Ultra; раньше она была доступна только в исследовательской версии. Пользователи могут менять миры текстом в реальном времени — например, корректировать погоду, персонажей и сюжет. Genie 4 также создаёт звук, который меняется в зависимости от происходящего в сцене. Для Genie 3 добавили сессии длиной до трёх минут, панорамы на 360 градусов и возможность связывать миры. Ещё в Project Genie появились ИИ-агент, который создаёт миры по голосовому описанию, и галерея, где можно публиковать и перерабатывать чужие работы.">
