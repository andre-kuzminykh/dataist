<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --fg:#fff;
  --on-fg:#000;
  --avatar-bg:#111;
  --field-bg:#0c0c0e;
  --done-bg:#0b130d;
  --d-hover:#c7c7cc;
  --cta-glow:rgba(255,255,255,.45);
  --cta-glow-2:rgba(255,255,255,.6);
  --toast-bg:rgba(28,28,30,.95);
  --toast-shadow:rgba(0,0,0,.9);
  --glass:rgba(255,255,255,.045);
  --glass-2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.09);
  --line-2:rgba(255,255,255,.16);
  --text:#f5f5f7;
  --muted:#8e8e93;
  --dim:#5c5c61;
  --ok:#30d158;
  --err:#ff6961;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* размеры зависят от высоты экрана — всё влезает без прокрутки */
  --gap:clamp(7px,1.25svh,16px);
  --av:clamp(44px,7.6svh,88px);
  --row:clamp(39px,5.7svh,54px);
  --field:clamp(44px,6svh,50px);
  --cta:clamp(46px,6.6svh,56px);
  --top:clamp(44px,6svh,56px);
}
/* светлая тема: что было белым — чёрное, что было чёрным — белое */
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#fff;
  --fg:#000;
  --on-fg:#fff;
  --avatar-bg:#eee;
  --field-bg:#f5f5f7;
  --done-bg:#eefaf1;
  --d-hover:#3a3a3c;
  --cta-glow:rgba(0,0,0,.22);
  --cta-glow-2:rgba(0,0,0,.32);
  --toast-bg:rgba(250,250,252,.96);
  --toast-shadow:rgba(0,0,0,.18);
  --glass:rgba(0,0,0,.035);
  --glass-2:rgba(0,0,0,.06);
  --line:rgba(0,0,0,.08);
  --line-2:rgba(0,0,0,.14);
  --text:#0a0a0a;
  --muted:#6e6e73;
  --dim:#a1a1a6;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font-family:var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent}
::selection{background:var(--fg);color:var(--on-fg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

/* ── верх ── */
.top{flex-shrink:0;height:var(--top);display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top) 18px 0}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--on-fg);display:grid;place-items:center;
  font:700 12px/1 var(--mono);transition:transform .4s var(--ease)}
.brand:hover .mark{transform:rotate(-12deg) scale(1.08)}
.brand-name{font-weight:600;font-size:17px;letter-spacing:-.02em;line-height:1;margin-top:2px}
.lang{display:flex;align-items:center;gap:7px;font:700 11px/1 var(--mono);letter-spacing:.2em;user-select:none}
.lang button{padding:10px 1px;color:var(--muted);transition:color .2s}
.lang button[aria-pressed="true"]{color:var(--fg);cursor:default}
.lang .sep{color:var(--muted);opacity:.4}
.top-r{display:flex;align-items:center;gap:12px}
.theme{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--text);transition:background .2s,transform .3s var(--ease)}
.theme svg{width:18px;height:18px}
.theme .i-moon{display:none}
:root[data-theme="light"] .theme .i-sun{display:none}
:root[data-theme="light"] .theme .i-moon{display:block}
.theme:active{transform:scale(.9)}
@media (hover:hover){.theme:hover{background:var(--glass-2)}}
body{transition:background-color .3s,color .3s}

/* ── колонка ── */
main{flex:1;width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:var(--gap);
  padding:2px 16px 4px;transition:opacity .2s ease}
main.swap{opacity:0}

.col{display:contents}
.hero{order:1}.sub{order:2}.links{order:3}.cta{order:4}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center}
.avatar{width:var(--av);height:var(--av);margin-bottom:calc(var(--gap) * .8);border-radius:50%;object-fit:cover;background:var(--avatar-bg);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--fg) 14%,transparent)}
.name{font-size:clamp(19px,2.9svh,24px);font-weight:700;letter-spacing:-.03em;line-height:1.15}
.role{margin-top:3px;font-size:clamp(13px,1.8svh,14.5px);line-height:1.35;color:var(--muted)}

/* цифры */
.stats{display:flex;justify-content:center;margin-top:calc(var(--gap) * 1.1)}
.stat{padding:0 clamp(6px,2.2vw,14px);text-align:center}
.stat+.stat{border-left:1px solid var(--line-2)}
.stat b{display:block;font-size:clamp(17px,2.5svh,21px);font-weight:700;letter-spacing:-.03em;line-height:1.15;white-space:nowrap}
.stat span{display:block;margin-top:2px;font-size:11px;line-height:1.3;color:var(--muted);white-space:pre}

/* ── email: спокойная кнопка ── */
.sub{position:relative;display:flex;align-items:center;gap:6px;height:var(--field);padding:4px 4px 4px 15px;border-radius:999px;
  background:var(--field-bg);border:1px solid var(--line-2);overflow:hidden;transition:border-color .25s,box-shadow .25s}
.sub:focus-within{border-color:color-mix(in srgb,var(--fg) 40%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--fg) 6%,transparent)}
.sub.err{border-color:var(--err)}
.sub>svg{width:16px;height:16px;flex-shrink:0;color:var(--dim)}
.sub input{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:0;color:var(--fg);font:500 16px var(--sans);padding-left:4px}
.sub input::placeholder{color:var(--dim)}
.btn{flex-shrink:0;height:100%;display:inline-flex;align-items:center;gap:6px;padding:0 16px;border-radius:999px;
  background:var(--glass-2);border:1px solid var(--line);color:var(--text);font-weight:500;font-size:14px;white-space:nowrap;
  transition:background .25s,transform .25s var(--ease)}
.btn:active{transform:scale(.96)}
@media (hover:hover){.btn:hover{background:color-mix(in srgb,var(--fg) 14%,transparent)}}
.btn .spin{display:none;width:16px;height:16px;border-radius:50%;border:2px solid color-mix(in srgb,var(--fg) 20%,transparent);border-top-color:var(--fg);animation:spin .8s linear infinite}
.sub.busy .btn .spin{display:block}.sub.busy .btn span{display:none}
@keyframes spin{to{rotate:360deg}}
.sub .done{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:14.5px;background:var(--done-bg)}
.sub .done svg{width:20px;height:20px;color:var(--ok)}
.sub .done circle,.sub .done path{stroke-dasharray:80;stroke-dashoffset:80}
.sub.ok{border-color:rgba(48,209,88,.45)}
.sub.ok .done{display:flex}
.sub.ok .done circle{animation:draw .6s var(--ease) forwards}
.sub.ok .done path{animation:draw .4s .3s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.shake{animation:shake .45s var(--ease)}
@keyframes shake{20%{translate:-7px 0}40%{translate:6px 0}60%{translate:-4px 0}80%{translate:2px 0}}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

/* ── список соцсетей и каналов ── */
.links{display:flex;flex-direction:column;gap:6px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:inherit}
.duo .row{min-width:0}
.row{position:relative;display:flex;align-items:center;gap:11px;min-height:var(--row);padding:5px 8px 5px 6px;border-radius:16px;
  background:var(--glass);border:1px solid var(--line);overflow:hidden;isolation:isolate;
  transition:background .3s,border-color .3s,transform .4s var(--ease),color .3s}
.row::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .3s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--fg) 12%,transparent),transparent 50%)}
.ic{width:calc(var(--row) - 12px);height:calc(var(--row) - 12px);max-width:42px;max-height:42px;flex-shrink:0;border-radius:11px;
  display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--line);transition:background .3s,color .3s,border-color .3s}
.ic svg{width:17px;height:17px}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{display:flex;align-items:center;gap:7px;font-size:clamp(14px,2.1svh,15.5px);font-weight:600;letter-spacing:-.015em;line-height:1.15}
.d{--dfs:clamp(11.5px,1.75svh,12.5px);font-size:max(10px,min(var(--dfs),calc((100vw - 116px) / 23)));line-height:1.25;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.go{width:26px;height:26px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;color:var(--dim);transition:transform .4s var(--ease),color .3s,background .3s}
.go svg{width:14px;height:14px}
.row:active{transform:scale(.98);background:var(--glass-2);border-color:var(--line-2)}
.row:active .ic{background:var(--fg);color:var(--on-fg);border-color:var(--fg)}.row:active .go{color:var(--text)}
@media (hover:hover){
  .row:hover{transform:translateY(-2px);border-color:var(--line-2);background:var(--glass-2)}
  .row:hover::before{opacity:1}
  .row:hover .ic{background:var(--fg);color:var(--on-fg);border-color:var(--fg)}
  .row:hover .d{color:var(--d-hover)}
  .row:hover .go{color:var(--text);transform:rotate(45deg)}
}

/* ── акцент: трансформировать бизнес ── */
.cta{display:flex;align-items:center;justify-content:center;gap:10px;height:var(--cta);border-radius:999px;
  background:var(--fg);color:var(--on-fg);font-weight:650;font-size:16px;letter-spacing:-.015em;white-space:nowrap;
  box-shadow:0 0 0 1px var(--fg),0 18px 44px -14px var(--cta-glow);transition:transform .3s var(--ease),box-shadow .3s}
.cta svg{width:18px;height:18px;transition:transform .35s var(--ease)}
.cta:active{transform:scale(.97)}
@media (hover:hover){.cta:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--fg),0 24px 56px -14px var(--cta-glow-2)}.cta:hover svg{transform:translate(3px,-3px)}}

/* ── подпись внизу: элемент Nr ── */
.made{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:clamp(6px,1.2svh,14px) 16px calc(clamp(10px,1.8svh,22px) + env(safe-area-inset-bottom));color:var(--text)}
.el{--s:26px;width:var(--s);height:var(--s);flex-shrink:0;border-radius:6px;border:1px solid color-mix(in srgb,var(--fg) 32%,transparent);background:var(--bg);
  display:grid;place-items:center;transition:background .3s,color .3s,border-color .3s}
.el{color:var(--text)}
.el b{font-size:calc(var(--s) * .6);font-weight:700;letter-spacing:-.06em;line-height:1;margin-left:-.06em}
.made{font-size:13px;line-height:1;color:var(--muted);white-space:nowrap}
.made strong{color:var(--text);font-weight:600}
@media (hover:hover){.made:hover .el{background:var(--fg);color:var(--on-fg);border-color:var(--fg)}}

/* ── всплывашка ── */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:10;width:max-content;max-width:calc(100% - 32px);
  translate:-50% 140%;opacity:0;padding:12px 16px;border-radius:16px;background:var(--toast-bg);border:1px solid var(--line-2);
  box-shadow:0 20px 50px -15px var(--toast-shadow);font-size:13.5px;line-height:1.4;text-align:center;transition:translate .5s var(--ease),opacity .3s}
.toast.show{translate:-50% 0;opacity:1}
.toast.err{border-color:rgba(255,105,97,.5)}

/* ── появление ── */
.rv{opacity:0;scale:.985;animation:rv .7s var(--ease) forwards;animation-delay:calc(var(--i,0) * 45ms + 30ms)}
@keyframes rv{to{opacity:1;scale:1}}

/* ── большие экраны ── */
@media (min-width:768px){
  .top{height:76px;padding:0 32px}
  .mark{width:32px;height:32px;font-size:14px}
  .brand-name{font-size:20px}
  .lang{font-size:13px}
}
/* ── низкие экраны (встроенный браузер Instagram, iPhone SE) ── */
@media (max-width:899px) and (max-height:720px){
  :root{--gap:8px;--av:52px;--row:44px;--field:44px;--cta:46px;--top:44px}
  .avatar{margin-bottom:6px}
  .name{font-size:18px}
  .role{margin-top:1px;font-size:12.5px}
  .stats{margin-top:7px}
  .stat b{font-size:16px}
  .stat span{font-size:10.5px;line-height:1.22}
  .links{gap:4px}
  .ic{border-radius:9px}
  .ic svg{width:15px;height:15px}
  .t{font-size:14px}.d{--dfs:12px}
  .cta{font-size:15px}
  .made{padding-top:5px;padding-bottom:calc(9px + env(safe-area-inset-bottom))}
  .el{--s:23px;border-radius:5px}
  .made{font-size:12px}
}
@media (max-width:899px) and (max-height:650px){
  :root{--gap:6px;--av:42px;--row:40px;--field:40px;--cta:42px;--top:40px}
  .avatar{margin-bottom:4px}
  .name{font-size:16.5px}
  .role{font-size:12px}
  .stats{margin-top:5px}
  .stat b{font-size:14.5px}
  .stat span{font-size:10px}
  .ic{border-radius:8px}
  .ic svg{width:14px;height:14px}
  .t{font-size:13px}.d{--dfs:10.5px}
  .cta{font-size:14.5px}
  .made{padding-top:3px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .el{--s:21px}
  .made{font-size:11.5px}
}
@media (max-width:899px) and (max-height:580px){
  :root{--gap:4px;--av:30px;--row:33px;--field:35px;--cta:37px;--top:34px}
  .name{font-size:15.5px}
  .t{font-size:12.5px}.d{--dfs:10px}
  .stat b{font-size:13.5px}.stat span{font-size:9.5px}
  .links{gap:3px}
}
/* ── веб: две колонки, всё масштабируется от размера экрана ──
   --k = 1px на экране ~1340×830, ≈1.3px на 1920×1080, ≈1.75px на 2560×1440 */
@media (min-width:900px){
  :root{--k:clamp(.8px,min(.075vw,.12vh),1.8px)}
  .top{height:calc(76 * var(--k));padding:0 calc(32 * var(--k))}
  .brand{gap:calc(12 * var(--k))}
  .mark{width:calc(32 * var(--k));height:calc(32 * var(--k));font-size:calc(14 * var(--k))}
  .brand-name{font-size:calc(20 * var(--k))}
  .lang{font-size:calc(13 * var(--k));gap:calc(8 * var(--k))}
  .top-r{gap:calc(16 * var(--k))}
  .theme{width:calc(38 * var(--k));height:calc(38 * var(--k))}
  .theme svg{width:calc(19 * var(--k));height:calc(19 * var(--k))}

  main{max-width:calc(1120 * var(--k));display:grid;grid-template-columns:minmax(0,1fr) minmax(0,calc(500 * var(--k)));align-items:center;
    column-gap:calc(104 * var(--k));padding:0 calc(48 * var(--k))}
  .col{display:flex;flex-direction:column}
  .col-a{align-items:center;gap:calc(36 * var(--k))}
  .hero{align-items:center;text-align:center}
  .avatar{--av:calc(124 * var(--k));margin-bottom:calc(24 * var(--k))}
  .name{font-size:calc(52 * var(--k));letter-spacing:-.045em;line-height:1.02}
  .role{margin-top:calc(10 * var(--k));font-size:calc(18 * var(--k))}
  .stats{justify-content:center;margin-top:calc(28 * var(--k))}
  .stat{padding:0 calc(26 * var(--k))}
  .stat b{font-size:calc(30 * var(--k))}
  .stat span{margin-top:calc(4 * var(--k));font-size:calc(13.5 * var(--k))}
  .col-a .cta{width:100%;max-width:calc(440 * var(--k));--cta:calc(62 * var(--k));font-size:calc(17.5 * var(--k));gap:calc(10 * var(--k))}
  .cta svg{width:calc(18 * var(--k));height:calc(18 * var(--k))}

  .col-b{--row:calc(66 * var(--k));gap:calc(14 * var(--k))}
  .sub{--field:calc(58 * var(--k));padding:calc(5 * var(--k)) calc(5 * var(--k)) calc(5 * var(--k)) calc(18 * var(--k));gap:calc(8 * var(--k))}
  .sub>svg{width:calc(17 * var(--k));height:calc(17 * var(--k))}
  .sub input{font-size:max(16px,calc(16.5 * var(--k)))}

  .ic{width:calc(48 * var(--k));height:calc(48 * var(--k));max-width:none;max-height:none;border-radius:calc(14 * var(--k))}

<body>

<header class="top">
  <a href="https://dataist.ai/" class="brand"><span class="mark">i</span><span class="brand-name" data-t="brand">DATAIST</span></a>
  <div class="top-r">
  <button type="button" class="theme" id="theme" aria-label="Theme">
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  </button>
  <nav class="lang" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
    <span class="sep" aria-hidden="true">|</span>
    <button type="button" data-lang="ru" aria-pressed="false" lang="ru">RU</button>
  </nav>
  </div>
</header>

<main id="main">
 <div class="col col-a">
  <section class="hero">
    <img class="avatar" src="andre.jpeg" alt="" width="128" height="128"
         onerror="if(!this.dataset.f){this.dataset.f=1;this.src='https://dataist.ai/andre.jpeg'}else{this.style.visibility='hidden'}">
    <h1 class="name rv" style="--i:0" data-t="name">Andre Kuzminykh</h1>
    <p class="role rv" style="--i:1" data-t="role"></p>
    <div class="stats rv" style="--i:2" id="stats"></div>
  </section>

  <a class="cta rv" style="--i:12" href="https://andre.technology" target="_blank" rel="noopener">
    <span data-t="cta"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
  </a>
 </div>

 <div class="col col-b">
  <form class="sub rv" style="--i:3" id="sub" novalidate>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
    <input type="email" name="email" id="email" required autocomplete="email" inputmode="email" spellcheck="false" aria-label="Email">
    <input class="hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit" class="btn"><span data-t="button"></span><i class="spin" aria-hidden="true"></i></button>
    <div class="done" role="status"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="13" r="11.5"/><path d="m8 13.5 3.3 3.2L18 9.8"/></svg><span data-t="ok"></span></div>
  </form>

  <nav class="links" id="links"></nav>
 </div>
</main>

<footer class="made rv" style="--i:13">
  <span data-t="madeIn">Made in</span>
  <span class="el" aria-hidden="true"><b>Nr</b></span>
  <strong data-t="madeName">Neuronium</strong>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  /* ═══════════ НАСТРОЙКИ ═══════════
     Ссылки на соцсети — для английской и русской версии свои. */
  var LINKS = {
    en: { youtube: '', linkedin: '', instagram: '', tiktok: '' },
    ru: { youtube: '', instagram: '', tiktok: '' }
  };
  /* Куда отправлять email (Formspree, Buttondown, Unisender, свой API):
     POST с полями email, lang, source. Пока пусто — почта никуда не уходит,
     а форма предлагает подписаться на каналы из списка. */
  var SUBSCRIBE_ENDPOINT = '';
  /* ═════════════════════════════════ */

  var I = {
    telegram: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.94 4.3 18.8 19.1c-.24 1.05-.86 1.31-1.73.82l-4.78-3.53-2.31 2.22c-.25.25-.47.47-.96.47l.34-4.86 8.85-8c.39-.34-.08-.53-.6-.19L6.68 12.92 1.97 11.45c-1.02-.32-1.04-1.02.22-1.51L20.6 2.84c.85-.32 1.6.19 1.34 1.46Z"/></svg>',
    linkedin: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13Zm1.78 13.02H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/></svg>',
    x:        '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.4l-5.8-7.59-6.64 7.59H.47l8.6-9.83L0 1.15h7.6l5.24 6.93 6.06-6.93Zm-1.29 19.5h2.04L6.49 3.24H4.3l13.31 17.41Z"/></svg>',
    youtube:  '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.38.5A3.02 3.02 0 0 0 .5 6.19C0 8.07 0 12 0 12s0 3.93.5 5.81a3.02 3.02 0 0 0 2.12 2.14c1.88.5 9.38.5 9.38.5s7.5 0 9.38-.5a3.02 3.02 0 0 0 2.12-2.14C24 15.93 24 12 24 12s0-3.93-.5-5.81ZM9.55 15.57V8.43L15.82 12l-6.27 3.57Z"/></svg>',
    instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r=".6" fill="currentColor"/></svg>',
    tiktok:   '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.53.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07Z"/></svg>',
    arrow:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>'
  };

  var T = {
    en: {
      title: 'Andre Kuzminykh — DATAIST', brand: 'DATAIST',
      name: 'Andre Kuzminykh',
      role: 'Founder of Andre AI Technologies',
      stats: [['10+ years', 'in AI business\ntransformation'], ['30+', 'companies\ntransformed'], ['$100M+', 'economic\nimpact']],
      placeholder: 'Your email', button: 'Subscribe', ok: 'Done, you’re subscribed',
      bad: 'Looks like a typo in your email', fail: 'Couldn’t send — please try again',
      notYet: 'Email is launching soon. Meanwhile — follow below ↓',
      cta: 'How to run a business with AI',
      madeIn: 'Made in', madeName: 'Neuronium',
      toLight: 'Switch to light theme', toDark: 'Switch to dark theme',
      links: [
        { net: 'youtube',  title: 'Video Journal', desc: 'Life in the world of AI' },
        { net: 'x', title: 'Author’s Channel', desc: 'Cases and thoughts on AI', url: 'https://x.com/andre_dataist' },
        { net: 'linkedin', title: 'Partnerships', desc: 'Collaboration and joint projects' }
      ]
    },
    ru: {
      title: 'Андрей Кузьминых — ДАТАИСТ', brand: 'ДАТАИСТ',
      name: 'Андрей Кузьминых',
      role: 'Основатель Andre AI Technologies',
      stats: [['10+ лет', 'в ИИ-трансформации\nбизнеса'], ['30+', 'компаний\nтрансформировано'], ['$100+ млн', 'экономический\nэффект']],
      placeholder: 'Ваш email', button: 'Подписаться', ok: 'Готово, вы подписаны',
      bad: 'Похоже, в email опечатка', fail: 'Не получилось — попробуйте ещё раз',
      notYet: 'Рассылка скоро откроется. А пока — каналы ниже ↓',
      cta: 'Как вести бизнес с ИИ',
      madeIn: 'Создано в', madeName: 'Нейроний',
      toLight: 'Светлая тема', toDark: 'Тёмная тема',
      links: [
        { net: 'youtube',  title: 'Видеожурнал', desc: 'О жизни в мире ИИ' },
        { net: 'telegram', title: 'Авторский канал', desc: 'Кейсы и мысли об ИИ', url: 'https://t.me/+AXsoJ7OiMG4zMzFi' },
        { net: 'telegram', title: 'Лаборатория', desc: 'Об ИИ-чудесах из научных исследований', url: 'https://t.me/+gjvJGFW0iXUwMjky' },
        { net: 'telegram', title: 'Академия',    desc: 'Новые навыки работы с ИИ',                   url: 'https://t.me/dataist_academy' },
        { net: 'telegram', title: 'Live',        desc: 'Новости из ИИ-индустрии',                  url: 'https://t.me/neuronium_ai' }
      ]
    }
  };

  var $ = function (s) { return document.querySelector(s); };
  var main = $('#main'), form = $('#sub'), email = $('#email'), toast = $('#toast'), tt;
  var lang = detect();

  /* EN по умолчанию; ?lang=ru или выбор посетителя запоминается */
  function detect() {
    try {
      var q = new URLSearchParams(location.search).get('lang');
      if (q === 'ru' || q === 'en') return q;
      var s = localStorage.getItem('dataist_lang');
      if (s === 'ru' || s === 'en') return s;
    } catch (e) {}
    return 'en';
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function render() {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    document.querySelectorAll('[data-t]').forEach(function (el) { var k = el.dataset.t; if (t[k] != null) el.textContent = t[k]; });
    $('.avatar').alt = t.name;
    email.placeholder = t.placeholder;
    document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.lang === lang); });

    $('#stats').innerHTML = t.stats.map(function (x) {
      return '<div class="stat"><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div>';
    }).join('');

    syncTheme();
    $('#links').innerHTML = t.links.map(function (l, i) {
      var url = l.url || LINKS[lang][l.net] || '#';
      var ext = url !== '#' ? ' target="_blank" rel="noopener"' : '';
      return '<a class="row rv" style="--i:' + (4 + i) + '" href="' + esc(url) + '"' + ext + '>' +
        '<span class="ic">' + I[l.net] + '</span>' +
        '<span class="txt"><span class="t">' + esc(l.title) + '</span>' +
        '<span class="d">' + esc(l.desc) + '</span></span>' +
        '<span class="go">' + I.arrow + '</span></a>';
    }).join('') +
      '<div class="duo rv" style="--i:' + (4 + t.links.length) + '">' +
      [['instagram', 'Instagram'], ['tiktok', 'TikTok']].map(function (x) {
        var url = LINKS[lang][x[0]] || '#';
        var ext = url !== '#' ? ' target="_blank" rel="noopener"' : '';
        return '<a class="row" href="' + esc(url) + '"' + ext + '>' +
          '<span class="ic">' + I[x[0]] + '</span>' +
          '<span class="txt"><span class="t">' + x[1] + '</span></span>' +
          '<span class="go">' + I.arrow + '</span></a>';
      }).join('') + '</div>';
  }

  function isLight() { return document.documentElement.getAttribute('data-theme') === 'light'; }
  function syncTheme() {
    var t = T[lang], light = isLight(), btn = $('#theme');
    btn.setAttribute('aria-label', light ? t.toDark : t.toLight);
    btn.title = light ? t.toDark : t.toLight;
    $('#theme-color').setAttribute('content', light ? '#ffffff' : '#000000');
  }
  $('#theme').addEventListener('click', function () {
    var light = !isLight();
    if (light) document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch (e) {}
    syncTheme();
  });

  function say(text, err) {
    clearTimeout(tt);
    toast.textContent = text;
    toast.className = 'toast show' + (err ? ' err' : '');
    tt = setTimeout(function () { toast.className = 'toast' + (err ? ' err' : ''); }, 3800);
  }
  function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

  document.querySelector('.lang').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lang]');
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem('dataist_lang', lang); } catch (e) {}
    try { var u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null, '', u); } catch (e) {}
    main.classList.add('swap');
    setTimeout(function () { render(); main.classList.remove('swap'); }, 180);
  });

  $('#links').addEventListener('pointermove', function (e) {
    var r = e.target.closest('.row'); if (!r) return;
    var b = r.getBoundingClientRect();
    r.style.setProperty('--mx', (e.clientX - b.left) + 'px');
    r.style.setProperty('--my', (e.clientY - b.top) + 'px');
  });

  email.addEventListener('input', function () { form.classList.remove('err'); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var t = T[lang], v = email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) { form.classList.add('err'); shake(form); say(t.bad, true); email.focus(); return; }
    if (form.company.value) return;
    if (!SUBSCRIBE_ENDPOINT) { email.blur(); say(t.notYet); return; }

    var fd = new FormData();
    fd.append('email', v); fd.append('lang', lang); fd.append('source', 'dataist.ai/about');
    form.classList.add('busy');
    fetch(SUBSCRIBE_ENDPOINT, { method: 'POST', body: fd, headers: { Accept: 'application/json' } })
      .then(function (r) { if (!r.ok) throw new Error(r.status); form.classList.add('ok'); email.blur(); })
      .catch(function () { shake(form); say(t.fail, true); })
      .then(function () { form.classList.remove('busy'); });
  });

  render();
})();
</script>
</body>
</html>
