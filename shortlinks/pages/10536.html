<meta name="description" content="Anthropic с трудом находит достаточно облачных мощностей у AWS, Google и Microsoft: компании всё чаще видят в создателе Claude конкурента, а не клиента, говорится в утёкшем документе S-1, на который ссылается The Wall Street Journal. В документе уточняются ранее опубликованные Reuters и Financial Times данные: Anthropic считает, что может потратить на облачные контракты более $750 млрд, включая сделки, которые ещё обсуждаются. При этом компании не хватает мощностей: она арендует собственные дата-центры и сотрудничает с независимыми операторами, но опасается, что из-за небольшого опыта работы они окажутся менее надёжными, чем крупнейшие облачные провайдеры.">
