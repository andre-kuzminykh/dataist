<meta name="description" content="С 1 января расширенная программа налоговых льгот США может охватить более 100 строящихся дата-центров в сельской местности. Закон One Big Beautiful Bill Act открывает компаниям доступ к льготам, если они инвестируют в проекты в определённых сельских районах. Но объём вложений сам по себе не гарантирует, что местные жители получат рабочие места или экономическую выгоду. Исследование Searchlight Institute указывает, что подходящими могут оказаться ещё больше проектов, однако непонятно, какие компании воспользуются программой: налоговые данные конфиденциальны, а Microsoft, Meta и Amazon заявили, что не претендуют на эти льготы.">
