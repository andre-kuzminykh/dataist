<meta name="description" content="В третьем квартале выручка Palantir выросла на 96% год к году, до $2,31 млрд, однако акции компании во вторник немного снизились. Инвесторов насторожили признаки замедления корпоративных продаж: американские компании заключили контракты общей стоимостью $1,46 млрд против рекордных $2,13 млрд кварталом ранее. При этом корпоративная выручка в США впервые превысила доходы от американских госзаказчиков. Руководство повысило годовой прогноз и ожидает, что выручка от коммерческих клиентов в США превысит $3,559 млрд, что соответствует росту как минимум на 143%.">
