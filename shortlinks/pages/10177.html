<meta name="description" content="В Австралии объём жилищного строительства за год, завершившийся в июне, вырос на 8,7% — это самый высокий показатель с 2016 года. Число начатых частных домов достигло 31 707, максимума с 1994 года, если не считать всплеска времён пандемийной программы HomeBuilder и необычно высокого показателя марта 2000 года. Но бум дата-центров тоже набирает силу: за тот же год на них пришлось 20% начатого нежилого строительства, а вложения в их строительство превысили расходы на фабрики более чем в 17 раз. Грег Джерико из Australia Institute предупреждает: дата-центры оттягивают строителей и другие ресурсы от жилья, хотя после завершения строительства будут давать сравнительно мало рабочих мест.">
