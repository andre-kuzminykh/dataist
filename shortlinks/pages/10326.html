<meta name="description" content="Знания стандартных процессов в финансах, закупках и цепочках поставок недостаточно, чтобы ИИ-агенты надёжно выполняли рабочие задачи. Им нужно понимать настройки и правила конкретной компании, связи между её данными и исключения из обычных процедур. SAP утверждает, что это позволяет агентам действовать точнее: например, для клиента PwC сложная операция выставления счёта стала занимать пять минут вместо 35, а точность выросла. В SAP также связывают работу с контекстом бизнеса с результатами Daimler Trucks North America: доля выигранных тендеров на контракты для автопарков выросла примерно с 10% до более чем 40%, а финансовый эффект за 12 месяцев составил около 70 миллионов долларов.">
