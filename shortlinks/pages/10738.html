<meta name="description" content="Энди Джасси вновь заявил, что AWS может вырасти в бизнес с годовой выручкой в триллион долларов. На квартальном отчёте Amazon в четверг он сказал, что прежде компании придётся значительно увеличить вложения в инфраструктуру. Amazon ожидает, что капитальные затраты в 2026 году составят около 220 млрд долларов, большая часть этой суммы пойдёт на AWS. В 2027 году расходы будут ещё выше. Джасси рассчитывает, что выручка AWS будет расти более чем на 40% в год в 2027-м и 2028-м, а отметки в триллион долларов компания достигнет в ближайшие пять-десять лет.">
