<meta name="description" content="Американская Artemis Security выпустила Orion-1 — модель, которая самостоятельно расследует атаки на корпоративные сети и предлагает или запускает ответные меры. Она связывает журналы событий из сетей, облачных сервисов и устройств сотрудников, чтобы восстановить действия одного злоумышленника. В бенчмарке самой компании Orion-1 обошла Claude Opus 5.5 и GPT-6 Sol; наибольший разрыв был в реконструкции атаки — 80,8 балла против 58,3 у ближайшего конкурента. Artemis рассчитывает закрыть пробел, возникший из-за того, что защитные ограничения универсальных моделей мешают специалистам по кибербезопасности анализировать атаки.">
