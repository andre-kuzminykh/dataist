<meta name="description" content="PayPal сообщает, что точность ответов внутреннего помощника для работы с данными выросла с 43% до 95% после того, как компания добавила к нему собственные деловые знания, не меняя базовую большую языковую модель. Вице-президент PayPal и руководитель глобального направления продуктов ИИ Рен Чжан объяснила, что помощнику нужны не только проверенные данные, но и определения, шаблоны запросов и аналитические процедуры сотрудников. Компания стремится хранить эти знания отдельно от моделей, чтобы переносить их при обновлении моделей. Параллельно PayPal настраивает правила для ИИ-агентов: когда им обращаться к проверенным источникам, а когда получать одобрение человека.">
