<meta name="description" content="Исследователи из ETH Zurich превратили серийную роботизированную кисть в самостоятельного робота: она передвигается на кончиках пальцев и одновременно использует их, чтобы взаимодействовать с предметами. Кисть оснастили рюкзаком весом 80 граммов с батареей, датчиком движения и Raspberry Pi Zero. На испытаниях она прошла по 14 типам поверхностей, развила среднюю скорость 9 сантиметров в секунду и смогла передвинуть куб весом 41 грамм к цели на расстоянии до 40 сантиметров — 15 раз подряд. Такой подход может помочь роботам работать в местах, куда не доберётся обычная рука-манипулятор.">
