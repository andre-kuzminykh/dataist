<meta name="description" content="За несколько дней до запланированного на 19 ноября IPO глава Anthropic Дарио Амодей назвал закупку вычислительных мощностей главной деловой дилеммой компании. Их приходится оплачивать за один-два года до того, как станет ясно, оправдает ли расходы выручка. По данным Bloomberg, обязательства Anthropic достигли почти $901 млрд, причём около $71 млрд нужно выплатить к сентябрю 2027 года. Компания рассчитывает привлечь на IPO до $64,4 млрд и ещё $26 млрд в рамках частного размещения, чтобы создать денежный резерв на случай, если расходы на мощности обгонят доходы.">
