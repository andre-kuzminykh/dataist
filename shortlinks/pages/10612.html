<meta name="description" content="Сервис заказа поездок inDrive, в котором пассажиры и водители могут договариваться о цене, планирует в 2027 году начать испытания роботакси в Казахстане. Для этого компания объединилась с китайским разработчиком автономного вождения Pony.ai и Nvidia. Первые тесты пройдут в Астане в первой половине года: сначала в машинах будет находиться оператор безопасности, а в перспективе поездки должны стать полностью беспилотными. Pony.ai предоставит роботакси Gen-7, inDrive подключит их к своему приложению и будет эксплуатировать в Казахстане, а Nvidia — свои технологии, включая платформу Hyperion и систему безопасности Halos.">
