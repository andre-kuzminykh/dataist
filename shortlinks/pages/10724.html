<meta name="description" content="В стартапе Anything 15 человек работают примерно со 150 ИИ-агентами: те назначают встречи, помогают с программированием, маркетингом, поисковой оптимизацией и другими задачами. Основатель компании Друв Амин считает, что скоро такой расклад станет обычным. Но агенты уже вызывают напряжение: они сокращают потребность в некоторых сотрудниках, ошибаются и заменяют общение с людьми. По данным McKinsey, с мая 2025-го по июнь 2026 года ИИ-агентов использовали около 40% крупных организаций — годом ранее было 27%. Компании также рассчитывают сократить штат на 10–15% в ближайшие годы, хотя заметного роста производительности от ИИ пока не наблюдается.">
