<meta name="description" content="NVIDIA выпустила открытую версию SOMA Retargeter v0.2 — инструмента, который адаптирует движения человека к пропорциям и суставам гуманоидных роботов. Он принимает анимацию на скелете SOMA, рассчитывает позы робота и сохраняет траектории в CSV для обучения систем управления. В выпуск вошли примеры и конфигурации для пяти роботов: Unitree G1, Unitree H2, Booster T1, AgiBot X2 Ultra и AgiBot A3T3. Движения можно брать из записей захвата движения, восстанавливать по видео или генерировать по тексту и ограничениям позы.">
