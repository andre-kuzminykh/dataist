<meta name="description" content="8 и 10 декабря 2025 года марсоход NASA Perseverance проехал по маршруту на Марсе, который впервые спланировала модель ИИ — Claude от Anthropic. Инженеры Лаборатории реактивного движения NASA (JPL) поручили ей проложить путь длиной около 400 метров среди камней. Проверка плана смоделировала более 500 000 переменных, а инженерам понадобились лишь небольшие поправки. Успешный заезд показал, что Claude может помочь сократить время планирования маршрутов вдвое и сделать их более последовательными.">
