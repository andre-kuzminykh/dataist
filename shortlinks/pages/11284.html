<meta name="description" content="Perplexity представила Monitor API: он регулярно проверяет сайты и поисковые запросы и отправляет важные изменения приложениям и ИИ-агентам через webhook. Разработчикам доступны два режима — мониторинг тем в вебе и новостях, а также отслеживание до 10 заданных страниц с фиксацией изменений относительно исходной версии. Сервис фильтрует результаты по заданным критериям, а в собственных тестах Perplexity сообщил о 63 свежих релевантных страницах за первые восемь часов — против 20 у Firecrawl и 15 у Exa. API уже доступен: веб-мониторинг стоит $1 за 1000 успешных запусков, мониторинг страниц — $1 за 1000 загруженных URL.">
