<meta name="description" content="OpenAI переводит исследователей по робототехнике в другие команды и рассчитывает ускорить работу над роботами за счёт универсальных моделей, включая GPT-6 Astra. Исследователи войдут в основную исследовательскую команду директора по исследованиям Марка Чена, а прикладное направление робототехники и аппаратная команда перейдут в подразделение Грега Брокмана. На симулированных задачах робототехники агент на базе Astra показал результат 74,8%, тогда как лучшие специализированные модели — 51%. В тесте с реальными роботизированными руками Astra завершила 7 из 100 заданий.">
