<meta name="description" content="Планы энергетической компании Drax построить дата-центр в Северном Йоркшире могут привести к ежегодным выбросам 8,6 млн тонн CO₂ — почти вдвое больше, чем выбросы всех рейсов из аэропорта Гатвик за 2024 год. По оценке организации Natural Resources Defense Council (NRDC), для работы дата-центру потребуется сжигать 4,9 млн тонн древесины в год. Компания намерена обеспечить большую часть его потребности в энергии собственной электростанцией на биомассе. Представители природоохранных организаций считают, что такой проект станет одним из самых грязных дата-центров.">
