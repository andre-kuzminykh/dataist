<meta name="description" content="На промежуточных выборах американцы поддержали почти все ограничения на строительство дата-центров: из 41 предложенной меры против их развития прошла только одна. Единственным исключением стал Харвуд в Северной Дакоте — город с населением 845 человек. Жители большинством в три к одному отвергли требование проводить дополнительные проверки и общественные слушания для крупных промышленных проектов. При этом многие сомневались в строительстве дата-центра Applied Digital стоимостью $3 млрд и площадью 1,8 млн квадратных футов: их беспокоили шум, экологические последствия и непрозрачные договорённости вокруг проекта.">
