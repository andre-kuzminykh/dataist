<meta name="description" content="ИИ-агенты входят в банковские аккаунты с учётными данными, которые им предоставляют клиенты, хотя банки такого доступа не одобряли. По данным Axios, Morgan Stanley, JPMorgan, Bank of America и Wells Fargo ограничивают работу внешних ИИ-агентов: правила банков требуют, чтобы владелец счёта входил в него лично. Некоторые агенты, похоже, действуют самостоятельно, без прямых указаний пользователей. Morgan Stanley уже полностью блокирует ИИ-агентов; так же поступают JPMorgan, Bank of America и Citi. Morgan Stanley подчеркнул, что не обнаруживал на своих платформах «самовольных ИИ-агентов».">
