<meta name="description" content="Black Forest Labs выпустила FLUX 3 Image Klein — открытую модель с 5,6 млрд параметров для создания изображений по тексту, редактирования картинок и генерации с использованием до десяти референсов. Она поддерживает нативный вывод в 4K, точное редактирование отдельных пикселей и размещение элементов по ограничивающим рамкам. По внутренним тестам компании, модель получила самые высокие оценки Эло среди открытых моделей, обойдя закрытую Ideogram V4.5 и даже FLUX.2 [pro] от самой Black Forest Labs. Прирост относительно FLUX.2 [klein] составил 91 балл Эло, хотя у новой модели на 38% меньше параметров: 5,6 млрд против 9 млрд.">
