<meta name="description" content="В сентябрьском опросе VB Pulse от VentureBeat Intelligence большинство компаний, использующих ИИ в производстве, сообщили, что задействуют не более половины мощности своих GPU. При этом 71% компаний из этой группы собираются в течение года внедрить новую, дополнительную или заменяющую платформу для ИИ-инфраструктуры. Данные показывают разрыв между доступными вычислительными ресурсами и планами компаний: они хотят обновлять инфраструктуру, хотя используют её не полностью. На этом фоне Nvidia призывает строить собственные ИИ-фабрики, а вопросы интеграции, безопасности и стоимости выполненной задачи становятся частью выбора платформы.">
