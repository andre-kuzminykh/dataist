<meta name="description" content="Комитет экспертов MIT призывает университеты пересмотреть подход к ИИ: его распространение уже меняет учебную жизнь и отношения между студентами и преподавателями. Студенты реже приходят на консультации, меньше участвуют в онлайн-обсуждениях и собираются в учебные группы. Преподавателям всё труднее понять, чему студенты действительно научились, а взаимное доверие снижается. При этом осенью 2025 года более двух третей опрошенных студентов MIT считали ИИ важным для карьеры, но только около четверти чувствовали, что готовы работать с ним. Комитет предлагает сразу включить основы работы с ИИ во вводные курсы.">
