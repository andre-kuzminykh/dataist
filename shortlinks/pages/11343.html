<meta name="description" content="Стартап Maple привлёк $5,3 млн на развитие ИИ-продуктов, которые, по замыслу компании, не дают ей доступа к пользовательским данным. Деньги пойдут, в частности, на облачного ИИ-агента, способного продолжать работу, даже когда компьютер пользователя выключен. Maple уже предлагает чат-бот и настольное приложение Maple Work: последнее может управлять компьютером, работать с файлами и приложениями и выполнять задачи в браузере. Данные обрабатываются в защищённой аппаратной среде, а стартап планирует выйти на корпоративный рынок с пилотными проектами в следующем году.">
