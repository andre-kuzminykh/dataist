<meta name="description" content="После серии Llama компания Meta возвращается к открытым моделям с Muse Spark Open. По словам Meta, это самая способная открытая модель из США: она рассчитана на задачи по программированию и работу ИИ-агентов, насчитывает 816 млрд параметров, из которых 42 млрд активны, и поддерживает контекст длиной до миллиона токенов. Модель работает с текстом, изображениями, видео и аудио. На бенчмарках JobBench, MCP-Atlas, HLE-Diamond и ZeroBench Meta заявляет о преимуществе над Qwen 3.8, GLM 5.3 и Kimi K3 в нескольких категориях. При этом Muse Spark Open заметно уступает платным моделям Meta Muse Wonder Full.">
