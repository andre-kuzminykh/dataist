<meta name="description" content="Подключение дата-центра к электросети может занять до десяти лет, поэтому разработчики всё чаще строят газовые электростанции прямо рядом с объектами. По данным Cleanview, к октябрю 2026 года в США анонсировали более 100 таких проектов общей мощностью свыше 115 ГВт — это более чем вдвое превышает пиковое потребление электроэнергии в Калифорнии. Большинство планов появилось с начала 2025 года, но пока работает лишь 4,9 ГВт установок, ещё 15,8 ГВт строятся. Собственная генерация помогает быстрее запустить дата-центр, однако может увеличить выбросы парниковых газов и повлиять на цены на энергию.">
