<meta name="description" content="Почти 55 тысяч человек подписали петицию против планов Google построить дата-центр в Тёрроке, в 15 милях к востоку от Лондона. У офиса компании в лондонском районе Кингс-Кросс собрались представители природоохранной организации Buglife, местных экологических групп, некоммерческой организации Foxglove и мотоклуба Thurrock Hammers. Они считают, что проект может навредить редким растениям и животным, увеличить выбросы и лишить местных жителей гоночной трассы. Google обещает сохранить биоразнообразие и компенсировать выбросы, но противники проекта намерены оспаривать его на каждом этапе.">
