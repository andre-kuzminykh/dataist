<meta name="description" content="Американские компании увеличили объём использования ИИ-моделей до рекордного уровня, хотя траты растут медленнее, а цены на токены снижаются. По данным Ramp AI Index, который собирает сведения о платежах более 85 000 компаний в США, за шесть недель токены подешевели на 21,2%, а их объём увеличился на 1,5%. Данные OpenRouter показывают похожую картину: с начала 2026 года недельный объём токенов вырос на 1 215%, расходы — на 455%. Индекс Stripe тоже фиксирует рост ИИ-бизнеса, но его темпы снижаются.">
