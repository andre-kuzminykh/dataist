<meta name="description" content="Открытый плагин TokenEconomizer от UC Berkeley, Microsoft Research и Microsoft Security помогает агентам для программирования экономнее работать с уже знакомыми репозиториями. Он анализирует завершённые сессии и использует накопленный опыт, не меняя агента или его модель. В проверке на 277 задачах по исправлению ошибок расходы снизились на 18,4–30,9% для пяти сочетаний агентов и моделей. Экономия появилась во всех проверенных репозиториях, а успешность выполнения задач в целом оставалась стабильной.">
