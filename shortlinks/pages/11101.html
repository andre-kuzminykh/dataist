<meta name="description" content="В Nvidia сменились руководители службы безопасности: в августе её покинул Дэвид Ребер, проработавший четыре года директором по безопасности и семь лет в компании. Спустя два с половиной месяца компанию оставил генеральный директор Дженсен Хуанг — на фоне вопросов о его внебрачных отношениях, в том числе с руководителем сингапурской компании Megaspeed. Американские следователи подозревают Megaspeed в переправке чипов Nvidia в Китай. Публичных данных, связывающих кадровые изменения с расследованием или отношениями Хуанга, нет. Но остаётся неясным, что знала служба безопасности Nvidia и сообщал ли кто-нибудь о рисках.">
