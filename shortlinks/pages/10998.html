<meta name="description" content="В США камеры с ИИ на школьных автобусах фиксируют водителей, которые не останавливаются, когда автобус раскрывает знак «Стоп» для посадки и высадки детей. Компания BusPatrol установила такие камеры примерно на 35 000 автобусов в 24 штатах: после нарушения запись проверяет человек, готовит материалы для полиции, и водителю отправляют штраф. Компании утверждают, что камеры меняют поведение водителей, но в округе Монтгомери в штате Мэриленд расследование не обнаружило снижения числа столкновений у остановленных школьных автобусов.">
