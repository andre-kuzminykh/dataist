<meta name="description" content="В сельской местности Квинсленда собираются построить дата-центр Anthropic за $31 млрд — крупнейший в Австралии. Он будет обслуживать языковую модель Claude и займёт 725 гектаров неподалёку от Далби. Проекту прочат тысячи рабочих мест, включая около 1 400 постоянных, но жители опасаются огромного энергопотребления и повторения газового бума с его быстрым спадом. За несколько недель петиция против строительства собрала более 21 500 подписей. Власти штата называют проект возможностью для региона, а экологические организации призывают приостановить одобрение новых дата-центров, пока не появятся общенациональные правила.">
