name: Короткие ссылки

# Новая статья раздела → номер dataist.ai/<номер> и страница-переадресация;
# новый урок → в ленты «Читайте также» всех уроков (scripts/education_rails.py),
# вшитые в него библиотеки — ссылками (scripts/education_slim.py).
# Всё решает scripts/shortlinks.py; здесь только запуск, отправка в main и
# оповещение владельца (issue, а если заданы секреты TELEGRAM_BOT_TOKEN и
# TELEGRAM_CHAT_ID — ещё и сообщение в Telegram), когда номера раздела
# подходят к концу и когда закончились (дальше номера не выдаются).
#
# Запускается на пуш статей раздела (у конвейеров это свой токен, поэтому
# событие срабатывает): исследования и уроки — по их страницам index.html
# (обложки, картинки и черновики редактора запуска не дают — конвейер
# заливает их десятками коммитов подряд), новости — по обновлению
# news/index.json, которое конвейер делает раз на публикацию.
# Плюс раз в сутки для подстраховки и вручную. Свой коммит workflow делает
# токеном Actions — такой пуш новых запусков не порождает.

on:
  push:
    branches: [main]
    paths:
      - 'research/**/index.html'
      - '20[0-9][0-9]-*/index.html'
      - 'education/*/index.html'
      - 'news/index.json'
      - 'shortlinks/registry.json'
      - 'scripts/shortlinks.py'
      - 'scripts/education_rails.py'
      - 'scripts/education_slim.py'
      - '.github/workflows/shortlinks.yml'
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Отправить пробное оповещение (issue и Telegram, если настроен)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: shortlinks
  cancel-in-progress: false

jobs:
  shortlinks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      # Репозиторий весит гигабайты (обложки), а нужны только страницы
      # исследований и уроков, индекс новостей, реестр и уже созданные
      # короткие ссылки. Страницы новых новостей скрипт докачивает сам,
      # по одной (клон без содержимого файлов, filter: blob:none).
      # Берём свежий main, а не коммит события: запуски идут по одному,
      # и следующий должен видеть номера, выданные предыдущим.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/shortlinks.py
            /scripts/education_rails.py
            /scripts/education_slim.py
            /shortlinks/
            /research/**/index.html
            /education/*/index.html
            /education/index.json
            /news/index.json
            /[0-9]*/index.html

      - name: Пробное оповещение
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert }}
        run: python3 scripts/shortlinks.py --test-alert

      # Уроки, пришедшие с вшитыми Tailwind и Lucide (1 МБ вместо ~130 КБ), —
      # к виду остальных: библиотеки ссылками, плюс telegram-web-app. Только
      # если на странице от этого ничего не меняется (scripts/education_slim.py);
      # <head> с og и текст урока не трогаются.
      - name: Вес уроков
        run: python3 scripts/education_slim.py --apply

      # Ленты «Читайте также» уроков: новый урок — в education/index.json и
      # во вшитые ленты остальных, карточки неопубликованных — вон
      # (scripts/education_rails.py). До коротких ссылок — им всё равно.
      - name: Ленты обучения
        run: python3 scripts/education_rails.py --apply

      - name: Номера и страницы
        run: python3 scripts/shortlinks.py --apply --notify

      # Выполняется и после сбоя оповещения: созданные ссылки не должны ждать.
      - name: Отправить в main
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A shortlinks education $(ls -d [0-9]* 2>/dev/null | grep -xE '[0-9]+')
          if git diff --cached --quiet; then echo "нечего отправлять"; exit 0; fi
          git commit -q -m "Короткие ссылки и ленты обучения: обновление"
          for i in 1 2 3 4 5 6 7 8; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          echo "не удалось отправить в main"; exit 1

      # Только для журнала, на исход не влияет: отвечает ли сайт по коротким
      # адресам. Новости открываются лишь после выката приложения с маршрутом
      # /<число> — здесь видно, выкачено ли оно.
      - name: Проверка сайта
        if: ${{ always() }}
        continue-on-error: true
        run: |
          for n in 43 1001 10001; do
            code=$(curl -s -o page.html -w '%{http_code}' --max-time 20 "https://dataist.ai/$n" || true)
            mark=$(grep -c "name=\"dataist-shortlink\" content=\"$n\"" page.html 2>/dev/null || true)
            echo "dataist.ai/$n → HTTP $code, страница короткой ссылки: ${mark:-0}"
          done
          rm -f page.html
          # Видят ли сайт поисковые роботы — защита сервера не должна их
          # отсекать: с 26.10 Google почти перестал показывать сайт, хотя
          # обычным запросам он отвечал.
          for ua in "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" \
                    "Mozilla/5.0 (compatible; YandexBot/3.0; +http://yandex.com/bots)" \
                    "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"; do
            bot=$(printf '%s' "$ua" | grep -oE 'Googlebot|YandexBot|Chrome')
            for path in /robots.txt / /ru/ /sitemap.xml /news/index.json; do
              out=$(curl -s -o page.html -D head.txt -w '%{http_code} %{size_download}' --max-time 20 -A "$ua" "https://dataist.ai$path" || true)
              xr=$(grep -i '^x-robots-tag' head.txt | tr -d '\r' || true)
              nr=$(grep -oi '<meta name="robots"[^>]*>' page.html | head -1 || true)
              echo "$bot $path → $out ${xr} ${nr}"
            done
          done
          G="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          art=$(curl -s --max-time 30 -A "$G" https://dataist.ai/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's#</\?loc>##g' | grep '/news/' | head -1)
          echo "--- адреса в sitemap: $(curl -s --max-time 30 -A "$G" https://dataist.ai/sitemap.xml | grep -c '<loc>'), первый новостной: $art"
          for u in https://dataist.ai/ https://dataist.ai/ru/ "$art"; do
            curl -s -o page.html -w "  %{http_code} %{time_total}s $u\n" --max-time 30 -A "$G" "$u" || true
            grep -o '<link rel="canonical"[^>]*>\|<meta name="robots"[^>]*>' page.html | head -3 | sed 's/^/      /'
          done
          # Свежий ли контент на живом сайте: коммит, до которого сайт
          # подтянул репозиторий, против текущего main, и новейшие статьи
          # в sitemap и на главной.
          echo "--- синхронизация: main сейчас $(git rev-parse --short=9 HEAD)"
          curl -s --max-time 20 https://dataist.ai/api/v1/admin/health; echo
          curl -s --max-time 30 -A "$G" https://dataist.ai/sitemap.xml -o sm.xml || true
          echo "  sitemap: новейшие lastmod: $(grep -o '<lastmod>[^<]*' sm.xml | sed 's/<lastmod>//' | cut -c1-10 | sort -r | uniq -c | head -4 | tr -s ' ' | tr '\n' ';')"
          echo "  новость от 02.11 в sitemap: $(grep -c 'vyruchka-anthropic-vyrosla-v-12-raz' sm.xml)"
          curl -s --max-time 30 -A "$G" https://dataist.ai/ -o home.html || true
          echo "  на главной (для Googlebot) ссылок на новости: $(grep -o 'href="[^"]*/news/[^"]*"' home.html | sort -u | wc -l); новейшие даты: $(grep -o '20[0-9][0-9]-[01][0-9]-[0-3][0-9]' home.html | sort -r | uniq | head -3 | tr '\n' ' ')"
          rm -f sm.xml home.html
          # DNS глазами разных резолверов: Google Public DNS проверяет DNSSEC,
          # и при сломанной подписи Googlebot не найдёт сайт вовсе, хотя у
          # большинства читателей он открывается.
          echo "--- DNS:"
          for r in 8.8.8.8 1.1.1.1 9.9.9.9; do
            for t in A AAAA; do
              echo "  @$r $t: $(dig +time=5 +tries=2 @$r dataist.ai $t +dnssec 2>&1 | grep -E 'status:|^dataist\.ai\.' | grep -v RRSIG | tr -s ' \t' ' ' | tr '\n' '|')"
            done
          done
          echo "  @8.8.8.8 A без проверки DNSSEC (+cd): $(dig +time=5 @8.8.8.8 dataist.ai A +cd 2>&1 | grep -E 'status:' | tr -s ' ')"
          echo "  NS: $(dig +short dataist.ai NS @1.1.1.1 | tr '\n' ' ')"
          echo "  DS (подпись у регистратора): $(dig +short dataist.ai DS @1.1.1.1 | tr '\n' ' ')"
          echo "  DNSKEY: $(dig +short dataist.ai DNSKEY @1.1.1.1 | wc -l) ключ(ей)"
          echo "  www: $(dig +short www.dataist.ai @8.8.8.8 | tr '\n' ' ')"
          echo "--- robots.txt (Googlebot):"
          curl -s --max-time 20 -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" https://dataist.ai/robots.txt | head -20
          rm -f page.html head.txt
