<meta name="description" content="ИИ уже помогает командам превращать идею в работающий прототип за минуты. Но выбрать, что создавать, дать системе нужный контекст, встроить её в рабочие процессы и понять, можно ли на неё положиться, по-прежнему непросто. Новые инструменты могут добавлять интерфейсы, которым нужно управлять, промты, которые приходится изучать, и новые процессы, в которых нужно ориентироваться. Корпоративные технологии должны уменьшать эту нагрузку и помогать сотрудникам сосредоточиться на задачах, где нужны опыт, суждение и человеческое взаимодействие. Об этом пишет Морин Джулс-Перес, старший вице-президент по корпоративным технологиям Capital One. В её карьере были электротехника, контроль качества, разработка платформ и серверной части, а затем масштабные технологические внедрения. Этот путь научил её оценивать технологии по тому, что они позволяют людям делать, а не по тому, насколько заметны сами технологии.">
