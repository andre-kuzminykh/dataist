<meta name="description" content="Ballistic Ventures, венчурная фирма, специализирующаяся на кибербезопасности, подала документы на привлечение $490 млн для двух новых фондов. Из них $360 млн предназначены для третьего основного фонда — столько же фирма собрала в 2024 году, — а ещё $130 млн планируется направить в отдельный фонд Ballistic Ventures Fund B. На момент подачи документов продажи долей ни в одном из фондов не были зафиксированы. Сбор средств проходит на фоне роста интереса к кибербезопасности: ИИ помогает злоумышленникам развивать атаки, но одновременно создаёт возможности для стартапов, защищающих компании от таких угроз.">
