    <!-- Инициализация темы -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var dark = stored ? stored === 'dark' : prefersDark;
                if (dark) document.documentElement.classList.add('dark');
            } catch (e) { document.documentElement.classList.add('dark'); }
        })();
    </script>

    <style>
        /* Кружок загрузки — чистый CSS, работает даже если CDN не загрузился */
        .spinner {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 2.5px solid rgba(0, 0, 0, 0.12);
            border-top-color: rgba(0, 0, 0, 0.55);
            border-radius: 9999px;
            animation: spinner-rotate 0.8s linear infinite;
        }
        .dark .spinner {
            border-color: rgba(255, 255, 255, 0.15);
            border-top-color: rgba(255, 255, 255, 0.65);
        }
        .spinner-sm { width: 1.1rem; height: 1.1rem; border-width: 2px; }
        @keyframes spinner-rotate { to { transform: rotate(360deg); } }

        /* Плавный градиент по краям строки тегов: из цвета фона в прозрачность */
        .tag-fade {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2.75rem;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .tag-fade.fade-on { opacity: 1; }
        .tag-fade-l { left: 0; background: linear-gradient(to right, #F5F5F7 20%, rgba(245, 245, 247, 0)); }
        .tag-fade-r { right: 0; background: linear-gradient(to left, #F5F5F7 20%, rgba(245, 245, 247, 0)); }
        .dark .tag-fade-l { background: linear-gradient(to right, #000000 20%, rgba(0, 0, 0, 0)); }
        .dark .tag-fade-r { background: linear-gradient(to left, #000000 20%, rgba(0, 0, 0, 0)); }

        .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Критичная геометрия тегов — в чистом CSS, чтобы одинаковая ширина
           и прокрутка работали даже до/без загрузки Tailwind */
        #tags-row { display: flex; gap: 0.5rem; overflow-x: auto; }

        /* Плавное появление картинок после загрузки */

    <script>
        function refreshIcons() {
            if (window.lucide && lucide.createIcons) { try { lucide.createIcons(); } catch (e) {} }
        }
        refreshIcons();

        function formatDateStr(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        const monthsRu = ['Января', 'Февраля', 'Марта', 'Апреля', 'Мая', 'Июня', 'Июля', 'Августа', 'Сентября', 'Октября', 'Ноября', 'Декабря'];
        function formatDisplayDate(dateObj) {
            const d = String(dateObj.getDate()).padStart(2, '0');
            const m = monthsRu[dateObj.getMonth()];
            const y = dateObj.getFullYear();
            return `${d} ${m} ${y}`;
        }

        function startOfDay(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function parseDateStr(str) {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        const localMocks = {
            "2026-03-03": {
                title: "Context Engineering: новая дисциплина для автономных ИИ-агентов",
                desc: "От README для людей — к документации для машин. Анализ того, как разработчики пишут инструкции для ИИ-агентов в open-source репозиториях.",
                img: "https://i.ibb.co/Csbbn980/Chat-GPT-Image-Mar-3-2026-07-29-15-PM.png"
            },
            "2026-03-02": {
                title: "Reasoning Models: Как модели учатся рассуждать",
                desc: "Глубокий разбор скрытых цепочек рассуждений (Chain of Thought). Как новые архитектуры планируют свои действия перед тем, как дать ответ.",
                img: "https://images.unsplash.com/photo-1620712943543-bcc4688e7485?q=80&w=1200&auto=format&fit=crop"
            }
        };

        const MAX_LOOKBACK_DAYS = 365;
        const NAV_SCAN_DAYS = 30;
        const EARLIEST_ARTICLE = new Date(2025, 7, 23); // первая статья: 2025-08-23
        const FALLBACK_IMG = 'https://images.unsplash.com/photo-1620712943543-bcc4688e7485?q=80&w=1200&auto=format&fit=crop';

        let currentViewDate = startOfDay(new Date());
        let latestAvailableDate = null;
        const articleCache = {};
        const missingDates = new Set();

        const container = document.getElementById('slide-container');
        const elTitle = document.getElementById('article-title');
        const elDesc = document.getElementById('article-desc');
        const elImg = document.getElementById('article-img');
        const elLink = document.getElementById('article-link');
        const elDate = document.getElementById('article-date');
        const elDateMobile = document.getElementById('article-date-mobile');

        const loader = document.getElementById('content-loader');
        const imgLoader = document.getElementById('img-loader');

        const btnsLeft = document.querySelectorAll('.btn-prev');
        const btnsRight = document.querySelectorAll('.btn-next');

        const searchToggle = document.getElementById('search-toggle');
        const searchBox = document.getElementById('search-box');
        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');
        const tagsWrap = document.getElementById('tags-wrap');
        const tagsRow = document.getElementById('tags-row');
        const tagFadeL = document.getElementById('tag-fade-l');
        const tagFadeR = document.getElementById('tag-fade-r');
        const calendarBtn = document.getElementById('calendar-btn');
        const datePicker = document.getElementById('date-picker');
        const resultsPanel = document.getElementById('search-results');
        const resultsList = document.getElementById('results-list');
        const resultsStatus = document.getElementById('results-status');
        const resultsStatusText = document.getElementById('results-status-text');

        async function fetchArticleData(dateObj) {
            const safeDate = startOfDay(dateObj);
            const dateStr = formatDateStr(safeDate);

            if (articleCache[dateStr]) return articleCache[dateStr];
            if (missingDates.has(dateStr)) throw new Error('Статья не найдена');

            const url = `/${dateStr}/`;
            let notFound = false;

            try {
                const res = await fetch(url, { method: 'GET' });
                if (!res.ok) { notFound = true; throw new Error('Not found'); }

                const html = await res.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                const getMeta = (prop) => doc.querySelector(`meta[property="${prop}"]`)?.content;
                const title = getMeta('og:title') || (doc.title || '').trim();
                if (!title) throw new Error('Not an article');

                const data = {
                    title: title,
                    desc: getMeta('og:description') || 'Описание временно недоступно.',
                    img: getMeta('og:image') || FALLBACK_IMG,
                    url: url,
                    dateStr: dateStr,
                    displayDate: formatDisplayDate(safeDate)
                };

                articleCache[dateStr] = data;
                return data;
            } catch (e) {
                if (localMocks[dateStr]) {
                    const data = {
                        ...localMocks[dateStr],
                        url: url,
                        dateStr: dateStr,
                        displayDate: formatDisplayDate(safeDate)
                    };
                    articleCache[dateStr] = data;
                    return data;
                }
                // Запоминаем отсутствие статьи только при настоящем 404,
                // чтобы временный сбой сети не прятал статью до перезагрузки
                if (notFound) missingDates.add(dateStr);
                throw new Error('Статья не найдена');
            }
        }

        async function findLatestAvailableArticle() {
            const d = startOfDay(new Date());
            for (let i = 0; i < MAX_LOOKBACK_DAYS; i++) {
                try {
                    const data = await fetchArticleData(d);
                    return { date: new Date(d), data };
                } catch (e) {
                    d.setDate(d.getDate() - 1);
                }
            }
            throw new Error('Последняя статья не найдена');
        }

        async function findAdjacentArticle(fromDate, direction, maxScanDays = NAV_SCAN_DAYS) {
            const targetDate = startOfDay(fromDate);
            for (let i = 0; i < maxScanDays; i++) {
                targetDate.setDate(targetDate.getDate() + (direction === 'newer' ? 1 : -1));
                if (direction === 'newer' && latestAvailableDate && targetDate > latestAvailableDate) break;
                try {
                    const data = await fetchArticleData(targetDate);
                    return { date: new Date(targetDate), data };
                } catch (e) {}
            }
            return null;
        }

        function applyDataToUI(data) {
            if (!data) return;
            if (!applyDataToUI._imgToken) applyDataToUI._imgToken = 0;

            elTitle.textContent = data.title;
            elDesc.textContent = data.desc;
            elDate.textContent = data.displayDate;
            elDateMobile.textContent = data.displayDate;

            elLink.href = data.url;
            elLink.classList.remove('pointer-events-none', 'opacity-50');

            imgLoader.style.display = 'flex';
            elImg.classList.remove('img-loaded');

            // Токен защищает от гонки: при быстрой листке колбэк устаревшей
            // обложки не должен перезаписать более новую
            const token = ++applyDataToUI._imgToken;
            const nextImg = new Image();
            nextImg.onload = () => {
                if (token !== applyDataToUI._imgToken) return;
                elImg.src = data.img;
                elImg.classList.add('img-loaded');
                imgLoader.style.display = 'none';
            };
            nextImg.onerror = () => {
                if (token !== applyDataToUI._imgToken) return;
                elImg.src = FALLBACK_IMG;
                elImg.classList.add('img-loaded');
                imgLoader.style.display = 'none';
            };
            nextImg.src = data.img;

            loader.style.opacity = '0';
            setTimeout(() => { loader.style.display = 'none'; }, 300);
        }

        function showLoading() {
            loader.style.display = 'flex';
            loader.style.opacity = '1';
            imgLoader.style.display = 'flex';
            elImg.classList.remove('img-loaded');
            elLink.classList.add('pointer-events-none', 'opacity-50');
        }

        async function updateButtons() {
            const disableLeft = !latestAvailableDate || currentViewDate >= latestAvailableDate;
            btnsLeft.forEach(btn => btn.disabled = disableLeft);
            const olderResult = await findAdjacentArticle(currentViewDate, 'older', NAV_SCAN_DAYS);
            btnsRight.forEach(btn => btn.disabled = !olderResult);
        }

        async function navigate(directionText) {
            showLoading();
            const result = await findAdjacentArticle(currentViewDate, directionText, NAV_SCAN_DAYS);
            if (result) {
                currentViewDate = new Date(result.date);
                const exitTo = directionText === 'newer' ? 'slide-hidden-right' : 'slide-hidden-left';
                const enterStart = directionText === 'newer' ? 'slide-hidden-left' : 'slide-hidden-right';
                container.classList.remove('slide-visible');
                container.classList.add(exitTo);
                setTimeout(async () => {
                    applyDataToUI(result.data);
                    container.classList.remove('slide-hidden-left', 'slide-hidden-right');
                    container.classList.add(enterStart);
                    void container.offsetWidth;
                    container.classList.remove('slide-hidden-left', 'slide-hidden-right');
                    container.classList.add('slide-visible');
                    await updateButtons();
                }, 400);
            } else {
                const currentData = articleCache[formatDateStr(currentViewDate)];
                if (currentData) applyDataToUI(currentData);
                await updateButtons();
            }
        }

        async function goToDate(dateObj, data) {
            hideResults();
            collapseMobileSearch();
            showLoading();
            try {
                const articleData = data || await fetchArticleData(dateObj);
                currentViewDate = startOfDay(dateObj);
                applyDataToUI(articleData);
                await updateButtons();
            } catch (e) {
                const currentData = articleCache[formatDateStr(currentViewDate)];
                if (currentData) applyDataToUI(currentData);
                await updateButtons();
            }
        }

        async function initApp() {
            showLoading();
            try {
                const result = await findLatestAvailableArticle();
                latestAvailableDate = new Date(result.date);
                currentViewDate = new Date(result.date);
                applyDataToUI(result.data);
                if (datePicker) {
                    datePicker.max = formatDateStr(latestAvailableDate);
                    datePicker.min = formatDateStr(EARLIEST_ARTICLE);
                }
                await updateButtons();
            } catch (e) {
                elTitle.textContent = "Нет доступных статей";
                elDesc.textContent = "Возможно, сайт только запущен или возникла ошибка сети.";
                elDate.textContent = "--.--.----";
                elDateMobile.textContent = "--.--.----";
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; }, 300);
                btnsLeft.forEach(btn => btn.disabled = true);
                btnsRight.forEach(btn => btn.disabled = true);
            }
        }

        btnsLeft.forEach(btn => btn.addEventListener('click', () => { if (!btn.disabled) navigate('newer'); }));
        btnsRight.forEach(btn => btn.addEventListener('click', () => { if (!btn.disabled) navigate('older'); }));

        document.addEventListener('keydown', (e) => {
            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
            if (e.key === 'ArrowLeft' && !btnsLeft[0].disabled) navigate('newer');
            else if (e.key === 'ArrowRight' && !btnsRight[0].disabled) navigate('older');
        });

        let touchStartX = 0;
        let touchEndX = 0;
        container.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
        container.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            const swipeThreshold = 50;
            if (touchEndX < touchStartX - swipeThreshold) { if (!btnsRight[0].disabled) navigate('older'); }
            if (touchEndX > touchStartX + swipeThreshold) { if (!btnsLeft[0].disabled) navigate('newer'); }
        }, {passive: true});

        const themeToggleBtn = document.getElementById('theme-toggle');
        const html = document.documentElement;

        function applyTheme(isDark) {
            if (isDark) { html.classList.add('dark'); try { localStorage.setItem('theme', 'dark'); } catch (e) {} }
            else { html.classList.remove('dark'); try { localStorage.setItem('theme', 'light'); } catch (e) {} }
            setTimeout(refreshIcons, 50);
        }

        themeToggleBtn.addEventListener('click', () => {
            applyTheme(!html.classList.contains('dark'));
        });

        /* ============================================================
           ПОИСК, ТЕГИ, КАЛЕНДАРЬ
           ============================================================ */

        // Ключевые слова тегов (поиск по заголовку и описанию статьи)
        const TAG_KEYWORDS = {
            learning: ['обучени', 'обучаем', 'обучать', 'обучил', 'учится', 'учатся', 'дообуч', 'подкреплен', 'fine-tun', 'finetun', 'sft', 'rlhf', 'дистилл', 'distill', 'learning', 'train'],
            agents:   ['агент', 'agent', 'мультиагент'],
            llm:      ['llm', 'языковая', 'языковые', 'языковых', 'языковой', 'gpt', 'трансформер', 'transformer', 'токен'],
            science:  ['исследован', 'научн', 'наука', 'бенчмарк', 'benchmark', 'архитектур', 'эксперимент', 'arxiv'],
            robots:   ['робот', 'robot', 'воплощ', 'embodied', 'манипулятор']
        };
        const TAG_LABELS = { learning: 'Обучение', agents: 'Агенты', llm: 'LLM', science: 'Наука', robots: 'Роботы' };

        function keywordRegex(word) {
            const esc = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            if (word.length <= 4 && /^[a-z]+$/i.test(word)) {
                return new RegExp('(^|[^a-zA-Z])' + esc + '([^a-zA-Z]|$)', 'i');
            }
            return new RegExp(esc, 'i');
        }
        const TAG_MATCHERS = {};
        for (const key in TAG_KEYWORDS) TAG_MATCHERS[key] = TAG_KEYWORDS[key].map(keywordRegex);

        function articleText(data) {
            return (data.title + ' ' + data.desc);
        }

        function matchesTag(data, tagKey) {
            const text = articleText(data);
            return TAG_MATCHERS[tagKey].some(rx => rx.test(text));
        }

        function matchesQuery(data, query) {
            return articleText(data).toLowerCase().includes(query.toLowerCase());
        }

        /* ---------- Индекс статей (строится в фоне при первом поиске) ---------- */

        let indexPromise = null;
        let indexDone = false;
        const indexedArticles = [];

        function buildIndex() {
            if (indexPromise) return indexPromise;
            indexPromise = (async () => {
                const start = latestAvailableDate ? new Date(latestAvailableDate) : startOfDay(new Date());
                const dates = [];
                const d = new Date(start);
                while (d >= EARLIEST_ARTICLE) {
                    dates.push(formatDateStr(d));
                    d.setDate(d.getDate() - 1);
                }
                let i = 0;
                const CONCURRENCY = 6;
                async function worker() {
                    while (i < dates.length) {
                        const ds = dates[i++];
                        try {
                            const data = await fetchArticleData(parseDateStr(ds));
                            indexedArticles.push(data);
                        } catch (e) {}
                    }
                }
                await Promise.all(Array.from({ length: CONCURRENCY }, worker));
                indexedArticles.sort((a, b) => (a.dateStr < b.dateStr ? 1 : -1));
                indexDone = true;
            })();
            return indexPromise;
        }

        /* ---------- Панель результатов ---------- */

        let searchGeneration = 0;
        let activeTag = 'all';

        function hideResults() {
            searchGeneration++;
            resultsPanel.classList.add('hidden');
            resultsList.innerHTML = '';
            setResultsStatus(null);
        }

        function setResultsStatus(text) {
            if (text) {
                resultsStatus.classList.remove('hidden');
                resultsStatus.classList.add('flex');
                resultsStatusText.textContent = text;
            } else {
                resultsStatus.classList.add('hidden');
                resultsStatus.classList.remove('flex');
            }
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function renderResults(items, emptyText) {
            resultsList.innerHTML = '';
            if (!items.length) {
                if (emptyText) {
                    resultsList.innerHTML = '<div class="px-5 py-6 text-center font-mono text-xs text-apple-textMutedLight dark:text-apple-textMutedDark tracking-widest uppercase">' + escapeHtml(emptyText) + '</div>';
                }
                return;
            }
            const frag = document.createDocumentFragment();
            items.forEach(data => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'w-full text-left flex items-center gap-3 px-3.5 py-3 hover:bg-black/5 dark:hover:bg-white/10 transition-colors border-b border-black/5 dark:border-white/5';
                item.innerHTML =
                    '<span class="relative w-14 h-14 rounded-xl overflow-hidden shrink-0 bg-black/5 dark:bg-white/10 flex items-center justify-center">' +
                        '<span class="spinner spinner-sm absolute"></span>' +
                        '<img loading="lazy" class="img-fade absolute inset-0 w-full h-full object-cover" alt="">' +
                    '</span>' +
                    '<span class="min-w-0 flex flex-col gap-1">' +
                        '<span class="font-mono text-[10px] text-apple-textMutedLight dark:text-apple-textMutedDark tracking-widest uppercase">' + escapeHtml(data.displayDate) + '</span>' +
                        '<span class="font-sans text-sm font-semibold leading-snug text-black dark:text-white" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">' + escapeHtml(data.title) + '</span>' +
                    '</span>';
                const img = item.querySelector('img');
                img.onload = () => img.classList.add('img-loaded');
                img.onerror = () => { img.style.display = 'none'; };
                img.src = data.img;
                item.addEventListener('click', () => goToDate(parseDateStr(data.dateStr), data));
                frag.appendChild(item);
            });
            resultsList.appendChild(frag);
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        // Общий цикл: строит индекс в фоне и постепенно показывает совпадения
        async function runFilter(matcher, emptyText) {
            const generation = ++searchGeneration;
            resultsPanel.classList.remove('hidden');
            setResultsStatus('Ищем…');
            buildIndex();

            let lastCount = -1;
            while (true) {
                if (generation !== searchGeneration) return;
                const matched = indexedArticles.filter(matcher);
                if (matched.length !== lastCount) {
                    lastCount = matched.length;
                    renderResults(matched, null);
                }
                if (indexDone) break;
                await sleep(350);
            }
            if (generation !== searchGeneration) return;
            setResultsStatus(null);
            const matched = indexedArticles
                .slice()
                .sort((a, b) => (a.dateStr < b.dateStr ? 1 : -1))
                .filter(matcher);
            renderResults(matched, emptyText || 'Ничего не найдено');
        }

        /* ---------- Поиск ---------- */

        let searchDebounce = null;

        searchInput.addEventListener('input', () => {
            const q = searchInput.value.trim();
            searchClear.classList.toggle('hidden', q.length === 0);
            clearTimeout(searchDebounce);
            if (q.length < 2) {
                hideResults();
                return;
            }
            clearActiveTagUI();
            searchDebounce = setTimeout(() => {
                runFilter(data => matchesQuery(data, q), 'Ничего не найдено');
            }, 350);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                searchInput.value = '';
                searchClear.classList.add('hidden');
                hideResults();
                collapseMobileSearch();
                searchInput.blur();
            }
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            searchClear.classList.add('hidden');
            hideResults();
            if (isMobile()) collapseMobileSearch();
            else searchInput.focus();
        });

        /* ---------- Мобильный режим поиска (иконка -> поле) ---------- */

        function isMobile() {
            return window.matchMedia && window.matchMedia('(max-width: 767px)').matches;
        }

        let mobileSearchOpen = false;

        function expandMobileSearch() {
            mobileSearchOpen = true;
            searchBox.classList.remove('hidden');
            searchBox.classList.add('flex');
            tagsWrap.classList.add('hidden');
            calendarBtn.classList.add('hidden');
            setTimeout(() => searchInput.focus(), 50);
        }

        function collapseMobileSearch() {
            if (!mobileSearchOpen) return;
            mobileSearchOpen = false;
            if (isMobile()) {
                searchBox.classList.add('hidden');
                searchBox.classList.remove('flex');
            }
            tagsWrap.classList.remove('hidden');
            calendarBtn.classList.remove('hidden');
            requestAnimationFrame(updateTagFades);
        }

        searchToggle.addEventListener('click', () => {
            if (mobileSearchOpen) {
                hideResults();
                collapseMobileSearch();
            } else {
                expandMobileSearch();
            }
        });

        // При смене ориентации/размера возвращаем корректное состояние
        window.addEventListener('resize', () => {
            if (!isMobile()) {
                searchBox.classList.remove('hidden');
                searchBox.classList.add('flex');
                tagsWrap.classList.remove('hidden');
                calendarBtn.classList.remove('hidden');
                mobileSearchOpen = false;
            } else if (!mobileSearchOpen) {
                searchBox.classList.add('hidden');
                searchBox.classList.remove('flex');
            }
            updateTagFades();
        });

        /* ---------- Теги ---------- */

        function clearActiveTagUI() {
            activeTag = 'all';
            tagsRow.querySelectorAll('.tag-chip').forEach(chip => {
                chip.classList.toggle('tag-active', chip.dataset.tag === 'all');
            });
        }

        tagsRow.querySelectorAll('.tag-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                const tag = chip.dataset.tag;
                tagsRow.querySelectorAll('.tag-chip').forEach(c => c.classList.toggle('tag-active', c === chip));
                searchInput.value = '';
                searchClear.classList.add('hidden');
                if (tag === 'all') {
                    activeTag = 'all';
                    hideResults();
                    return;
                }
                activeTag = tag;
                runFilter(data => matchesTag(data, tag), 'Статей с тегом «' + TAG_LABELS[tag] + '» не найдено');
            });
        });

        /* ---------- Градиенты по краям строки тегов ---------- */

        function updateTagFades() {
            if (!tagsRow || tagsWrap.classList.contains('hidden')) return;
            const maxScroll = tagsRow.scrollWidth - tagsRow.clientWidth;
            const x = tagsRow.scrollLeft;
            tagFadeL.classList.toggle('fade-on', maxScroll > 8 && x > 4);
            tagFadeR.classList.toggle('fade-on', maxScroll > 8 && x < maxScroll - 4);
        }
        tagsRow.addEventListener('scroll', updateTagFades, { passive: true });
        window.addEventListener('load', updateTagFades);

        /* ---------- Календарь ---------- */

        calendarBtn.addEventListener('click', () => {
            if (datePicker.showPicker) { try { datePicker.showPicker(); } catch (e) {} }
        });

        datePicker.addEventListener('change', async () => {
            if (!datePicker.value) return;
            hideResults();
            collapseMobileSearch();
            const picked = parseDateStr(datePicker.value);
            showLoading();
            try {
                const data = await fetchArticleData(picked);
                currentViewDate = startOfDay(picked);
                applyDataToUI(data);
                await updateButtons();
            } catch (e) {
                // На выбранную дату статьи нет — показываем ближайшую более раннюю
                const older = await findAdjacentArticle(picked, 'older', 60);
                if (older) {
                    currentViewDate = new Date(older.date);
                    applyDataToUI(older.data);
                    await updateButtons();
                } else {
                    const currentData = articleCache[formatDateStr(currentViewDate)];
                    if (currentData) applyDataToUI(currentData);
                    await updateButtons();
                }
            }
        });

        /* ---------- Закрытие панели результатов ---------- */

        document.addEventListener('click', (e) => {
            const controls = document.getElementById('controls');
            if (!controls.contains(e.target)) {
                hideResults();
                if (mobileSearchOpen && !searchInput.value.trim()) collapseMobileSearch();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') hideResults();
        });

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            updateTagFades();
        });
    </script>
</body>
</html>
