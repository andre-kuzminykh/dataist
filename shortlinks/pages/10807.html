<meta name="description" content="Израильский стартап 42AI вышел из скрытого режима с посевным финансированием в $62,5 млн и заявил, что разрабатывает «модель мира поведения», способную предсказывать решения людей в новых ситуациях. Сейчас систему тестируют в нескольких финансовых брокерских компаниях: она оценивает, как отдельные трейдеры могут отреагировать на волатильность рынка. По словам компании, модель анализирует психологические склонности человека и рассчитывает вероятность его решений. 42AI утверждает, что предсказывает направление и объём торгов с оценкой F1 от 0,8 до 0,85, однако точность зависит от доступных данных и контекста.">
