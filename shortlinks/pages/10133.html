<meta name="description" content="Теория «великого замещения» утверждает, что белое население вытесняют небелые мигранты по замыслу тайной мировой элиты. Философ Джейсон Стэнли пишет, что этот страх отвлекает от реального процесса: технологические компании создают системы, которые могут заменить человеческий труд и навыки ИИ-агентами. Он приводит в пример программу немецкой партии «Альтернатива для Германии» (AfD): партия связывает внедрение ИИ и автоматизацию с сокращением потребности в квалифицированных мигрантах. Стэнли также противопоставляет трансгуманизму, который обещает технологически улучшить человека, идею «преемничества ИИ» — передачи ИИ роли людей и, в перспективе, центрального места в моральных представлениях.">
