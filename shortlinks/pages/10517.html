<meta name="description" content="Mistral AI выпустила Voxtral 3 — семейство языковых моделей для голосовых ИИ-агентов, которые могут слушать, рассуждать и отвечать в реальном времени. В систему входят модель распознавания речи Voxtral Small Transcribe 3, модель синтеза речи Voxtral Mini TTS 3 и набор средств для разработки голосовых агентов на основе LiveKit. Они объединяют распознавание, рассуждение, работу с инструментами и озвучивание в одном потоковом пайплайне. Расшифровка поддерживает более 50 языков, а синтез речи — свыше 35 языков и 50 диалектов с адаптацией эмоциональной окраски. Во время разговора агенты могут обращаться к внешним системам — например, записывать на приём или проверять счета.">
