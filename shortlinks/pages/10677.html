<meta name="description" content="Anthropic объявила о партнёрстве с 20 научными фондами, учреждениями и исследовательскими группами по всему миру в рамках программы ИИ for Science. Она предоставляет исследователям бесплатные кредиты Claude для работы над научными проектами с большим потенциалом влияния. Среди новых участников — фонды, университеты, лаборатории и отдельные исследовательские инициативы. Программа началась в мае 2025 года и теперь расширяется от поддержки отдельных учёных к масштабному сотрудничеству с организациями. Некоторые проекты будут создавать открытые наборы данных, программное обеспечение, стандарты и библиотеки для научного сообщества.">
