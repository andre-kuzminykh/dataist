<meta name="description" content="Два ведущих исследователя Ethereum предупредили: в худшем случае развитие ИИ в математике может позволить взломать систему подписей криптокошельков уже в ближайшие месяцы. Джастин Дрейк призвал блокчейн-индустрию подготовиться к «режиму бункера». Он рекомендует переводить средства на адреса, с которых ещё ни разу не подписывали транзакции: подпись раскрывает публичный ключ, который теоретически может помочь злоумышленнику вычислить приватный ключ и украсть средства. Виталик Бутерин согласился с предупреждением, но предостерёг от поспешных переводов. Пока действующую схему подписей ECDSA на практике никто не взломал.">
