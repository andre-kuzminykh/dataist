<meta name="description" content="Doug Field, работавший над электромобилями Ford и Tesla и возглавлявший автомобильный проект Apple, стал президентом Mind Robotics — робототехнической компании в сфере промышленного ИИ, выделенной из Rivian. О назначении сообщили на сцене TechCrunch Disrupt 2026, который проходит 13–15 октября в Сан-Франциско. Field будет отвечать за повседневную работу компании, включая продукт, инженерию и операции; генеральный директор Rivian RJ Scaringe сохранит участие в проекте. Mind Robotics основана год назад и уже привлекла более $1 млрд. Компания разрабатывает роботов и базовые модели для автоматизации промышленных и производственных задач.">
