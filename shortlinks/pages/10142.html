<meta name="description" content="Апелляционный суд США подтвердил решение: компания Ross Intelligence нарушила авторские права, обучая поисковую систему для юристов на материалах базы Westlaw, принадлежащей Thomson Reuters. Суд решил, что использование редакционных пояснений Westlaw не было добросовестным использованием — исключением, которое в США допускает работу с защищёнными произведениями, например, для критики, журналистики и исследований. Решение может повлиять на споры между ИИ-компаниями и правообладателями, но дело Ross не касается генеративного ИИ, а его влияние на отрасль остаётся неопределённым.">
