<meta name="description" content="Tesla начала выпуск человекоподобных роботов Optimus на заводе во Фримонте, штат Калифорния. Производство разместили в цехе, где раньше собирали электромобили. Компания назвала роботов с новой линии первыми экземплярами производственного качества и заявила, что нынешний процесс подходит для коммерческого продукта. Илон Маск предупредил, что выпуск будут наращивать медленно и с трудностями, но пообещал к концу 2027 года выйти на 20 000 роботов в неделю. На фоне расходов на Optimus, ИИ и автономное вождение прибыль Tesla за третий квартал снизилась на 43%.">
