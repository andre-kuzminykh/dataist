<meta name="description" content="За последние четыре месяца медсестра реанимации из Флориды Эмбер Ретцлофф попросила поставить её на 50 конкретных 12-часовых смен. Но больше чем в половине случаев программа для составления графиков на базе Palantir назначала ей другие смены — нередко три дня подряд, после которых она чувствовала себя измотанной. Ретцлофф не рассчитывает всегда получать желаемые смены, но, по её подсчётам, программа учитывает пожелания хуже, чем менеджеры, которые составляли графики вручную. Похожие жалобы звучат от медсестёр крупнейшей в США сети больниц HCA Healthcare: с 2023 года компания внедрила разработанную совместно с Palantir систему Timpani примерно в 130 из 190 своих учреждений. Медсёстры утверждают, что из-за её решений команды остаются без достаточного числа сотрудников, а пациенты могут страдать от нехватки персонала.">
