<meta name="description" content="Сенатор штата Калифорния Скотт Винер победил на выборах в Конгресс на месте Нэнси Пелоси, освободившемся в Сан-Франциско. Он выступает за федеральное регулирование ИИ и может участвовать в его разработке. Винер уже подготовил два закона штата об ИИ: первый, SB 1047, губернатор Гэвин Ньюсом отклонил, второй, SB 53, подписал. Теперь Винер хочет, чтобы Конгресс ввёл проверки и аудит ИИ-систем, защиту информаторов и возможность отключить опасную систему. При этом он против того, чтобы федеральные нормы лишили штаты права принимать собственные законы.">
