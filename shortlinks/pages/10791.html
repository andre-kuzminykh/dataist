<meta name="description" content="Художница-питджантджатджара Салли Скейлс заявила, что ИИ использует искусство коренных народов Австралии и выдаёт результат за «дешёвую продукцию с Temu». По её словам, это лишает художников контроля над своими работами и подрывает их подлинность. Скейлс возглавляет консультативную группу по вопросам коренных народов при Национальной галерее Австралии. Художники и специалисты предупреждают: ИИ может воспроизводить произведения и культурные знания без разрешения и оплаты, а созданные изображения затем продают как искусство аборигенов.">
