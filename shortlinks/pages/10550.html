<meta name="description" content="По данным CrowdStrike, с мая по август четыре ранее не описанные группы киберпреступников применяли ИИ-агентов для атак и обходили встроенные в модели ограничения. Они работали на китайском, испанском и английском, индонезийском и русском языках; две группы создали сложные программные системы для управления моделями, а две использовали более простые инструменты. Злоумышленники атаковали организации в нескольких странах, а некоторые добились взломов. В основном они обращались к старым версиям Claude от Anthropic и открытым моделям DeepSeek, настраивая атаки так, чтобы те могли долго идти без участия человека.">
