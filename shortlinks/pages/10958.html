<meta name="description" content="Андрей Карпати создал HackerTube с помощью модели Claude Opus 5.5: она обработала 43 миллиона комментариев за 20 лет работы Hacker News и отобрала 6454 видео, которые там рекомендовали. По словам Карпати, смотреть их удобнее, чем видео в рекомендациях YouTube. Сервис не требует входа в аккаунт, показывает кадр из середины ролика вместо специально подобранной миниатюры и хранит данные о просмотре в браузере. Следом Карпати собрал TristanTube: по его словам, Claude Code справилась с этим за один запуск и три минуты. В подборку вошли 47 000 видео с каналов из списка Тристана Хьюма.">
