<meta name="description" content="В Google Labs запустили Playground — сервис, который превращает описание обычным языком в работающую игру в браузере. Автору хватило одного дня, чтобы собрать три игры: «Тетрис» со свиньями, симулятор званого ужина и киберпанк-шутер про обиженного бывшего полицейского. Игры можно дорабатывать новыми запросами, а также загружать в качестве образцов собственные фото, видео и модели. Но Playground ограничивает число генераций, а созданные игры часто получаются похожими друг на друга и не слишком качественными.">
