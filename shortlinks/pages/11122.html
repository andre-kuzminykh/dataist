<meta name="description" content="Hugging Face и OpenRouter объединяют сервисы, чтобы упростить запуск моделей с открытыми весами. Теперь запросы к языковым моделям через инференс Providers будут направляться через OpenRouter: он выберет поставщика по текущим цене, скорости и надёжности и повторит запрос у другого, если первый не сработает. Код и токен Hugging Face менять не нужно. OpenRouter обслуживает более 800 триллионов токенов в месяц для свыше 10 миллионов пользователей и маршрутизирует запросы между более чем 600 моделями и 80 поставщиками.">
