<meta name="description" content="Команда OpenAI с помощью GPT-6 Astra спроектировала с нуля устройство, позволяющее общаться с агентом для программирования Codex. На работу ушло меньше недели: модель подготовила корпус, компоновку печатной платы и подбор компонентов, прошивку и интерфейс. Подрядчик выпустил небольшую партию прототипов менее чем за месяц, но проект пришлось несколько раз дорабатывать из-за ограничений производства, допусков и особенностей сборки. OpenAI также сообщила о тестировании внутренней модели, набравшей 0,875 балла в бенчмарке BenchCAD 2.0 против 0,594 у GPT-6 Astra на максимальном уровне рассуждения.">
