<meta name="description" content="Киберпреступники, которых связывают с Китаем, представлялись сотрудниками Anthropic и бывшими чиновниками США, чтобы выманить сведения о разработке американского ИИ. По данным компании Proofpoint, группа TA419 рассылала экспертам по политике ИИ в аналитических центрах, университетах и юридических фирмах письма с приглашениями в вымышленные организации и проекты. После нескольких сообщений злоумышленники отправляли документы с вредоносным ПО, которое должно было открыть им доступ к облачным учётным записям. В одном из писем хакеры от имени старшего сотрудника Anthropic просили прокомментировать использование Claude в военной сфере.">
