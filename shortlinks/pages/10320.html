<meta name="description" content="Задолго до того, как ИИ начал менять Википедию, участники проекта обсуждали, как сохранить контроль над машинами. Сначала казалось, что большие языковые модели возьмут на себя рутинную работу — форматирование, поиск источников и ссылок — и освободят людям время для творчества. Но к марту 2026 года использование таких моделей для написания статей запретили: ИИ-тексты слишком часто нарушали основные принципы Википедии. Тем временем энциклопедия теряла аудиторию: с 2022 года число её читателей сократилось почти на четверть, а переходы из ИИ-чатботов составляли лишь 0,33% против почти 9% из поиска Google. На этом фоне автор книги об истории Википедии Ричард Кук размышляет о том, что исчезает вместе с энциклопедическим способом видеть мир — и что в Википедии может пережить ИИ.">
