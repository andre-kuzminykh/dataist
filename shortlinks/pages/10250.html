<meta name="description" content="Команда ИИ-инфраструктуры Ai2 заменила планировщик GPU-кластеров по приоритетам системой бюджетов времени, иерархического распределения ресурсов и минимального времени выполнения задач. За 30-дневный период команды получили 98% положенных им GPU-часов, а загрузка кластеров осталась на уровне 98%. На крупнейшем кластере NVIDIA H100 медианное ожидание в очереди снизилось с 5 минут до 24 секунд; для коротких задач отладки 90-й перцентиль упал с 2 часов до 30 секунд. Новая схема также сократила на 74% число ремонтов, для которых требовалось участие дежурного инженера.">
