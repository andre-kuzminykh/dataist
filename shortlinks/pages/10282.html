<meta name="description" content="Заявления технологических компаний о том, что их ИИ-модели решают сложные математические задачи, встревожили криптосообщество: участники рынка опасаются, что новые способности ИИ позволят взламывать блокчейн-кошельки и похищать средства. Исследователь Ethereum Джастин Дрейк призвал индустрию спокойно готовиться к так называемому «режиму бункера» и переводить активы на новые адреса, открытые ключи которых скрыты за хешем. Создатель Ethereum Виталик Бутерин не советует срочно менять кошельки, но считает, что угрозу для криптографии со стороны ИИ стоит учитывать. При этом математики оспаривают заявления OpenAI о прорывах, а уже известные атаки с помощью ИИ использовали не математический взлом, а уязвимости старых прошивок.">
