<meta name="description" content="Глава Y Combinator Гарри Тан рассказал, что ежегодно тратит на токены для ИИ-агентов примерно $100–200 тысяч. Он использует их для рабочих проектов, программирования и повседневных дел, а также опубликовал на GitHub набор из 23 навыков для Claude Code под названием gstack, чтобы показать другим, на что способны агенты. Тан ранее в шутку говорил о «киберпсихозе» и признавался, что иногда почти не спит из-за увлечения работой с ИИ-агентами. О расходах он рассказал в новом выпуске подкаста Уолтера Айзексона The Builders, который должен выйти во вторник.">
