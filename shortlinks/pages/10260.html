<meta name="description" content="Исследователи из лаборатории Advanced Machine Intelligence (AMI) Яна ЛеКуна и академических организаций разработали H-JEPA — архитектуру модели мира, которая планирует на разных временных масштабах, используя отдельные представления среды. По сравнению с одноуровневыми моделями мира JEPA, H-JEPA точнее справляется с навигацией и требует меньше вычислений при планировании. Архитектура помогает системе одновременно выбирать дальнюю цель и управлять движениями робота: сначала определить маршрут на высоком уровне, затем постепенно превратить его в точные физические действия.">
