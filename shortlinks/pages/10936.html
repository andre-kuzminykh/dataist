<meta name="description" content="Crusoe продала Google незавершённый проект дата-центра на юго-востоке Вайоминга. Компания Google, которая прежде отказалась стать заказчиком площадки, теперь сама займётся её развитием: по сообщениям, её беспокоили стоимость проекта и сроки строительства под управлением Crusoe. Google не раскрыла сумму сделки, но объявила о планах вложить в кампус $17 млрд. Проект Crusoe анонсировала в прошлом году вместе с Tallgrass, инфраструктурной компанией при поддержке Blackstone; в перспективе мощность площадки должна была вырасти до 10 ГВт.">
