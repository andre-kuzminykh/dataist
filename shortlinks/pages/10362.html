<meta name="description" content="Индийская Scimplify привлекла $25 млн, чтобы расширить производство специальных химикатов и критически важных материалов и помочь компаниям снизить зависимость от поставщиков из Китая. В раунде, который возглавила Hitachi Ventures, также участвовали новые инвесторы Henkel и Teknor Apex, а также прежние инвесторы стартапа. Scimplify применяет собственную платформу с ИИ, чтобы ускорить переход от разработки химического состава к выпуску готового продукта: в отдельных случаях этот путь занимает два месяца вместо обычных 12–18. Среди перспективных рынков компания выделяет полупроводники, оборону и энергетику.">
