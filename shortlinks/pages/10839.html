<meta name="description" content="OpenAI назначила бывшего министра армии США Дэна Дрисколла советником по вопросам национальной безопасности. Компания рассчитывает укрепить связи с военными и Конгрессом и претендовать на новые государственные контракты. Дрисколл руководил внедрением ИИ в армии, а теперь будет помогать OpenAI работать с государственными структурами и понимать их практические потребности. Назначение продолжает курс компании на оборонные проекты: в феврале 2026 года OpenAI получила контракт Пентагона на использование своих моделей в секретных сетях после того, как ведомство отстранило конкурента Anthropic.">
