<meta name="description" content="Google DeepMind и World Resources Institute создали ForTy — карту земного покрова за 2020 год, которая различает шесть типов лесов и других территорий по всему миру с разрешением 10 метров. Система опирается на AlphaEarth Foundations и несколько этапов распознавания изображений: она учитывает не только внешний вид участков, но и циклы их роста и вырубки. Общая точность карты составила 90,2%, а на тех же тестовых данных ForTy превзошла карты Еврокомиссии. Однако система выявила лишь около половины лесных насаждений и древесных культур и 60% плантаций.">
