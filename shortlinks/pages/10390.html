<meta name="description" content="На закрытой встрече в Сан-Франциско Anthropic представила потенциальным инвесторам финансовые результаты за третий квартал. Выручка составила $16,8 млрд — примерно на 45% больше, чем во втором квартале, и более чем в 3,6 раза выше всей выручки компании за 2025 год. Однако темпы роста заметно снизились: во втором квартале спрос на Claude Code увеличил выручку более чем на 140% относительно первого. Летнее затишье могло сыграть свою роль: в эти месяцы люди обычно меньше работают и расходуют меньше токенов. В сентябре OpenAI выпустила сильного конкурента — Astra, а Anthropic смогла ответить Opus 5.5 лишь в конце месяца.">
