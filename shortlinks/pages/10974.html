<meta name="description" content="Palantir обсуждала с бывшим министром здравоохранения Великобритании Зубиром Ахмедом возможность подключить записи пациентов врачей общей практики к платформе компании для Национальной службы здравоохранения (NHS). Переписка в WhatsApp, полученная по закону о свободе информации, показывает, что компания называла такое объединение данных полезным и просила министра заранее подготовиться к политической критике. Данные GP изначально исключили из контракта Palantir на £330 млн: три года назад правительство консерваторов заявляло, что их не будет на национальной платформе.">
