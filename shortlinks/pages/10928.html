<meta name="description" content="Стартап Underdog представил Woof — открытую модель синтеза речи размером 31,7 МБ, которая может работать в браузере и, по словам компании, на большинстве устройств без подключения к интернету. Для знакомства с ней стартап выпустил игру: игрок печатает текст на машинке, а Woof произносит его; поворот музыкального тюнера меняет звучание музыки. Модель содержит 31 млн параметров. Underdog также ранее выпустила модель распознавания речи Bark размером 167 МБ и модель с 27 млрд параметров, работающую на ноутбуках.">
