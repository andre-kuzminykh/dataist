<meta name="description" content="Flox Intelligence создала устройства, которые распознают диких животных и отпугивают их звуком, подобранным под конкретный вид. Компания выросла из лаборатории ИИ Королевского технологического института KTH в 2020 году; сейчас около 150 устройств работают в Северной Америке, Европе и Австралии. Flox продаёт оборудование и программную подписку, а также сотрудничает с производителем поездов Alstom. Компания рассчитывает завершить 2026 год с выручкой около $1,5 млн и открывает раунд Series A на $10 млн, чтобы увеличить число установок до нескольких тысяч и расширить применение системы.">
