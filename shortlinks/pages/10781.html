<meta name="description" content="Робототехническая компания Neura из немецкого Метцингена обучает гуманоидных роботов выполнять задачи в специально оборудованных «роботажных залах». В центре компании под Мюнхеном, куда впервые допустили журналиста, одновременно тренируются до 100 роботов из разных стран: они переносят детали, складывают коробки и учатся обращаться со стеклянными предметами. Neura собирается открыть пять таких центров по всему миру к концу следующего года. Физических данных для обучения ИИ пока недостаточно, поэтому роботам приходится осваивать навыки непосредственно в реальной среде.">
