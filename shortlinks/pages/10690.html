<meta name="description" content="Google открывает Android Studio для более чем 40 сторонних агентов для программирования, включая Claude и Codex, и расширяет инструменты командной строки, чтобы сократить время разработки и расход токенов. Новые API на базе Gemini Nano 4 и протокола MCP позволят запускать функции ИИ-агентов прямо на смартфонах и подключать сервисы приложений к Google Поиску и приложению Gemini. Кроме того, Google и производитель устройств XREAL представили умные очки XREAL AURA за 1099 долларов: они работают на Android XR, показывают виртуальные рабочие пространства и используют Gemini для анализа окружения.">
