<meta name="description" content="Республиканцы со времён Рональда Рейгана обещают, что снижение налогов ускорит экономику и само окупится. На практике налоговые послабления раз за разом увеличивали дефицит бюджета. Теперь прежнее обещание вернулось в новой версии: министр финансов США Скотт Бессент рассчитывает на ежегодный рост экономики на 3% благодаря ИИ, а Дональд Трамп связывает с этим возможность со временем справиться с федеральным долгом в $40 трлн. Но доходность 10-летних казначейских облигаций уже поднялась до максимума почти за четверть века, а даже быстрый рост экономики не обязательно даст бюджету достаточно доходов.">
