<meta name="description" content="Голливуд спорит о применении ИИ в кино, а актёр и режиссёр Марк Уолберг считает, что технологии найдётся место, если использовать их правильно. На конференции TechCrunch Disrupt он рассказал, что рассматривает ИИ для отдельных элементов биографического фильма о Пите Роузе, где сыграет главную роль, и не исключает создания цифровой копии, которая продолжит его наследие. Уолберг также готов передать детям или внукам контроль над своим образом и не возражает, если его цифровое воплощение появится в будущих фильмах или продолжит сериал «Тед».">
