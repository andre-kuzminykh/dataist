<meta name="description" content="Команда PyTorch в Hugging Face развивает бэкенд MPS, чтобы на Mac можно было запускать и обучать модели PyTorch. В начале 2026 года даже небольшие модели часто упирались в неподдерживаемые операции, резкие просадки производительности и неожиданный рост расхода памяти. Команда проверяет реальные модели из Hugging Face Hub — языковые, графические и видео — и исправляет слабые места в PyTorch, всё чаще заменяя MPSGraph отдельными ядрами Metal. В PyTorch 2.15 на Mac появились тензоры FP8, ускорились языковые модели и операции линейной алгебры, а декодирование видео Wan2.2 стало занимать около 8 ГиБ памяти вместо 270 ГиБ.">
