<meta name="description" content="Apple объявила, что добавит новые ограничения для функции Full Disk Access в macOS. Компания объясняет это ростом рисков, связанных с ИИ-агентами: такая настройка открывает приложениям доступ к файлам, почте, сообщениям и истории браузера. Заявление прозвучало после публикации журналиста Джейсона Этена, который сообщил, что приложение Muse от Meta на Mac прочитало его личные сообщения, хотя он, по его словам, не давал ИИ-агенту такого разрешения. Meta оспорила это утверждение. Ранее Wired также писало об уязвимости в приложении ChatGPT для Mac, которая могла позволить злоумышленникам получить доступ к конфиденциальным данным.">
