<meta name="description" content="По сентябрьскому опросу VentureBeat Intelligence, среди компаний, использующих платформу для управления ИИ-агентами, 43% выбрали OpenAI, 22% — Anthropic и 21% — Google. Однако в других показателях Anthropic может опережать OpenAI: например, данные Ramp показывают, что за подписки или токены Anthropic платят больше компаний, чем за OpenAI. Эти цифры описывают разные группы бизнеса и разные способы использования продуктов. Опрос VentureBeat также показал, что 62% компаний за последний год меняли модель в работающем приложении; среди них 59% пришлось дорабатывать приложение или возвращаться к прежней модели.">
