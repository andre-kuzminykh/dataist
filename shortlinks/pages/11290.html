<meta name="description" content="Notable Capital, суверенный фонд Сингапура GIC и управляющая компания Baillie Gifford вложили миллиарды долларов в Anthropic ещё до её выхода на биржу. В среду компания привлекла $81,3 млрд в крупнейшем IPO в истории и достигла полностью разводнённой оценки примерно в $1,5 трлн. К началу торгов на следующий день ранние инвесторы получили бумажную доходность, в отдельных случаях — около 15-кратной. Их решения опирались на интерес разработчиков к Claude, рост корпоративного применения моделей и исполнение Anthropic своих планов.">
