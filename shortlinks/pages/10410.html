<meta name="description" content="По мере ускорения моделей и роста нагрузки токенизатор может стать узким местом: при обучении на больших наборах данных, обслуживании множества запросов или обработке длинных входов он не успевает передавать данные модели. В релиз-кандидате tokenizers v1 разработчики ускорили кодирование текста — на Apple M4 Max оно работает в 3–30 раз быстрее, чем в v0.23, при этом выдаёт те же идентификаторы токенов. Библиотека также масштабируется до восьми потоков с эффективностью 76% от линейной. Авторы описали изменения, сравнили производительность с другими токенизаторами и выложили команды для повторного запуска тестов.">
