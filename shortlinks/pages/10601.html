<meta name="description" content="Менеджер паролей 1Password запустил 1Password for Agents — сервис, который позволяет ИИ-агентам входить в личные аккаунты и выполнять поручения, не раскрывая им учётные данные. При попытке входа агент отправляет 1Password уникальный цифровой ключ для подтверждения личности, а пользователь получает уведомление и лично одобряет запрос. После этого сервис сам вводит данные для входа. Запуск совпал с сообщением Axios о том, что американские банки начали замечать действия ИИ-агентов в аккаунтах клиентов. Банки не всегда могут определить, связаны ли такие действия с запросами самих пользователей.">
