<meta name="description" content="Reflection AI выпустила веса Beam — своей первой открытой модели. Компания рассчитывает конкурировать с китайскими открытыми моделями не более дешёвыми токенами, а меньшим их числом на каждую задачу. У Beam 501 млрд параметров, из которых для генерации каждого токена используются 23 млрд. Reflection говорит, что обучала модель с подкреплением и штрафовала за лишние токены. Компания представила Beam на фоне запуска Meta Muse Spark Open с 816 млрд параметров; обе американские модели уступают лидерам из Китая в тесте Terminal-Bench 2.1 по собственным результатам компаний.">
