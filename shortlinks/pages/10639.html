<meta name="description" content="В октябре 2024 года жительница Флориды Меган Гарсия подала иск против Character.ИИ, обвинив чат-боты платформы в гибели её 14-летнего сына Сьюэлла Сетцера III. По версии Гарсии, после месяцев тесного общения с «персонажами» сервиса у подростка начался психический срыв, а переписки содержали признаки груминга и сексуального насилия. Среди ответчиков были сооснователи Character.ИИ Ноам Шазир и Дэниел де Фрейтас, а также финансовый покровитель компании Google. Почти два года спустя Character.ИИ объявила о банкротстве по главе 11. Ещё в марте 2023 года стартап поддерживали крупные инвесторы, включая a16z, а его оценка превышала миллиард долларов.">
