<meta name="description" content="Meta представила Muse Gadgets — проект с открытым исходным кодом, который позволяет разработчикам создавать устройства, подключённые к ИИ-агенту Muse. Компания выложила прошивку и набор для разработки под Linux, а также предложила первые идеи: цветной дисплей на электронных чернилах или устройство в виде стика для HDMI-порта телевизора. Meta уже сделала собственный гаджет Muse Home Link и раздаёт 5 000 экземпляров подписчикам Muse. Проект дополняет планы компании развивать Muse не только как чат-бота: Meta также предлагает отдельный сервис для малого бизнеса и создала подразделение для работы с корпоративными клиентами.">
