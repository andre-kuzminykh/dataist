<meta name="description" content="Исследователи MIT, ETH Zurich и Imperial College London разработали способ обучать ИИ-модели климата быстрее и на меньшем объёме данных. Вместо множества реалистичных сценариев алгоритм использует синтетические данные с резкими изменениями — например, внезапный скачок выбросов CO₂ в 2050 году или снижение уровня метана в 2037-м. По словам команды, для обучения теперь достаточно одного запуска климатической симуляции. Модели также надёжнее оценивают незнакомые условия и последствия местной экологической политики.">
