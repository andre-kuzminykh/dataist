<meta name="description" content="Исследователи представили StudentSim — систему, которая создаёт персональные симуляторы учеников и помогает проверять ИИ-тьюторов до испытаний с реальными учащимися. Симуляторы обучаются на открытых обезличенных учебных данных и воспроизводят ответы конкретного ученика, в том числе после подсказок учителя. В исследовании StudentSim превзошла ведущие базовые модели в шахматах, письме на английском как втором языке и математике. Авторы также проверили, можно ли использовать её ответы для обучения тьютора: в шахматном эксперименте такой тьютор получил оценку точности 90,5% — выше, чем варианты без обучения с подкреплением и с GPT-5.4 в роли симулируемого ученика.">
