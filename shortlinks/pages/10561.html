<meta name="description" content="Команда по кадрам, спрашивая ИИ-ассистента об отпуске сотрудника, должна получить не просто убедительное объяснение, а правильное правило для нужной страны — и достаточно быстро, чтобы принять решение до ошибки в расчёте зарплаты. Разработчик кадрового ПО и систем расчёта зарплат Deel делает ставку на более компактные ИИ-модели, обученные под такие задачи. Компания представила две модели под названием Pangaea и Emet — бизнес по подготовке экспертных обучающих материалов и оценке ИИ. На тесте Deel модель знаний K1 набрала 70 баллов при лучшем результате 75 и отвечала в среднем за 7,7 секунды. Четыре модели с более высокими оценками тратили от 14,8 до 28,4 секунды. Deel рассчитывает улучшить собственного ассистента и продавать другим разработчикам экспертизу, на которой он основан.">
