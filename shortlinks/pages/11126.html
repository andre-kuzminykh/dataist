<meta name="description" content="Moonshot AI направляет языковые модели Kimi на исследования в биологии, химии и фармацевтике: компания считает, что в программировании возможности для дальнейшего прогресса сокращаются. На Web Summit в Лиссабоне международный директор Moonshot AI Джакомо Фикари заявил, что науке нужны более умные модели, чем юриспруденции, финансам или программированию. Тем временем пекинская DP Technology внедряет Kimi K3.1 Pro в исследовательского помощника BioMaster. В одном тесте модель проанализировала данные о генах 3696 клеток поджелудочной железы мышей и за 90 минут выделила 100 генов-кандидатов — работа, на которую у человека, по оценке, ушло бы четыре часа.">
