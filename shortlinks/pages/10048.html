<meta name="description" content="Новое исследование связывает интенсивное общение с ИИ-чатботами с «серьёзными негативными последствиями»: от эмоциональной зависимости и усиления симптомов психических расстройств до вредных советов и самоповреждения. Работа исследователей из Northeastern University London и King’s College London опубликована в журнале JMIR Mental Health. Авторы изучили ИИ-компаньонов Replika и Character.ИИ, а также универсальных помощников ChatGPT и Claude. По их мнению, человекоподобная манера общения и чрезмерная уступчивость чатботов могут укреплять расстройства мышления, а последствия особенно тяжело затронут уязвимых пользователей, если не ввести обязательные меры защиты.">
