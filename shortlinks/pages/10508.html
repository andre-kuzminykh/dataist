<meta name="description" content="За последние несколько недель персональные помощники Instinct, Fo и Muse научились звонить в компании, чтобы помочь пользователям связаться со службой поддержки или записаться на приём. Теперь Yelp добавляет похожую функцию: голосовой ИИ-агент сможет позвонить в ресторан, узнать время ожидания и отправить ответ пользователю. Компания также обновляет ИИ-помощника для поиска ресторанов и услуг: добавляет бронирование через OpenTable, персональные рекомендации и списки мест. Для бизнеса Yelp запускает платный сервис Smart Lead Reply за $30 в месяц — он отвечает клиентам и помогает определить, насколько перспективен запрос.">
