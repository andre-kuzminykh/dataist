<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Датаист — подписки</title>
<meta name="description" content="Все каналы Датаиста в одном месте: исследования, курсы, кейсы и новости об ИИ простым языком.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://dataist.ai/links/">

<meta property="og:site_name" content="Датаист">
<meta property="og:type" content="website">
<meta property="og:url" content="https://dataist.ai/links/">
<meta property="og:title" content="Датаист — подписки">
<meta property="og:description" content="Исследования, курсы, кейсы и новости об ИИ — простым языком. Выберите, на что подписаться.">
<meta property="og:image" content="https://dataist.ai/pics/dataist-ai-preview.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/png" href="https://dataist.ai/favicon.png">
<link rel="apple-touch-icon" href="https://dataist.ai/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --panel:rgba(20,20,22,.62);
  --line:rgba(255,255,255,.08);
  --line-2:rgba(255,255,255,.14);
  --text:#f5f5f7;
  --muted:#8e8e93;
  --dim:#5c5c61;
  --ok:#30d158;
  --err:#ff6961;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent}
::selection{background:#fff;color:#000}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:999px}

/* ───────── Фон ───────── */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:56px 56px;background-position:center top;
  -webkit-mask-image:radial-gradient(ellipse 60% 48% at 50% 18%,#000 10%,transparent 72%);
          mask-image:radial-gradient(ellipse 60% 48% at 50% 18%,#000 10%,transparent 72%)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
.orb-1{width:640px;height:640px;left:50%;top:-320px;margin-left:-320px;
  background:radial-gradient(circle,rgba(255,255,255,.20),transparent 62%);animation:o1 16s ease-in-out infinite}
.orb-2{width:520px;height:520px;left:-160px;top:38%;
  background:radial-gradient(circle,rgba(94,92,230,.22),transparent 64%);animation:o2 22s ease-in-out infinite}
.orb-3{width:560px;height:560px;right:-200px;top:62%;
  background:radial-gradient(circle,rgba(10,132,255,.16),transparent 64%);animation:o3 26s ease-in-out infinite}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes o1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(0,40px,0) scale(1.08)}}
@keyframes o2{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(120px,-60px,0)}}
@keyframes o3{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-110px,-80px,0)}}

/* ───────── Хедер ───────── */
.top{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:rgba(0,0,0,.55);border-bottom:1px solid var(--line);
  -webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px)}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:26px;height:26px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;
  font:700 12px/1 var(--mono);transition:transform .4s var(--ease)}
.brand:hover .brand-mark{transform:scale(1.1) rotate(-10deg)}
.brand-name{font-weight:600;font-size:18px;letter-spacing:-.02em;line-height:1;margin-top:2px}
.lang{display:flex;align-items:center;gap:8px;font:700 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;user-select:none}
.lang button{padding:10px 2px;color:var(--muted);transition:color .2s}
.lang button:hover{color:#fff}
.lang button[aria-pressed="true"]{color:#fff;cursor:default}
.lang .sep{color:var(--muted);opacity:.4}
@media (min-width:768px){
  .top{height:80px;padding:0 32px}
  .brand-mark{width:32px;height:32px;font-size:14px}
  .brand-name{font-size:20px}
  .lang{font-size:13px}
}

/* ───────── Сцена ───────── */
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:52px 16px 24px;transition:opacity .22s ease,transform .22s ease}
main.swap{opacity:0;transform:translateY(6px)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center}

.avatar{position:relative;width:112px;height:112px;margin-bottom:22px}
.avatar-glow{position:absolute;inset:-46px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.16),transparent 62%);animation:breathe 5s ease-in-out infinite}
.avatar-ring{position:absolute;inset:-3px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,255,255,.95),rgba(255,255,255,.04) 28%,rgba(255,255,255,0) 50%,rgba(255,255,255,.04) 72%,rgba(255,255,255,.95));
  animation:spin 7s linear infinite}
.avatar img,.avatar .mono{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #000;background:#111}
.avatar .mono{display:none;place-items:center;font:700 34px var(--mono)}
.avatar.noimg img{display:none}.avatar.noimg .mono{display:grid}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.7;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}

.handle{display:inline-flex;align-items:center;gap:9px;padding:8px 13px;border-radius:999px;
  border:1px solid var(--line-2);background:rgba(255,255,255,.03);
  font:700 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.handle:hover{color:#fff}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(48,209,88,.55)}70%{box-shadow:0 0 0 7px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}

h1{margin-top:22px;font-size:clamp(40px,9vw,68px);font-weight:700;letter-spacing:-.05em;line-height:.98;
  background:linear-gradient(180deg,#fff 35%,#8a8a90 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  padding-bottom:.06em}
.lead{margin-top:18px;max-width:470px;font-size:clamp(15px,2.3vw,17px);line-height:1.55;color:var(--muted)}

/* соцсети */
.socials{display:flex;gap:12px;margin-top:30px}
.soc{position:relative;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.04);border:1px solid var(--line-2);color:#fff;
  transition:transform .35s var(--ease),background .25s,color .25s,border-color .25s,box-shadow .35s}
.soc svg{width:21px;height:21px}
.soc:hover{transform:translateY(-4px);background:#fff;color:#000;border-color:#fff;box-shadow:0 14px 34px -10px rgba(255,255,255,.45)}
.soc::after{content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 10px);transform:translate(-50%,-4px);
  padding:6px 9px;border-radius:8px;background:#1c1c1e;border:1px solid var(--line-2);white-space:nowrap;
  font:700 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.soc:hover::after,.soc:focus-visible::after{opacity:1;transform:translate(-50%,0)}
.soc.soon{cursor:default}

/* ───────── Подписка ───────── */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 40px 80px -40px rgba(0,0,0,.9)}
.sub{margin-top:52px;padding:22px;border-radius:28px;overflow:hidden}
.sub::before{content:"";position:absolute;top:0;left:-40%;width:40%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:beam 6s var(--ease) infinite}
@keyframes beam{0%{left:-40%}60%,100%{left:110%}}
.sub-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.sub-title{font-size:20px;font-weight:650;letter-spacing:-.025em}
.eyebrow{font:700 10px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.sub-desc{font-size:14px;line-height:1.5;color:var(--muted);margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 9px;border-radius:999px;
  border:1px solid var(--line-2);font-size:13.5px;font-weight:500;color:var(--muted);background:transparent;
  transition:background .25s,color .25s,border-color .25s,transform .2s}
.chip:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.chip:active{transform:scale(.96)}
.chip .ck{width:17px;height:17px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;transition:all .25s}
.chip .ck svg{width:10px;height:10px;opacity:0;transform:scale(.4);transition:all .25s var(--ease)}
.chip[aria-pressed="true"]{background:#fff;color:#000;border-color:#fff}
.chip[aria-pressed="true"] .ck{background:#000;border-color:#000;color:#fff}
.chip[aria-pressed="true"] .ck svg{opacity:1;transform:scale(1)}

.field{display:flex;align-items:center;gap:8px;padding:6px;border-radius:999px;background:rgba(0,0,0,.55);
  border:1px solid var(--line-2);transition:border-color .25s,box-shadow .25s}
.field:focus-within{border-color:rgba(255,255,255,.42);box-shadow:0 0 0 5px rgba(255,255,255,.06)}
.field-in{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding-left:14px;color:var(--dim)}
.field-in svg{width:18px;height:18px;flex-shrink:0}
.field input{flex:1;min-width:0;height:46px;background:transparent;border:0;outline:0;color:#fff;font:500 16px var(--sans)}
.field input::placeholder{color:var(--dim)}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;
  border-radius:999px;background:#fff;color:#000;font-weight:600;font-size:15px;white-space:nowrap;
  transition:transform .25s var(--ease),opacity .2s}
.btn svg{width:17px;height:17px;transition:transform .3s var(--ease)}
.btn:hover{transform:scale(1.03)}.btn:hover svg{transform:translate(2px,-2px)}
.btn:active{transform:scale(.97)}
.btn .spin{display:none;width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.2);border-top-color:#000;animation:spin .8s linear infinite}
.sub.busy .btn .spin{display:block}.sub.busy .btn span,.sub.busy .btn svg{display:none}
.note{margin-top:12px;font-size:12.5px;line-height:1.45;color:var(--dim);text-align:center;min-height:1.45em;transition:color .2s}
.note.err{color:var(--err)}.note.info{color:var(--text)}
.shake{animation:shake .45s var(--ease)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

.done{display:none;align-items:center;justify-content:center;gap:12px;height:62px;border-radius:999px;
  background:rgba(48,209,88,.08);border:1px solid rgba(48,209,88,.35);font-weight:600;font-size:15px}
.done svg{width:26px;height:26px;color:var(--ok)}
.done circle,.done path{stroke-dasharray:80;stroke-dashoffset:80}
.sub.ok .field,.sub.ok .chips{display:none}
.sub.ok .done{display:flex}
.sub.ok .done circle{animation:draw .6s var(--ease) forwards}
.sub.ok .done path{animation:draw .45s .35s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

@media (max-width:480px){
  .field{flex-direction:column;align-items:stretch;border-radius:22px}
  .btn{width:100%}
  .done{border-radius:22px}
}

/* ───────── Каналы ───────── */
.sec{margin-top:56px}
.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.sec-head .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent)}
.sec-count{font:700 10px/1 var(--mono);letter-spacing:.2em;color:var(--dim)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:680px){.grid{grid-template-columns:1fr 1fr}}

.card{position:relative;display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:24px;overflow:hidden;isolation:isolate;
  transition:transform .45s var(--ease),border-color .35s}
.card::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .35s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.10),transparent 45%)}
.card:hover{transform:translateY(-4px);border-color:var(--line-2)}
.card:hover::before{opacity:1}
.card-top{display:flex;align-items:center;gap:13px}
.ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex-shrink:0;
  background:rgba(255,255,255,.06);border:1px solid var(--line);transition:background .35s,color .35s,border-color .35s}
.ic svg{width:20px;height:20px}
.card:hover .ic{background:#fff;color:#000;border-color:#fff}
.card-net{font:700 9.5px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.card-name{font-size:20px;font-weight:650;letter-spacing:-.025em;line-height:1.05}
.idx{margin-left:auto;align-self:flex-start;font:700 10.5px/1 var(--mono);letter-spacing:.1em;color:var(--dim)}
.tag{display:inline-flex;width:fit-content;padding:6px 10px;border-radius:999px;border:1px solid var(--line-2);
  background:rgba(255,255,255,.03);font:700 9.5px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text)}
.desc{font-size:14.5px;line-height:1.55;color:var(--muted)}
.card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;border-top:1px solid var(--line)}
.card-handle{font:400 12px/1 var(--mono);color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .3s}
.card:hover .card-handle{color:var(--text)}
.go{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;border:1px solid var(--line-2);
  transition:background .3s,color .3s,border-color .3s,transform .45s var(--ease)}
.go svg{width:15px;height:15px}
.card:hover .go{background:#fff;color:#000;border-color:#fff;transform:rotate(45deg)}

/* ───────── Футер ───────── */
footer{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:40px 16px calc(36px + env(safe-area-inset-bottom));
  display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;
  font:700 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
footer a{display:inline-flex;align-items:center;gap:6px;transition:color .2s}
footer a:hover{color:#fff}
footer svg{width:12px;height:12px}

/* ───────── Появление ───────── */
.rv{opacity:0;translate:0 16px;animation:rv .9s var(--ease) forwards;animation-delay:calc(var(--i,0) * 70ms + 60ms)}
@keyframes rv{to{opacity:1;translate:0 0}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .rv{opacity:1;translate:0 0}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="bg-grid"></div>
  <div class="grain"></div>
</div>

<header class="top">
  <a href="https://dataist.ai/" class="brand" aria-label="dataist.ai">
    <span class="brand-mark">i</span>
    <span class="brand-name" data-t="brand">ДАТАИСТ</span>
  </a>
  <nav class="lang" aria-label="Language">
    <button type="button" data-lang="ru" aria-pressed="true" lang="ru">RU</button>
    <span class="sep" aria-hidden="true">|</span>
    <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
  </nav>
</header>

<main id="main">
  <section class="hero">
    <div class="avatar rv" style="--i:0">
      <span class="avatar-glow"></span>
      <span class="avatar-ring"></span>
      <img src="https://dataist.ai/andre.jpeg" alt="@andre_dataist" width="112" height="112"
           onerror="if(!this.dataset.f){this.dataset.f=1;this.src='/andre.jpeg'}else{this.parentNode.classList.add('noimg')}">
      <span class="mono" aria-hidden="true">A</span>
    </div>

    <a class="handle rv" style="--i:1" id="handle" href="https://t.me/andre_dataist" target="_blank" rel="noopener">
      <span class="dot"></span><span>@andre_dataist</span>
    </a>

    <h1 class="rv" style="--i:2" data-t="h1">ИИ без шума.</h1>
    <p class="lead rv" style="--i:3" data-t="lead"></p>

    <div class="socials rv" style="--i:4" id="socials"></div>
  </section>

  <form class="sub panel rv" style="--i:5" id="sub" novalidate>
    <div class="sub-top">
      <h2 class="sub-title" data-t="subTitle"></h2>
      <span class="eyebrow" data-t="subEyebrow"></span>
    </div>
    <p class="sub-desc" data-t="subDesc"></p>

    <div class="chips" id="chips" role="group"></div>

    <div class="field" id="field">
      <label class="field-in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
        <input type="email" name="email" id="email" required autocomplete="email" inputmode="email" spellcheck="false">
      </label>
      <button type="submit" class="btn">
        <span data-t="button"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
        <i class="spin" aria-hidden="true"></i>
      </button>
    </div>
    <input class="hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="done" role="status">
      <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="13" r="11.5"/><path d="m8 13.5 3.3 3.2L18 9.8"/></svg>
      <span data-t="ok"></span>
    </div>

    <p class="note" id="note" aria-live="polite"></p>
  </form>

  <section class="sec" id="channels">
    <div class="sec-head rv" style="--i:6">
      <span class="eyebrow" data-t="secLabel"></span>
      <span class="line"></span>
      <span class="sec-count" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer>
  <span data-t="copy"></span>
  <a href="https://dataist.ai/"><span>dataist.ai</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg></a>
</footer>

<script>
(function () {
  /* ═════════════ НАСТРОЙКИ ═════════════
     Впишите ссылки на свои аккаунты. Пустая строка — иконка покажет «скоро». */
  var LINKS = {
    ru: { youtube: '', instagram: '', tiktok: '' },
    en: { youtube: '', instagram: '', tiktok: '' }
  };

  /* Куда отправлять email: Formspree, Buttondown, Unisender, свой API — любой
     адрес, принимающий POST с полями email, topics, lang.
     Пока пусто — форма честно скажет, что рассылка скоро откроется. */
  var SUBSCRIBE_ENDPOINT = '';
  /* ═════════════════════════════════════ */

  var I = {
    telegram: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.94 4.3 18.8 19.1c-.24 1.05-.86 1.31-1.73.82l-4.78-3.53-2.31 2.22c-.25.25-.47.47-.96.47l.34-4.86 8.85-8c.39-.34-.08-.53-.6-.19L6.68 12.92 1.97 11.45c-1.02-.32-1.04-1.02.22-1.51L20.6 2.84c.85-.32 1.6.19 1.34 1.46Z"/></svg>',

    youtube:  '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.38.5A3.02 3.02 0 0 0 .5 6.19C0 8.07 0 12 0 12s0 3.93.5 5.81a3.02 3.02 0 0 0 2.12 2.14c1.88.5 9.38.5 9.38.5s7.5 0 9.38-.5a3.02 3.02 0 0 0 2.12-2.14C24 15.93 24 12 24 12s0-3.93-.5-5.81ZM9.55 15.57V8.43L15.82 12l-6.27 3.57Z"/></svg>',
    instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r=".6" fill="currentColor"/></svg>',
    tiktok:   '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.53.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07Z"/></svg>',
    arrow:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>',
    check:    '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2.5 6.3 2.3 2.2L9.5 3.8"/></svg>'
  };

  var SOCIALS = [
    { id: 'youtube',   name: 'YouTube' },
    { id: 'instagram', name: 'Instagram' },
    { id: 'tiktok',    name: 'TikTok' }
  ];

  var T = {
    ru: {
      title: 'Датаист — подписки',
      brand: 'ДАТАИСТ',
      h1: 'ИИ без шума.',
      lead: 'Разбираю свежие исследования, учу строить ИИ-агентов и делюсь кейсами и новостями — простым языком. Выберите, на что подписаться.',
      soon: 'скоро',
      subTitle: 'Письма от Датаиста',
      subEyebrow: 'Email',
      subDesc: 'Главное за неделю — прямо в почту. Отметьте, что вам интересно:',
      placeholder: 'Ваш email',
      button: 'Подписаться',
      note: 'Без спама. Отписаться — в один клик.',
      ok: 'Готово! Вы подписаны.',
      bad: 'Похоже, в адресе опечатка — проверьте email.',
      pick: 'Отметьте хотя бы одну тему.',
      fail: 'Не получилось отправить — попробуйте ещё раз.',
      notYet: 'Рассылка вот-вот откроется — а пока подпишитесь на Telegram ниже ↓',
      topics: [
        { id: 'research', label: 'Исследования' },
        { id: 'courses',  label: 'Курсы' },
        { id: 'cases',    label: 'Технологии и кейсы' },
        { id: 'news',     label: 'Новости' }
      ],
      secLabel: 'Telegram-каналы',
      copy: '© 2026 Датаист',
      handle: 'https://t.me/andre_dataist',
      channels: [
        { net: 'telegram', label: 'Telegram', name: 'Лаборатория', tag: 'Исследования',
          desc: 'Каждый день — разбор свежей научной статьи об ИИ, агентах и LLM. Без формул, простым языком.',
          url: 'https://t.me/+gjvJGFW0iXUwMjky', handle: 'Открыть в Telegram' },
        { net: 'telegram', label: 'Telegram', name: 'Академия', tag: 'Курсы',
          desc: 'Пошаговые курсы по ИИ: от AI-First-компании до собственных агентов, которые работают в бизнесе.',
          url: 'https://t.me/dataist_academy', handle: '@dataist_academy' },
        { net: 'telegram', label: 'Telegram', name: 'Основной', tag: 'Технологии · Кейсы · Мысли',
          desc: 'Технологии, реальные кейсы внедрения и авторские мысли о том, куда движется ИИ.',
          url: 'https://t.me/+AXsoJ7OiMG4zMzFi', handle: 'Открыть в Telegram' },
        { net: 'telegram', label: 'Telegram', name: 'Live', tag: 'Новости',
          desc: 'Главные новости ИИ в течение дня — коротко, по делу и сразу, как только они выходят.',
          url: 'https://t.me/neuronium_ai', handle: '@neuronium_ai' }
      ]
    },
    en: {
      title: 'Dataist — follow',
      brand: 'DATAIST',
      h1: 'AI, minus the noise.',
      lead: 'I break down fresh AI research, real-world cases and the news that matters — in plain language. Choose what to follow.',
      soon: 'soon',
      subTitle: 'Dataist letters',
      subEyebrow: 'Email',
      subDesc: 'The week’s essentials, straight to your inbox. Pick what you’re into:',
      placeholder: 'Your email',
      button: 'Subscribe',
      note: 'No spam. Unsubscribe in one click.',
      ok: 'Done — you’re subscribed.',
      bad: 'Looks like a typo — please check your email.',
      pick: 'Pick at least one topic.',
      fail: 'Couldn’t send that — please try again.',
      notYet: 'Email is launching any day now — follow on X below in the meantime ↓',
      topics: [
        { id: 'research', label: 'Research' },
        { id: 'cases',    label: 'Tech & cases' },
        { id: 'news',     label: 'News' }
      ],
      secLabel: 'On X',
      copy: '© 2026 Dataist',
      handle: 'https://x.com/andre_dataist',
      channels: [
        { net: 'x', label: 'X', name: 'Main', tag: 'Research · Tech · Cases',
          desc: 'Daily breakdowns of new AI papers, plus tech deep-dives, real-world cases and thoughts on where AI is heading.',
          url: 'https://x.com/andre_dataist', handle: '@andre_dataist' },
        { net: 'x', label: 'X', name: 'Live', tag: 'News',
          desc: 'The AI news that matters, through the day — short, to the point and the moment it breaks.',
          url: 'https://x.com/neuronium_ai', handle: '@neuronium_ai' }
      ]
    }
  };

  var $ = function (s) { return document.querySelector(s); };
  var main = $('#main'), form = $('#sub'), email = $('#email'), note = $('#note');
  var lang = detect(), selected = {};

  function detect() {
    try {
      var q = new URLSearchParams(location.search).get('lang');
      if (q === 'ru' || q === 'en') return q;
      var s = localStorage.getItem('dataist_lang');
      if (s === 'ru' || s === 'en') return s;
    } catch (e) {}
    var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'ru';
    return /^(ru|uk|be|kk)/i.test(nav) ? 'ru' : 'en';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function render() {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title;

    document.querySelectorAll('[data-t]').forEach(function (el) {
      var k = el.getAttribute('data-t');
      if (t[k] != null) el.textContent = t[k];
    });
    email.placeholder = t.placeholder;
    $('#handle').href = t.handle;
    document.querySelectorAll('.lang button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false');
    });

    // соцсети
    $('#socials').innerHTML = SOCIALS.map(function (s) {
      var url = LINKS[lang][s.id];
      return url
        ? '<a class="soc" href="' + esc(url) + '" target="_blank" rel="noopener" aria-label="' + s.name + '" data-tip="' + s.name + '">' + I[s.id] + '</a>'
        : '<span class="soc soon" role="img" tabindex="0" aria-label="' + s.name + ' — ' + t.soon + '" data-tip="' + s.name + ' · ' + t.soon + '">' + I[s.id] + '</span>';
    }).join('');

    // темы рассылки
    if (!selected[lang]) {
      selected[lang] = {};
      t.topics.forEach(function (x) { selected[lang][x.id] = true; });
    }
    $('#chips').innerHTML = t.topics.map(function (x) {
      return '<button type="button" class="chip" data-id="' + x.id + '" aria-pressed="' + !!selected[lang][x.id] + '">' +
             '<span class="ck">' + I.check + '</span>' + esc(x.label) + '</button>';
    }).join('');

    // каналы
    $('#count').textContent = pad(t.channels.length);
    $('#grid').innerHTML = t.channels.map(function (c, i) {
      return '<a class="card panel rv" style="--i:' + (7 + i) + '" href="' + esc(c.url) + '" target="_blank" rel="noopener">' +
        '<div class="card-top"><span class="ic">' + I[c.net] + '</span>' +
          '<div><div class="card-net">' + esc(c.label) + '</div><div class="card-name">' + esc(c.name) + '</div></div>' +
          '<span class="idx">' + pad(i + 1) + '</span></div>' +
        '<span class="tag">' + esc(c.tag) + '</span>' +
        '<p class="desc">' + esc(c.desc) + '</p>' +
        '<div class="card-foot"><span class="card-handle">' + esc(c.handle) + '</span><span class="go">' + I.arrow + '</span></div>' +
      '</a>';
    }).join('');

    if (!form.classList.contains('ok')) setNote(t.note);
  }

  function setNote(text, kind) {
    note.textContent = text;
    note.className = 'note' + (kind ? ' ' + kind : '');
  }

  function switchLang(next) {
    if (next === lang) return;
    lang = next;
    try { localStorage.setItem('dataist_lang', lang); } catch (e) {}
    try { var u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null, '', u); } catch (e) {}
    main.classList.add('swap');
    setTimeout(function () { render(); main.classList.remove('swap'); }, 200);
  }

  document.querySelector('.lang').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lang]');
    if (b) switchLang(b.dataset.lang);
  });

  $('#chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    var on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    selected[lang][b.dataset.id] = on;
  });

  // подсветка карточки за курсором
  $('#grid').addEventListener('pointermove', function (e) {
    var c = e.target.closest('.card');
    if (!c) return;
    var r = c.getBoundingClientRect();
    c.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    c.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });

  function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var t = T[lang];
    var value = email.value.trim();
    var topics = Object.keys(selected[lang]).filter(function (k) { return selected[lang][k]; });

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)) { setNote(t.bad, 'err'); shake($('#field')); email.focus(); return; }
    if (!topics.length) { setNote(t.pick, 'err'); shake($('#chips')); return; }
    if (form.company.value) return; // бот

    if (!SUBSCRIBE_ENDPOINT) {
      setNote(t.notYet, 'info');
      setTimeout(function () { $('#channels').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 650);
      return;
    }

    var fd = new FormData();
    fd.append('email', value);
    fd.append('topics', topics.join(','));
    fd.append('lang', lang);
    fd.append('source', 'dataist.ai/links');

    form.classList.add('busy');
    fetch(SUBSCRIBE_ENDPOINT, { method: 'POST', body: fd, headers: { Accept: 'application/json' } })
      .then(function (r) { if (!r.ok) throw new Error(r.status); })
      .then(function () { form.classList.add('ok'); setNote(''); })
      .catch(function () { setNote(t.fail, 'err'); shake($('#field')); })
      .then(function () { form.classList.remove('busy'); });
  });

  render();
})();
</script>
