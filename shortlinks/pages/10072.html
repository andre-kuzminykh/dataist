<meta name="description" content="LEGO-Anything — проект исследователей из Университета Мэриленда и AWS — превращает одну фотографию в редактируемую 3D-сцену для Blender. ИИ-агент пишет код, проверяет результат и дорабатывает его шаг за шагом. В бенчмарке LEGO-Bench все шесть конфигураций GPT почти всегда выдавали рабочую сцену, но точность лучшей модели, GPT-6 Astra, составила 53,4% для помещений и 39,6% для улиц. Исследователи также обнаружили, что модели плохо оценивают собственные результаты. Плагин LEGO-Plugin повысил показатели всех шести моделей, но точность реконструкции пока остаётся ограниченной.">
