<meta name="description" content="Исследователи из Калифорнийского университета в Санта-Барбаре и Microsoft разработали ScholarEvolve — фреймворк, который находит подходящие методы в научных статьях и превращает их в обновления кода для ИИ-агентов. В тесте AppWorld Normal он поднял результат открытой модели Qwen3.5-27B с 69,0% до 81,4%, сократив примерно на 74% разрыв с GPT-5.4. При этом веса модели не меняли. Подход позволяет улучшать обвязку агента без переобучения и обновлять её для работы с незнакомыми API.">
