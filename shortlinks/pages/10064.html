<meta name="description" content="Suno, известная генератором музыки на основе ИИ, запустила функцию Speech: она создаёт произнесённый текст и подходящую к нему фоновую музыку в одной аудиозаписи. Пользователь вводит идею или готовый текст, описывает голос и музыкальный стиль — модель генерирует речь и звук. По словам руководителя продукта Suno Джека Броуди, компания тестировала Speech в небольшой группе в течение месяца. Функцию предлагают для стихов, медитаций и сказок на ночь, но в бета-версии ещё есть ошибки: например, британский акцент иногда звучит как австралийский.">
