<meta name="description" content="Google Research и Virginia Tech разработали WikiSkill — фреймворк, который помогает ИИ-агентам сохранять выводы из прошлых задач и использовать их для создания навыков. Вместо того чтобы каждый раз заново извлекать уроки из отдельных попыток, система собирает опыт в структурированную вики, а затем опирается на неё при обновлении навыков. В испытаниях на разных задачах и моделях WikiSkill превзошёл существующие методы развития навыков. Результаты также показали, что выигрыш может увеличиваться с размером модели, а навыки иногда переносятся между моделями. Для корпоративных команд это способ превращать журналы работы агентов в повторно используемые знания и процедуры.">
