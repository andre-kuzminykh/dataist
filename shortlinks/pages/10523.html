<meta name="description" content="По данным Bloomberg, бывший гендиректор Google Эрик Шмидт владеет примерно 1% Anthropic. В 2021 году он вложил десятки миллионов долларов в раунд Series A, когда стартап оценивался в $461 млн, сообщает PitchBook. Если оценка Bloomberg верна, доля Шмидта вдвое меньше пакета сооснователя и гендиректора компании Дарио Амодеи — у него около 2%. Anthropic, как ожидается, выйдет на биржу до конца года; верхние оценки её стоимости достигают $2 трлн. При такой оценке пакет Шмидта может увеличить его состояние на $20 млрд. Сейчас Bloomberg оценивает его в $57,5 млрд.">
