<meta name="description" content="AWS открыла доступ к Training Sessions — функции Amazon SageMaker AI, которая позволяет задавать собственный ход обучения модели, пока сервис управляет GPU. Объявление о запуске появилось 22 октября. Разработчики определяют процедуру обучения и критерии успеха, а SageMaker выделяет вычислительные ресурсы, распределяет работу между процессорами, восстанавливается после сбоев и сохраняет прогресс. Такой подход даёт командам больше контроля над обучением специализированных ИИ-агентов и снимает часть инфраструктурных задач, но сам по себе не гарантирует более дешёвую или качественную модель: результат зависит от задачи, данных и оценки.">
