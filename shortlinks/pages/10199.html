<meta name="description" content="Стартап Nous Research, создавший открытого ИИ-агента Hermes, привлёк $90 млн в раунде серии B при оценке в $1,5 млрд. Раунд возглавила Robot Ventures; среди участников — Nvidia, Union Square Ventures, Menlo Ventures, Samsung и 1789 Capital, где партнёром является Дональд Трамп-младший. Теперь общий объём финансирования трёхлетней компании составляет $158 млн. Деньги направят на запуск Hermes for Businesses: компании смогут настраивать ИИ-агентов для многоэтапных рабочих процессов, сохраняя приватность и безопасность данных.">
