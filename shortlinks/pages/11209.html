<meta name="description" content="Snapchat представила Easy Lens CLI — инструмент, который позволяет создавать AR-эффекты Lens с помощью ИИ-ассистентов для программирования, включая Claude Code, Cursor и Codex. Автору достаточно описать задумку обычным языком: ассистент соберёт эффект, подготовит предварительный просмотр и поможет опубликовать его в Snapchat. Для этого доступны более 100 строительных блоков дополненной реальности и 50 генераторов ИИ-ресурсов. Разработчики, участвующие в программе Lens+ Payouts, могут зарабатывать на созданных эффектах. В прошлом месяце Snapchat выплатила авторам сообщества Lens+ 1,8 млн долларов.">
