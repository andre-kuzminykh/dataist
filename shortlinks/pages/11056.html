<meta name="description" content="Сотрудники Google DeepMind в Великобритании обратились к государственному органу, чтобы добиться голосования о создании профсоюза. Профсоюзы Communication Workers Union и Unite the Union подали заявление в Центральный арбитражный комитет: он должен подтвердить, что у инициативы достаточно поддержки работников. Если голосование состоится и завершится успешно, около 1 000 сотрудников Google DeepMind, занятых разработкой продуктов, смогут вступить в профсоюз. Работодатель будет обязан по закону соблюдать результаты голосования.">
