<meta name="description" content="Геномные модели ИИ — например, Evo 2, Genos и AlphaGenome от Google DeepMind — учатся на огромных массивах данных и предсказывают, как различия в ДНК связаны с работой организма и его признаками, включая риск заболеваний. Но геном не похож на чертёж или программу с предсказуемым результатом: гены работают в зависимости от типа клетки, времени и внешних сигналов, а их активность регулируют множество взаимодействующих процессов. ИИ может помочь находить закономерности, однако для понимания того, как устроена жизнь, одних последовательностей ДНК и вычислительных моделей может быть недостаточно.">
