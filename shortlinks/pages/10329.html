<meta name="description" content="Google 13 октября открыла широкий доступ к мультимодальной модели Gemini 4 Argon. Раньше её тестировала ограниченная группа пользователей, а теперь модель доступна разработчикам и компаниям через платный Gemini API, Google AI Studio, среду разработки Antigravity и некоторые подписки Gemini Enterprise. До 30 ноября 2026 года миллион входных токенов стоит $2, выходных — $10; с 1 декабря цены удвоятся. Argon предназначена для разработки ПО, финансового анализа, юридической работы, кибербезопасности и научных задач. Google также сообщила, что более 100 000 её сотрудников ежемесячно пользуются моделью, а команды разработки увеличили число отправок кода агентами на 35% и сократили откаты кода на 30%.">
