<meta name="description" content="Authentic Brands Group, владеющая правами на музыку и образ Элвиса Пресли, подала в суд на Anthropic. Компания утверждает, что разработчик ИИ без разрешения использовал для обучения моделей 274 песни Пресли, среди них Can’t Help Falling in Love, All Shook Up и A Little Less Conversation. Иск подали в пятницу; первым о нём сообщил Billboard. Истцы требуют по $150 000 за каждую композицию — около $41 млн, или примерно £31 млн. Это один из первых крупных исков к разработчику ИИ, поданных напрямую наследниками артиста, и его исход может повлиять на то, как ИИ-компании используют музыкальные каталоги.">
