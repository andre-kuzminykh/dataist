<meta name="description" content="В торговом центре Spanish Springs в городе Спаркс, штат Невада, рядом с магазином Spirit Halloween, поставщиком слуховых аппаратов и вьетнамским рестораном зарегистрирована консалтинговая компания, получившая миллионы долларов от сети суперкомитетов политических действий в поддержку ИИ. По данным федеральной отчётности, с прошлого года фирма Lantern Production Consultants LLC получила около $20 млн за опросы, цифровую рекламу, исследования и стратегию. При этом, похоже, за пределами почтового ящика в торговом центре у компании нет другого видимого присутствия. Деньги выделял Think Big — часть сети Leading the Future, которая собрала более $140 млн для влияния на промежуточные выборы в интересах ИИ-индустрии.">
