<meta name="description" content="Nvidia представила Nemotron 3.5 Super VL — открытую модель на 120 млрд параметров для корпоративных ИИ-агентов — и две компактные модели Bolt для локального запуска. По заявлению компании, Super VL показывает точность, сопоставимую с более крупной Nemotron 3 Ultra, в задачах следования инструкциям и работы с инструментами, а после дообучения справляется с некоторыми задачами быстрее моделей Anthropic и OpenAI. Bolt предназначены для новых ПК с чипом Nvidia RTX Spark и рабочих станций DGX Spark. Super VL и Bolt 74B-A9B уже доступны, Bolt E4B появится позднее в этом месяце.">
