<meta name="description" content="Согласно исследованию Aleph Alpha, китайские ИИ-модели часто повторяют официальную позицию властей, отвечая на политически чувствительные вопросы, либо отказываются отвечать. В бенчмарке проверили модели Alibaba (Qwen), DeepSeek и Moonshot AI (Kimi) на 967 темах, включая площадь Тяньаньмэнь, Тайвань и Синьцзян. Система оценки Aleph Alpha признала сбалансированными лишь 17–41% ответов: остальные повторяли официальные тезисы, уклонялись от вопроса или отказывали в ответе. Результаты согласуются с китайскими правилами для моделей, доступных широкой публике, и прежними проверками.">
