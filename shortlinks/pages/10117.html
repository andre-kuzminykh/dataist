<meta name="description" content="HackerRank открыла клиентам Chakra — ИИ-агента, который проводит собеседования для разработчиков, наблюдает за их работой и оценивает не только результат, но и ход рассуждений. За шесть месяцев бета-тестирования Chakra провела более 500 000 интервью; среди компаний, опробовавших сервис, — Snowflake, Snorkel и Capgemini. HackerRank считает, что ИИ поможет работодателям оценивать критическое мышление, умение принимать решения и способность кандидатов работать с ИИ. По данным компании, подозрительные действия во время интервью с Chakra фиксировали на 70–80% реже, чем в сопоставимых традиционных тестах.">
