<meta name="description" content="Генеральный директор Meta Марк Цукерберг решил резко нарастить расходы на ИИ: компания продвигает мультяшного ИИ-маскота и переманила опытного руководителя Чирантана Десаи, чтобы он возглавил новое подразделение по работе с корпоративными клиентами. Но терпение инвесторов, похоже, на исходе. После того как Goldman Sachs усомнился в долгосрочных перспективах ИИ-стратегии Meta, распродажа акций с прошлой пятницы сократила состояние Цукерберга на бумаге почти на 20 миллиардов долларов. Акции Meta за последний месяц при этом выросли более чем на 28%. Вопрос в том, сколько денег инвесторы готовы выделить на ИИ-гонку и сможет ли она принести доход, который оправдает такие расходы.">
