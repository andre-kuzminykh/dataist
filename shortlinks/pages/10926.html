<meta name="description" content="Отчёт Ramp показывает, что расходы компаний на ИИ почти не росли в августе и сентябре, хотя они использовали больше токенов. За эти два месяца объём расходов на токены увеличился лишь на 1,5%; в июле рост месяц к месяцу составлял 42%. Данные ставят под вопрос ожидания инвесторов о непрерывном быстром росте ИИ-компаний: OpenAI и Anthropic снижают цены, а заказчики учатся экономнее расходовать ресурсы. В октябре рост ускорился до 8,9% за период с 23 сентября по 23 октября, но экономист Ramp Ара Харазиан считает, что сдерживающие факторы остаются сильными. Это происходит накануне возможного выхода Anthropic на биржу.">
