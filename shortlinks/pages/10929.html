<meta name="description" content="Thinking Machines, стартап бывшего технического директора OpenAI Миры Мурати, выпустил Inkling 2 Small — модель с открытыми весами, которая, по заявлению компании, стала самой сильной среди западных моделей этого типа. Она набрала 31 балл в Artificial Analysis Intelligence Index — на 18 больше предшественницы и примерно столько же, сколько Gemini 3.8 Flash от Google. Особенно выросли результаты в задачах, где модель самостоятельно выполняет последовательности действий. За это приходится платить: на одну задачу она тратит примерно в четыре раза больше выходных токенов, а обходится почти в шесть раз дороже предшественницы. Пока модель доступна через платформу Tinker, а веса компания обещает выпустить по лицензии Apache 2.0 после внешней проверки безопасности.">
