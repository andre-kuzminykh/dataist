<meta name="description" content="Врачи разработали систему ИИ, которая по обычной фотографии лица оценивает биологический возраст человека и прогнозирует шансы пациента с раком на выживание. Инструмент создали специалисты медицинской системы Mass General Brigham в Массачусетсе и обучили на более чем 40 миллионах фотографий людей разных возрастов и этнических групп. В исследовании пациенты, которые выглядели на пять и более лет старше своего возраста, имели на 21% более высокий риск смерти за средний период наблюдения в четыре года, а выглядевшие на пять и более лет моложе — на 17% более низкий. Результаты опубликованы в журнале Lancet Digital Health.">
