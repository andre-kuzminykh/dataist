<meta name="description" content="В Западной Вирджинии под угрозой оказалась роща из 200 устойчивых к каштановой гнили деревьев: её могут вырубить ради строительства крупного дата-центра Monarch Compute Campus. Проект развивает компания Nscale совместно с Nvidia и Caterpillar. По плану комплекс займёт более 2 250 акров и обеспечит вычислительную мощность в 8 гигаватт для компаний, работающих с ИИ, включая Anthropic. Инвестиции в проект превышают 20 миллиардов долларов. Рощу называют важным источником семян для восстановления американского каштана в Западной Вирджинии.">
