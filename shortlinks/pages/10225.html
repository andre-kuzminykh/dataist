<meta name="description" content="Четверо разработчиков из Атланты создали ArtCraft — бесплатный набор приложений с открытым исходным кодом, похожих на программы Adobe. Команда восстановила их возможности с помощью обратной разработки, чтобы предложить инструменты без обязательной подписки, облака и учётной записи. Проект пока активно развивается: некоторые приложения находятся на ранней альфа-стадии, а встроенные функции ИИ могут отвлекать от привычной ручной работы. Поэтому профессионалам, вероятно, пока рано отказываться от Adobe, но пользователи уже пробуют перейти на новую платформу.">
