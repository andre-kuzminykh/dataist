<meta name="description" content="Meta представила Muse Ember — свою самую маленькую и экономичную модель. Она рассчитана на рутинную работу ИИ-агентов: вызов инструментов, небольшие задачи по программированию, маршрутизацию запросов, извлечение данных и обработку длинных документов. По данным Meta, Muse Ember обеспечивает больше возможностей на каждый потраченный доллар, чем Claude Haiku 5.5 и GPT-6 Luna, при любом уровне рассуждений. В тесте Artificial Analysis одна задача стоит около $0,14: более крупная Muse Spark 1.3 набрала почти столько же баллов — 37 против 36, — но обходится в $2,39. В собственных тестах Meta Muse Ember лидирует в большинстве случаев, однако в реальных задачах по программированию Haiku опередила её в бенчмарке FrontierCode 2.0-AA: 34,9% против 27,2%.">
