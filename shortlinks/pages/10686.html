<meta name="description" content="Nvidia и Oracle открыли общий доступ к системам Vera Rubin NVL72 и отдельным процессорам Vera в облаке Oracle Cloud Infrastructure. Компании также планируют увеличить мощность своих Supercluster до нескольких гигаватт. Расширение рассчитано на разные задачи: GPU нужны для обучения и запуска передовых моделей, а CPU — для работы ИИ-агентов между обращениями к модели. По замыслу компаний, возможность отдельно масштабировать процессоры и ускорители поможет сократить неиспользуемые ресурсы. Для корпоративных клиентов вопрос в том, позволит ли такая конфигурация получать больше полезной работы за те мощности, за которые они уже платят.">
