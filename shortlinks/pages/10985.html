<meta name="description" content="Исследователи Google DeepMind с помощью нового фреймворка AlphaProof Code формально проверили несколько ключевых криптографических гарантий протокола Signal. Работа заняла четыре недели и не выявила новых уязвимостей в изученных частях протокола. При этом на старых версиях Signal система обнаружила известные уязвимости, давно исправленные разработчиками. Анализ не охватывал всё мобильное приложение Signal, а его спецификацию и доказательство исследователи опубликовали, чтобы помочь другим работам по формальной проверке программ.">
