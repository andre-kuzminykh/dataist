<meta name="description" content="NVIDIA Seattle Robotics Lab и инженерная команда NVIDIA Isaac разработали роботизированные системы для сборки тестовых лотков GB300. Они автоматизировали две операции: установку токоведущей шины с 16 винтами и подключение четырёх кабелей. Сборка шины удаётся более чем в 95% случаев, но занимает 160 секунд при целевом времени 124 секунды. Подключение кабелей занимает в среднем 40 секунд на каждый, а успешность составляет 90–95%. В работе пригодились классические методы планирования и управления, оценка позы DOPER, обучение с подкреплением и специальные детали захватов.">
