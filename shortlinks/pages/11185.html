<meta name="description" content="Исследователи Dharma-ИИ сравнили расчёт времени дообучения по числу операций с прогнозом CatBoost на 272 производственных запусках с NVIDIA H200 — всего около 7 382 часов работы графических процессоров. Обычная оценка объясняла лишь небольшую часть разброса и ошибалась в среднем на 12,41 часа. Модель, использующая только параметры, известные до запуска, достигла R² = 0,98: средняя абсолютная ошибка составила 1,71 часа, а медианная — 0,51 часа. Такой прогноз можно использовать при планировании заданий на общем кластере.">
