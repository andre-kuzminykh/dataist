<meta name="description" content="ИИ-стартап Instinct добавил персональные рекомендации товаров и мест в новую функцию Instinct Selections. Компания хочет дополнять ответы ИИ советами от местных поваров, дизайнеров, архитекторов и гидов. Но пользователи стали получать предложения без запроса: например, о багаже и дорожных аксессуарах. Некоторые восприняли это как рекламу и попросили сначала спрашивать, нужны ли им рекомендации. Instinct не сообщила, зарабатывает ли на них или планирует получать доход. Функция появилась вскоре после привлечения $1 млрд в раунде Series C, оценившем компанию в $10 млрд. По словам основателя Ноа Шинна, через агента проходит почти $1 млрд транзакций в год, более 50% из них связаны с путешествиями.">
