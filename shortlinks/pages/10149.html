<meta name="description" content="16-летнего подростка пришлось спасать у подножия крутой скалы «Вдоводел» на горе Краун-Маунтин в канадской провинции Британская Колумбия. По данным CTV News, он поднялся на гондоле на высоту более 4 000 футов — к вершине горы Граус, — а на обратном пути чат-бот Claude от Anthropic увёл его с маршрута. Это уже не первый случай, когда туристы оказываются в опасности, полагаясь на советы чат-ботов: в прошлом месяце троих путешественников в Каскадных горах Калифорнии пришлось эвакуировать после того, как ИИ Google посоветовал им взять слишком мало еды и воды.">
