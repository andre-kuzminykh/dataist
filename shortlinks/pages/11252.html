<meta name="description" content="Космическим центрам обработки данных нужны не только ракеты и сложная инженерия, но и подходящая схема финансирования. На Земле облачные провайдеры берут кредиты на строительство дата-центров, а купленные чипы служат залогом: если заёмщик не справляется с выплатами, кредитор может забрать оборудование и перепродать его. По данным Compute Credit Research Index, некоторые H100 продаются примерно за половину цены 2023 года, а отдельные конфигурации H200 — по цене, установленной при запуске в 2024-м. Но чипы на спутнике нельзя изъять так же, как оборудование в наземном дата-центре. Financial Times сообщает, что кредиторы, участвующие в финансировании закупки чипов для SpaceX на 40 млрд долларов, попросили не использовать их в орбитальных дата-центрах. Согласилась ли с этим SpaceX, неизвестно.">
