<meta name="description" content="Философ Томас Нагель считает нелепой мысль, что большие языковые модели могут обладать сознанием: их речь сама по себе не свидетельствует о внутреннем опыте, а дата-центры не похожи на нервную систему. По его мнению, люди всё равно будут верить, что чат-боты чувствуют, и это опасно — в том числе потому, что компаниям выгодно создавать такое впечатление. В интервью WIRED 89-летний почётный профессор Нью-Йоркского университета также обсудил моральный статус машин, общение с Claude и риск того, что ИИ ослабит мотивацию людей заниматься сложными интеллектуальными задачами.">
