<meta name="description" content="Google DeepMind представила Genie 4 — новую модель мира, пока в исследовательской версии. Она создаёт интерактивные сцены с более реалистичной графикой, генерирует подходящие к ним музыку, фоновые звуки и диалоги, а пользователи могут менять сцену прямо во время симуляции текстовыми промтами. Модель удерживает согласованную сцену до двух минут — вдвое дольше предыдущей версии Genie 3. Google также показала, как Gemini может планировать действия, а Genie 4 — моделировать их: такой подход позволит проверять сценарии для роботов до испытаний в реальном мире.">
