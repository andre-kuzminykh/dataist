<meta name="description" content="Компания TAS Rights Management, управляющая авторскими правами и брендом Taylor Swift, подала заявку на домен верхнего уровня .taylorswift. Он позволит ограничить регистрацию сайтов организациями, связанными с певицей, и, возможно, обладателями лицензий на её товарные знаки. Заявка поступила на фоне роста числа ИИ-агентов, с помощью которых стало проще создавать сайты, и прежних случаев злоупотребления именем Swift — в том числе волны порнографических дипфейков в 2024 году. ICANN сообщила более чем о 1 600 заявках на новые домены за этот год; рассмотрение .taylorswift будет включать сбор мнений сообщества до марта 2027 года.">
