<meta name="description" content="Профессор Йельского университета Джеффри Зонненфельд считает, что возвращение Дженсена Хуанга на пост гендиректора Nvidia и в совет директоров может обернуться для компании и её руководителей крупными судебными издержками. По его словам, совет восстановил Хуанга после давления администрации Дональда Трампа, хотя не завершил расследование его связей с подозреваемой китайской шпионкой Элис Хуанг. Зонненфельд также утверждает, что передовые чипы Nvidia попадают в Китай в обход экспортных ограничений и помогают создавать модели, основанные на разработках американских лабораторий. Компания отрицает сообщения о контрабанде своих самых передовых чипов в Китай.">
