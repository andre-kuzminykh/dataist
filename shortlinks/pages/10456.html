<meta name="description" content="После того как стартап Character.ИИ на этой неделе подал заявление о банкротстве, большинство его сотрудников смогут перейти на работу в Disney. Бывший гендиректор Character.ИИ Карандип Ананд недавно стал первым техническим директором Disney. Ранее стартап сообщил, что Disney согласилась купить часть его активов за 20 млн долларов. Согласно судебному документу, Disney предложит работу как минимум 60 сотрудникам Character.ИИ — это большинство штата. Их совокупная годовая компенсация, по оценке, составит 60 млн долларов. Большинство получивших предложения сотрудников их приняли, однако сделка оформлена как заявка начального покупателя: другая компания ещё может предложить больше.">
