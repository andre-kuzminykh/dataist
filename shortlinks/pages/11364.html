<meta name="description" content="США ограничили удалённый доступ китайских компаний к передовым чипам Nvidia в зарубежных дата-центрах, а OpenAI и Anthropic добились успеха в борьбе с дистилляцией своих моделей. По данным The Information, с сентября это уже осложняет работу китайских разработчиков, включая Deepseek, Moonshot AI и Alibaba: текущие проекты задерживаются, а разрыв с американскими моделями может увеличиться. Компании ищут обходные пути — арендуют вычислительные мощности через посредников, переходят на китайские чипы и вкладываются в данные для обучения с подкреплением.">
