<meta name="description" content="Компания Vals, оценивающая возможности ИИ, проверила, как модели справляются с многоэтапными задачами на имитациях корпоративных сетей. Закрытая Daybreak от OpenAI выполнила в среднем 81% заданий, а открытая DeepSeek — 73%; на отдельных заданиях результаты совпали. При этом атака с помощью DeepSeek обходится в $2–3, тогда как для GPT-6-Sol Vals оценивает расходы на токены в $17–46. По мнению исследователей, открытые модели уже начинают догонять передовые закрытые системы в киберзадачах.">
