<meta name="description" content="Deepseek выложила в открытый доступ DeepInfer — собственный фреймворк инференса, который помогает модели V4.1-Flash быстро отвечать на запросы при высокой нагрузке. Код опубликован по лицензии Apache 2.0. Компания также выпускает инструмент deepseek-recipe, воспроизводящий обработку токенов в официальном API Deepseek: благодаря этому самостоятельно запущенные модели должны работать так же, как через API. Deepseek рассчитывает помочь сообществу снизить расходы на вычисления и энергопотребление. Одновременно релиз усиливает ценовое давление на OpenAI и Anthropic.">
