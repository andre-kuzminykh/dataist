<meta name="description" content="Qantas планирует сократить 850 рабочих мест в Австралии и передать часть функций команде Accenture в Индии. Перестройка связана с многолетним соглашением о модернизации внутренних систем, процессов и данных авиакомпании и увеличением инвестиций в технологии и ИИ. Первые изменения ожидаются к середине следующего года. Это уже третий крупный план сокращений, объявленный австралийскими компаниями за три недели: ранее о перестройке сообщили Canva и National Australia Bank.">
