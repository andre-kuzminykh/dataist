<meta name="description" content="Стартап Elorian из Пало-Альто выпустил свою первую модель — Glimpse. Компания привлекла $55 млн на посевном раунде при оценке в $300 млн ещё до запуска продукта. Glimpse доступна в исследовательской версии через API, а доступ к чату пока открывают по списку ожидания. Модель не просто анализирует изображение один раз и описывает его словами: во время рассуждения она может приближать отдельные участки, выбирать кадры из видео и запускать код для измерений и сравнений. По данным Elorian, Glimpse превосходит GPT-6 Astra в анализе научных графиков и создании коротких описаний видео.">
