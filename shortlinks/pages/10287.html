<meta name="description" content="Vals AI проверила, дают ли команды ИИ-агентов лучший результат, чем одиночные агенты, на бенчмарке Vibe Code Bench. В испытании участвовали GPT-6 Sol и Claude Opus 5.5: каждую модель запускали отдельно и в составе команды, с двумя уровнями рассуждений — средним и максимальным. Команды обходились в 1,8–5,1 раза дороже. Из четырёх сравнений статистически значимый прирост качества обнаружился только в одном: команда GPT-6 Sol со средним уровнем рассуждений набрала на 7,3 балла больше одиночного агента. При максимальном уровне команды не дали заметного преимущества ни Sol, ни Opus 5.5.">
