<meta name="description" content="Во вторник акции полупроводниковых компаний пошли вниз после того, как глава Broadcom сравнил многих инвесторов в ИИ с игроками казино, а китайский производитель памяти CXMT сообщил об успехах в разработке новой архитектуры чипов. Южнокорейский индекс Kospi потерял 6,25%, акции Samsung Electronics — 7,4%, а SK Hynix — 10%. Инвесторы опасаются, что CXMT сможет потеснить крупнейших производителей памяти. Одновременно рынок тревожат огромные расходы на инфраструктуру ИИ, которые компании финансируют за счёт заёмных средств.">
