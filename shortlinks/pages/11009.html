<meta name="description" content="Nvidia представила GR00T 2 — модель, которая переносит движения человека из видео на роботизированную руку и может сократить необходимость в удалённом управлении роботами при обучении. Вместо того чтобы сразу превращать изображение и команду в движение, GR00T 2 одновременно предсказывает следующее действие робота и короткое видео ближайшего будущего. В лабораторных испытаниях роботы с пяти пальцами зажигали спички, резали бананы и бросали посылки на ленту; успех в зависимости от задачи составлял от 10 до 80%. Но для надёжной работы системе пока мешают, среди прочего, отсутствие обработки данных осязания и медленная работа языковой модели-планировщика.">
