<meta name="description" content="Aleph Alpha представила Kolibri — немецко-английскую модель с открытыми весами на 78 млрд параметров. Благодаря архитектуре «смесь экспертов» на каждый токен приходится около 3 млрд активных параметров. Компания утверждает, что Kolibri сочетает качество и стоимость эксплуатации лучше сопоставимых моделей на обеих языковых версиях; некоторые из них вышли значительно раньше — в марте и апреле 2026 года. Модель обучали на данных, где на немецкий язык пришлось 21,3%. Для проекта Aleph Alpha создала отдельный немецкий дата-пайплайн, а синтетические обучающие данные генерировали также с помощью китайских моделей.">
