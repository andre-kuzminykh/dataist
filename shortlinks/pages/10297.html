<meta name="description" content="Мэттью Ботвиник, старший научный сотрудник Йельской школы права, считает, что безопасность ИИ зависит от сохранения конституционной демократии и верховенства закона. Даже система, которая не выходит из-под контроля людей, не запускает кибератаки и не создаёт биологическое оружие, может стать инструментом слежки и подавления — если работает при авторитарной власти. ИИ одновременно способен помочь науке и медицине, улучшить образование и государственные услуги, но может усилить экономическую нестабильность, расширить чрезвычайные полномочия властей и ослабить влияние граждан. Поэтому автор призывает обновить законы, вовлекать людей в управление и требует от ИИ-компаний активнее защищать демократические принципы.">
