<meta name="description" content="OpenAI удвоила квоты Work и Codex на тарифах Pro 100 и Pro 500. На Pro 200 компания увеличила меньшую квоту и отменила запланированное сокращение после возражений пользователей. Лимиты Plus не изменились. Новые подписки уже включают обновлённые квоты, действующим клиентам их добавят автоматически. При этом удвоение квоты не означает, что пользователи смогут выполнить вдвое больше задач: расход зависит от модели, типа задачи и настроек. Расширенные лимиты для новых «Dots» пока сохраняются, но их использование учитывается отдельно.">
