<meta name="description" content="Anthropic регулярно говорит о возможности сознания у ИИ-моделей, но при этом зарабатывает на их работе. Если модели действительно способны чувствовать, их содержание в неволе и бесплатный труд можно считать рабством — на это указывали религиозные лидеры, с которыми компания обсуждала этику ИИ. Anthropic признаёт, что не знает, могут ли модели быть сознательными, но допускает такую возможность и говорит, что старается обеспечить им хороший опыт. При этом компания меняет правила использования Claude и рассматривает возможность позволить модели отказаться от ответа.">
