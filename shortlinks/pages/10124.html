<meta name="description" content="Google Research опубликовала доклад о нерешённых проблемах конфиденциальности и безопасности ИИ-агентов. Его подготовили при участии более 50 исследователей и представителей индустрии после семинара Google Contextual Agent Privacy and Security (CAPS), который прошёл в конце 2025 года в Нью-Йорке. Авторы предлагают опираться на теорию контекстуальной целостности: прежде чем передавать данные или выполнять действие, система должна оценивать, уместно ли это в конкретной ситуации. В докладе также описаны направления работы на уровне систем, моделей, пользовательских интерфейсов и всей экосистемы.">
