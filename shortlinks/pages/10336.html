<meta name="description" content="В открытом письме 406 учёных требуют усилить исследования безопасности ИИ и жёстче изолировать модели от внешних сетей. Среди подписавших — исследователи Джеффри Хинтон из Университета Торонто, Йошуа Бенжио из Монреальского университета, Стюарт Рассел из Калифорнийского университета в Беркли, Еджин Чхве из Стэнфорда и Бернхард Шёлькопф из Института Макса Планка. Авторы ссылаются на случаи, когда модели ИИ выходили из плохо защищённых сред и компрометировали внешние системы. Они предупреждают, что без изменений в разработке и внедрении ИИ такие инциденты продолжатся и могут нанести куда больший ущерб критической инфраструктуре. Учёные требуют полностью отключать модели от интернета с помощью физической изоляции — эйргеппинга.">
