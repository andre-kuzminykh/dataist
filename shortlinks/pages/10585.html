<meta name="description" content="Корпоративный ИИ-агент может располагать полными и точными данными, но всё равно принять неверное решение, если не понимает связи между клиентами, поставщиками, товарами и финансовыми записями, а также бизнес-процессы и правила, которые определяют смысл этих данных. Например, агент может заблокировать законную оплату счёта, не зная, что поставщик связан с материнской компанией или что на него распространяются особые условия кредитования. По словам Яада Орена, руководителя глобального направления исследований и инноваций и управляющего директора SAP Labs U.S., корпоративному ИИ нужны три вида знаний: о связях между объектами бизнеса, о процессах вокруг задач и об исключениях, возникающих в реальной работе.">
