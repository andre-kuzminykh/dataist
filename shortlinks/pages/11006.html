<meta name="description" content="Anthropic представила Claude Meetings, Claude Whiteboards и Claude Sheets — функции для командной работы, которые переводят обсуждения в планы и задачи, помогают совместно оформлять идеи и создавать таблицы. Claude Meetings подключается к видеозвонку и выполняет задачи прямо во время разговора; Whiteboards превращает обсуждение в наглядный план, а Sheets создаёт рабочие электронные таблицы. Все три функции доступны в бета-версии на платных тарифах, а Meetings на старте работает с Google Meet. Компания также открыла Claude Data для всех пользователей и добавила интерактивные подключения к приложениям.">
