<meta name="description" content="Microsoft разработала платформу Industry Evaluation Data Generation Platform, которая создаёт синтетические корпоративные среды для проверки Microsoft Copilot. Они воспроизводят рабочие процессы разных отраслей, но не используют данные клиентов. На таких данных компания проверяет, насколько Copilot точно отвечает на запросы сотрудников и учитывает контекст организации. По оценке Microsoft, автоматизация сократила создание набора для оценки с нескольких дней ручной работы до автоматических запусков и сэкономила около $100 000 на каждом наборе, или $300 000 за весь проект. В синтетических средах также автоматически проверяют безопасность контента и отсутствие личных данных.">
