<meta name="description" content="Anthropic расширила программу Cyber Verification Program (CVP): проверенные специалисты по безопасности смогут получать доступ к моделям Claude с разным уровнем киберзащит. В программе теперь три уровня — Defense Access, Red Team Access и Specialized Access. Они предназначены для оборонительных задач, разрешённого тестирования и проверки особо чувствительных систем. Компания также опубликовала результаты испытаний Claude Opus 5.5 на бенчмарке CyScenarioBench и сообщила, что участники Project Glasswing выявили не менее 129 000 подтверждённых уязвимостей с апреля по июль 2026 года.">
