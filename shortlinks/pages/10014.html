<meta name="description" content="Satlyt, основанная бывшим менеджером Google и SpaceX Рамой Афулло, привлекла $8 млн посевных инвестиций на разработку ПО для спутников. Оно должно позволить запускать ИИ-модели на борту и распределять вычислительные задачи между аппаратами разных компаний. Уже в четверг ПО Satlyt отправится в космос на ракете SpaceX — вместе с первым прототипом проекта Google по созданию космического дата-центра Project Suncatcher. Пока компания сосредоточена на обработке данных и повышении эффективности спутников, а в следующем году рассчитывает испытать облачную систему, объединяющую два аппарата.">
