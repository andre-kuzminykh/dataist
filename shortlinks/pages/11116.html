<meta name="description" content="Компаниям со средним оборотом не подходит стратегия ИИ, просто уменьшенная до масштаба Fortune 500. При выручке от $500 млн до $5 млрд они конкурируют за тех же специалистов по ИИ, данным и безопасности — и платят им те же зарплаты, располагая куда меньшими бюджетами. По словам Джека Азагури, президента и генерального директора Insight, таким компаниям не нужно создавать крупные внутренние ИИ-подразделения. Вместо этого стоит выбрать несколько проектов с измеримой отдачей, оставить внутри команды, отвечающие за стратегию и архитектуру, а узкую инженерную и защитную экспертизу привлекать по мере роста проектов.">
