<meta name="description" content="Qualcomm и Arm снова встретились в суде Уилмингтона — почти через два года после процесса, завершившегося в декабре 2024 года в пользу Qualcomm. Теперь Qualcomm обвиняет Arm в нарушении договора. В первый день слушаний обсуждали лицензии на архитектуру и технологии, роялти и проверку совместимости процессоров Qualcomm с архитектурой Arm. Но спор касается и более широкого вопроса: сможет ли Arm оставаться нейтральной основой отрасли, если сама начнёт конкурировать с компаниями, которым лицензирует свои разработки.">
