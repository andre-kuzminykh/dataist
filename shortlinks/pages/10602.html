<meta name="description" content="Шошана Бергер и Нина Уиллдорф, бывшие редакторы журналов, создали Aged Intelligence Society — клуб, который проводит закрытые ужины для женщин и помогает им применять ИИ к повседневным задачам. На встречах участницы приносят ноутбуки и личную «задачу среднего возраста»: например, разобраться в страховых документах или оценить стоимость своей работы. Спрос на ужины превысил число мест с самого начала, а рассылка клуба на Substack быстро набрала более 1 000 подписчиков. Бергер и Уиллдорф считают, что женщинам важно освоить ИИ, чтобы эффективнее справляться с нагрузкой и оставаться востребованными в работе.">
