<meta name="description" content="11 октября марсоход NASA Perseverance довёл общий путь по Марсу до 28,10 мили — 45,22 километра, установив новый рекорд среди марсоходов. Во многом это стало возможным благодаря автономному вождению: за последние пять лет его систему управления обновляли. О том, как Perseverance обошёл прежнего рекордсмена Opportunity и сможет ли в будущем работать неделями без помощи людей, IEEE Spectrum поговорил с Марком Маймоне, заместителем руководителя группы роботизированных операций Perseverance в Лаборатории реактивного движения NASA. Он разрабатывал системы самостоятельного вождения для марсоходов Spirit, Opportunity, Curiosity и Perseverance.">
