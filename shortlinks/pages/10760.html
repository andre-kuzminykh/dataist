<meta name="description" content="Сервис Zest, запущенный в начале года для поиска ресторанов, представил ИИ-консьержа в текстовых сообщениях. Он подбирает заведения с учётом вкусов пользователя и его друзей, отвечает на вопросы о ресторанах и помогает забронировать столик через OpenTable, Resy и SevenRooms. Консьержа можно добавить в групповой чат: он объединит предпочтения участников, поможет выбрать место с помощью голосования и оформит бронь, не выводя разговор за пределы переписки. Zest рассчитывает, что такой формат поможет привлечь больше пользователей и получать доход от бронирований и заказов еды.">
