<meta name="description" content="Активисты из нидерландской группы Geef Tegengas проникли на стройку дата-центра Microsoft в амстердамском районе Вестпорт и столкнулись с полицией. Некоторые забрались на кран, зажгли сигнальные огни и привязали к оборудованию гелиевые шары. Отдельно у ограждения прошла акция общеевропейской кампании Stop Dirty Data Centres: более 100 групп за два дня потребовали приостановить строительство новых дата-центров. Протесты связаны с экологическими и социальными последствиями расширения инфраструктуры для ИИ.">
