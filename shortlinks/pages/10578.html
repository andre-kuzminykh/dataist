<meta name="description" content="OpenAI вместе с PerturbAI и Scripps Research запустила тысячи ИИ-агентов для анализа биологических данных миллионов клеток мышиного мозга. Агенты на GPT-Rosalind обработали атлас всего мозга, показывающий, как изменения генов влияют на разные типы клеток. Работа заняла 32 минуты; вручную такой анализ, по оценке команды, занял бы от нескольких месяцев до года. Агенты выявили различия между двумя связанными с заболеваниями генами и возможную связь регуляции холестерина с нейродегенерацией. В слепом сравнении эксперты в 75% случаев предпочли отчёты группы агентов отчётам одного агента. «Атлас рассуждений» опубликован на GitHub, а сопутствующая статья — на bioRxiv.">
