<meta name="description" content="Чуть больше недели назад сообщалось, что годовой темп выручки OpenAI приближается к $70 млрд — это сопоставимо с показателями Anthropic. Теперь Financial Times пишет, что OpenAI сообщила инвесторам о выручке, приближающейся к $50 млрд, то есть примерно на $20 млрд меньше. Оценка в $70 млрд, по данным издания, возникла из попыток инвесторов OpenAI напрямую сравнить выручку компаний. При этом их расчёты различаются: Anthropic учитывает продажи облачных партнёров, а OpenAI — нет.">
