<meta name="description" content="OKA выпустила Mori — домашний робот-ночник в форме гриба. Он следит за движениями хозяина, светится разными цветами, издаёт мягкие звуки и может включить звуки природы или провести дыхательную практику. Mori не отвечает на вопросы и не управляет умным домом. Версия Founder’s Edition стоит $649 и доступна с сегодняшнего дня ограниченным тиражом — всего несколько сотен устройств; стандартная версия обойдётся в $799. Основатель OKA Хуа Ван говорит, что Mori должен помочь людям почувствовать связь с природой и друг с другом.">
