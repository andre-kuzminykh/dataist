<meta name="description" content="OpenAI сообщила, что пресекла скоординированную кампанию по извлечению скрытых рассуждений своих моделей. С 1 июля активность росла, а 24 и 25 июля достигла 16 000 запросов от более чем 4 000 пользователей. Компания связала основную группу с людьми, связанными с Moonshot AI, разработчиком языковой модели Kimi, и сообщила, что закрыла более 15 000 аккаунтов. Однако исследователи обнаружили, что 13 сентября похожие атаки всё ещё работали на Microsoft Azure: там удалось получить рассуждения всех проверенных моделей OpenAI, включая GPT-6 Astra, и моделей Anthropic вплоть до Sonnet 5.">
