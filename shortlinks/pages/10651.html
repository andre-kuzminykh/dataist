<meta name="description" content="В исследовании Microsoft, опубликованном в журнале Science, модель MAI-DxO ставила диагнозы более чем вдвое точнее врачей общей практики. Её проверяли на 304 клинико-патологических случаях из New England Journal of Medicine и 325 обращениях в отделения неотложной помощи из базы MIMIC-IV-ED. Модель задавала вопросы и выбирала анализы по ходу разбора, а не получала готовое описание случая. Однако испытания проходили на подготовленных медицинских материалах, поэтому их результаты пока не доказывают, что ИИ справится лучше врача в реальной клинике.">
