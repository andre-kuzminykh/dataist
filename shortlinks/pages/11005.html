<meta name="description" content="Google DeepMind представила Gemini Robotics 2.5 — модель для управления роботами, которая обрабатывает изображения и языковые инструкции и превращает их в движения. В пилотном проекте на действующих производственных линиях Mercedes-Benz в Венгрии и Германии человекоподобный робот Apollo 2 от Apptronik сортировал металлические детали с заявленной успешностью 96%. По данным Google DeepMind, на разных задачах модель показывает результат на 30–100% выше, чем прежние собственные разработки компании, и выполняет задания на 20–30% быстрее.">
