<meta name="description" content="ИИ-агент может научиться решать сложные задачи не только на собственных попытках, но и на удачном опыте других. Авторы предлагают превращать готовые решения в понятные инструкции, которые модель сможет применять в новых условиях. Перед обучением система проверяет эти инструкции и отбрасывает те, где случайно раскрыт ответ или способ проверки. Так удачный опыт разных ИИ-агентов становится полезнее: модель учится не просто повторять найденное решение, а действовать самостоятельно. В этом обзоре разбираем, как устроен такой способ обучения и почему переписанные решения помогают ИИ справляться с большим числом сложных задач.">
