<meta name="description" content="Toyota планирует превратиться в глобальную робототехническую компанию и рассчитывает на гуманоидных роботов и автоматизацию производства. По данным Financial Times, автопроизводитель собирается развернуть 400 000 роботов в рамках ежегодных инвестиций на $6,4 млрд. В июле робототехническая компания Walden Robotics, выделившаяся из Toyota и работающая в сфере ИИ, вышла на биржу с оценкой в $1,1 млрд и привлекла $300 млн. Аналитики Goldman Sachs считают, что к 2035 году Toyota может занять от 3 до 8% рынка гуманоидных роботов.">
