<meta name="description" content="Figma расширяет поддержку открытого стандарта MCP, хотя сооснователь компании Дилан Филд считает, что протоколу есть куда развиваться. На первой конференции Config в Индии компания объявила о 20 новых партнёрах MCP, среди них — Amp, ClickUp, Dia, Junie by JetBrains, Linear, Meta Muse, Mistral, Notion, OpenCode и Sarvam Agents. Филд также объяснил, почему Figma не хочет открывать через MCP все свои данные: чем больше ресурсов доступно, тем выше риск злоупотреблений.">
