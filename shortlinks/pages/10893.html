<meta name="description" content="Google Research представила систему ИИ, которая использует датчики обычных умных часов для пассивного выявления признаков высокого давления — без калибровки манжетой. Система ИИ-PPG-ACC-HTN анализирует сигналы за несколько дней и в исследовании на 196 участниках показала результаты, сопоставимые с традиционными измерениями в рамках клинического обследования. Работа опубликована в Nature; её выводы также помогли разработать функцию отслеживания тенденций артериального давления в приложении Google Health.">
