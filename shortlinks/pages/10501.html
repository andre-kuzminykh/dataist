<meta name="description" content="Компании, которые запускают в работу десятки и сотни ИИ-агентов, сталкиваются с быстро растущими рисками, расходами и нагрузкой на контроль, говорит Феликс Ван де Мале, сооснователь и гендиректор Collibra, компании в сфере управления данными. В разговоре с основателем и гендиректором VentureBeat Мэттом Маршаллом на мероприятии ИИ Week в Нью-Йорке он связал сбои агентов прежде всего с нехваткой бизнес-контекста и призвал заранее установить чёткие правила их работы. По данным опроса VentureBeat среди 157 руководителей в сфере корпоративных технологий, более 75% компаний упираются в производственные ограничения при переходе от одного помощника к 10–15 автономным агентам. При этом 34% разрешают агентам выпускать код или менять системы без проверки человеком, полагаясь только на автоматические оценки, хотя полностью доверяют таким оценкам лишь 5% опрошенных.">
