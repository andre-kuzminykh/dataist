<meta name="description" content="На первом MIT Future Fest Тони Фаделл показал три ИИ-гаджета, которые когда-то активно обсуждали, но уже сняли с производства: Rabbit R1, Humane Ai pin и подвеску Limitless. Он назвал их устройствами первого поколения: создатели просили его помочь, но он отказался. По мнению Фаделла, гаджеты не решали конкретных проблем пользователей и оставались любопытной технологией для энтузиастов. Следующее поколение персональных ИИ-ассистентов, считает он, должно заслужить доверие, бережно обращаться с данными и выполнять основную работу прямо на устройстве.">
