<meta name="description" content="В бенчмарке TheoPhysEval агенты для программирования решали 50 неопубликованных задач по теоретической физике без подсказок от людей. GPT-6-Astra, запущенная в Codex от OpenAI, справилась с 49 задачами: точность составила 98%, а весь запуск обошёлся примерно в 116 долларов — меньше 2,40 доллара на задачу. Авторы считают, что современные модели уже могут выполнять отдельные расчёты на уровне ведущих специалистов. Но до новых открытий этого пока не хватает: агентам недостаёт научного «чутья» — способности выбирать интересные вопросы и менять задачу, если она оказывается слишком сложной.">
