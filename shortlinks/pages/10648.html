<meta name="description" content="США и Китай сосредоточили у себя мировой рынок ИИ: развитие отрасли требует таких объёмов капитала, энергии и передовых чипов, которые другие страны не могут обеспечить. В эссе для Foreign Affairs историк Найл Фергюсон, исследовательница Лиза Клаассен и бывший глава Google Эрик Шмидт сравнивают американские ИИ-компании с колониальными торговыми империями. По их мнению, США предлагают закрытые системы в обмен на политическую лояльность, а Китай распространяет открытые модели и свои стандарты. Обе державы сталкиваются с растущими финансовыми ограничениями, а главным риском для всей цепочки поставок ИИ остаётся возможный конфликт вокруг Тайваня и TSMC.">
