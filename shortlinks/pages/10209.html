<meta name="description" content="Google представила универсального ИИ-агента Gemini для рабочих задач: он может искать информацию, создавать документы, писать код, координировать других ИИ-агентов и работать над поручениями часами или днями, сохраняя память, рабочий контекст и свою идентичность в разных приложениях и на разных устройствах. Анонс прозвучал в четверг на мероприятии Gemini at Work 2026. Google хочет объединить разрозненные корпоративные помощники и инструменты в одну платформу: сотрудник ставит цель, а агент сам выбирает порядок действий, подключает нужные системы и возвращает результат. Он будет доступен через Gemini Enterprise и привычные интерфейсы Google Workspace, Microsoft 365 и Slack — отдельное приложение не потребуется. Google пока не уточнила, как именно включать нового агента и когда появятся все его возможности. Помимо моделей Gemini, агент уже поддерживает Claude от Anthropic; в планах — другие закрытые и открытые модели.">
