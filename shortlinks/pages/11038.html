<meta name="description" content="CoreWeave, облачный провайдер, сдающий в аренду вычислительные мощности для ИИ, просит клиентов платить авансом, привлекает займы под конкретные контракты и заключает более короткие соглашения, позволяющие устанавливать более высокие цены. За третий квартал компания отчиталась о выручке в $3,66 млрд — на 168% больше, чем годом ранее, — и чистом убытке в $709 млн; расходы на проценты составили $846 млн. Новая схема должна помочь профинансировать строительство дата-центров и выполнить заказы на $132,5 млрд, не прибегая к необеспеченным займам.">
